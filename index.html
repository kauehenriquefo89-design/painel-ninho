function renderInadimp(){
  const el=document.getElementById("sec-inadimp");
  if(!APP){el.innerHTML=splashHTML();return;}

  // Base: todas as contas a receber do sistema (Conta Azul, ao vivo).
  // Filtro de período é aplicado por VENCIMENTO (não competência).
  const hoje=new Date().toISOString().slice(0,10);
  const all=(APP.crRows||[]).filter(r=>r.venc&&r.faturado>0);

  if(!all.length){
    el.innerHTML=`<div class="src-info">⚠ Inadimplência: contas a receber do Conta Azul (por vencimento)</div>
    <div class="no-data">Sem contas a receber no sistema.<br><span style="font-size:11px;color:var(--muted)">${UNIT==="vm"?"A Vila Mariana ainda não tem Conta Azul alimentado.":"Conecte o Conta Azul."}</span></div>`;
    return;
  }

  // Filtro de período opcional (por mês de VENCIMENTO)
  const noPeriodo=r=>{
    const mv=r.venc.slice(0,7);
    if(MESES_SEL.length>0)return MESES_SEL.includes(mv);
    if(CUR_MES!=="TOTAL"&&!dtFrom&&!dtTo)return mv===CUR_MES;
    if(dtFrom&&mv<dtFrom.slice(0,7))return false;
    if(dtTo&&mv>dtTo.slice(0,7))return false;
    return true;
  };

  // INADIMPLÊNCIA = venceu (venc < hoje) e ainda tem valor em aberto
  const venc=all.filter(noPeriodo).filter(r=>r.venc<hoje && r.emAberto>0.005);

  const diasAtraso=v=>Math.floor((new Date(hoje+"T12:00:00")-new Date(v+"T12:00:00"))/86400000);
  const faixaDe=dias=>dias<=30?0:dias<=60?1:dias<=90?2:3;
  const FAIXAS=[{n:"1–30 dias",c:"#f0a842"},{n:"31–60 dias",c:"#e8803a"},{n:"61–90 dias",c:"#e0562f"},{n:"90+ dias",c:"#c0392b"}];

  venc.forEach(r=>{r._dias=diasAtraso(r.venc);r._faixa=faixaDe(r._dias);});

  const totVencido=venc.reduce((a,r)=>a+r.emAberto,0);
  // A vencer (em aberto, mas ainda não venceu) — informativo
  const aVencer=all.filter(noPeriodo).filter(r=>r.venc>=hoje && r.emAberto>0.005).reduce((a,r)=>a+r.emAberto,0);
  const clientesSet=new Set(venc.map(r=>r.cliente));

  // Aging por faixa
  const porFaixa=[0,0,0,0]; venc.forEach(r=>porFaixa[r._faixa]+=r.emAberto);

  const kpis=`<div class="cards">
    ${kCard("Vencido em aberto",fR(totVencido),"","var(--red)","Inadimplência (venc. < hoje)")}
    ${kCard("Clientes inadimplentes",clientesSet.size+"","","var(--muted)","Com parcela vencida")}
    ${kCard("A vencer (em aberto)",fR(aVencer),"","var(--blue)","Ainda não vencido")}
    ${kCard("Vencido há +90 dias",fR(porFaixa[3]),"",porFaixa[3]>0?"var(--red)":"var(--green)","Risco alto")}
  </div>`;

  // Gráfico de aging
  const agingData=FAIXAS.map((f,i)=>({l:f.n,v:porFaixa[i]})).filter(x=>x.v>0);
  const grafAging=agingData.length?`<div class="panel"><div class="pt">Vencido por faixa de atraso (aging)</div>
    <div class="cwrap">${barH(agingData,520,26,150)}</div></div>`:"";

  // Por cliente, com quebra de aging
  const byCli={};
  venc.forEach(r=>{
    const n=r.cliente||"Sem identificação";
    if(!byCli[n])byCli[n]={n,tot:0,f:[0,0,0,0],pior:0};
    byCli[n].tot+=r.emAberto; byCli[n].f[r._faixa]+=r.emAberto;
    if(r._dias>byCli[n].pior)byCli[n].pior=r._dias;
  });
  const clientes=Object.values(byCli).sort((a,b)=>b.tot-a.tot);

  const tblCli=`<div class="panel"><div class="pt">⚠ Clientes inadimplentes (${clientes.length}) — por tempo de atraso</div>
  <div class="tw"><table id="tbl-inad" style="width:100%;min-width:720px">
  <thead><tr>
    <th>Cliente</th>
    <th class="r" style="color:#f0a842">1–30</th>
    <th class="r" style="color:#e8803a">31–60</th>
    <th class="r" style="color:#e0562f">61–90</th>
    <th class="r" style="color:#c0392b">90+</th>
    <th class="r font-bold">Total vencido</th>
    <th class="r">Atraso máx.</th>
  </tr></thead><tbody>
  ${clientes.map(c=>`<tr>
    <td class="b">${c.n}</td>
    <td class="r mn" style="color:${c.f[0]?"#f0a842":"var(--muted)"}">${c.f[0]?fR(c.f[0]):"—"}</td>
    <td class="r mn" style="color:${c.f[1]?"#e8803a":"var(--muted)"}">${c.f[1]?fR(c.f[1]):"—"}</td>
    <td class="r mn" style="color:${c.f[2]?"#e0562f":"var(--muted)"}">${c.f[2]?fR(c.f[2]):"—"}</td>
    <td class="r mn" style="color:${c.f[3]?"#c0392b":"var(--muted)"}">${c.f[3]?fR(c.f[3]):"—"}</td>
    <td class="r mn b" style="color:var(--red)">${fR(c.tot)}</td>
    <td class="r"><span class="bdg ${c.pior>90?"br":c.pior>30?"bo":"bg"}">${c.pior} dias</span></td>
  </tr>`).join("")}
  <tr style="background:var(--hover);font-weight:700;border-top:2px solid var(--border)">
    <td class="b">TOTAL</td>
    <td class="r mn">${fR(porFaixa[0])}</td>
    <td class="r mn">${fR(porFaixa[1])}</td>
    <td class="r mn">${fR(porFaixa[2])}</td>
    <td class="r mn">${fR(porFaixa[3])}</td>
    <td class="r mn rd">${fR(totVencido)}</td>
    <td class="r"></td>
  </tr>
  </tbody></table></div></div>`;

  // Detalhe das parcelas vencidas (título ordenado por atraso)
  const parc=[...venc].sort((a,b)=>b._dias-a._dias).slice(0,200);
  const tblParc=`<div class="panel"><div class="pt">Parcelas vencidas (${venc.length}${venc.length>200?" — mostrando 200 mais antigas":""})</div>
  <div class="tw"><table style="width:100%;min-width:700px">
  <thead><tr><th>Cliente</th><th>Descrição</th><th class="r">Vencimento</th><th class="r">Atraso</th><th class="r">Em aberto</th></tr></thead><tbody>
  ${parc.map(r=>`<tr>
    <td class="b">${r.cliente}</td>
    <td style="font-size:11px;color:var(--muted)">${(r.descricao||r.cat||"").slice(0,40)}</td>
    <td class="r mn">${r.venc.slice(8)+"/"+r.venc.slice(5,7)+"/"+r.venc.slice(2,4)}</td>
    <td class="r"><span class="bdg ${r._dias>90?"br":r._dias>30?"bo":"bg"}">${r._dias}d</span></td>
    <td class="r mn rd">${fR(r.emAberto)}</td>
  </tr>`).join("")}
  </tbody></table></div></div>`;

  el.innerHTML=`<div class="src-info">⚠ Inadimplência: contas a receber do Conta Azul (ao vivo) · considera apenas o que <b>já venceu e não foi pago</b>, pela data de <b>vencimento</b> · em ${hoje.slice(8)+"/"+hoje.slice(5,7)+"/"+hoje.slice(0,4)}</div>
  ${kpis}${grafAging}${tblCli}${tblParc}`;
}

function render(){

    if(!APP){

        ?'<div class="spinner-wrap"><div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Carregando dados do Conta Azul…</p></div>'
        :splashHTML();
      return;
    }
    if(CUR_TAB==="dre")        renderDRE();
    else if(CUR_TAB==="ticket")     renderTicket();
    else if(CUR_TAB==="prof")       renderProf();
    else if(CUR_TAB==="disc")       renderDisc();
    else if(CUR_TAB==="cat")        renderCat();
    else if(CUR_TAB==="fluxo")      renderFluxo();
    else if(CUR_TAB==="inadimp")    renderInadimp();

}

function updateHeaderKPIs(){
  if(!APP||!APP.byMes)return;
  const d=getActiveData();if(!d)return;
  const imp=d.impostos||calcImpostos(d.rl||0);
  const rb_hdr=(d.rb_excel||d.rl||0);
  document.getElementById("hkpis").innerHTML=`<div class="hk"><div class="hkl">Receita</div><div class="hkv">${fR(rb_hdr)}</div></div><div class="hk"><div class="hkl">L.Bruto</div><div class="hkv">${fR(d.lucro_bruto||d.rl-d.rep||0)}</div></div><div class="hk"><div class="hkl">Impostos</div><div class="hkv">${fR(imp.total||0)}</div></div><div class="hk"><div class="hkl">Resultado</div><div class="hkv">${fR(d.ll||0)}</div></div>`;
}
function buildMesBar(){
  const c=document.getElementById("mes-btns");if(!c)return;
  if(!MESES.length){c.innerHTML='<button class="mfb a">—</button>';return;}
  const mesesVisiveis=MESES.filter(m=>!m.endsWith("-12"));
  const isMultiTab=["dre","ticket","prof","disc","cat"].includes(CUR_TAB);
  if(isMultiTab){
    // Modo DRE: multi-select com hint
    let h=`<span style="font-size:10px;color:var(--muted);margin-right:6px">Selecione até 6 meses:</span>`;
    h+=`<button class="mfb${MESES_SEL.length===0?" a":""}" onclick="setMesDRE('TOTAL')">📅 Total</button>`;
    mesesVisiveis.forEach(m=>{
      const sel=MESES_SEL.includes(m);
      h+=`<button class="mfb${sel?" a":""}" onclick="setMesDRE('${m}')">${monthLabel(m)}</button>`;
    });
    c.innerHTML=h;
  } else {
    // Outras abas: single select
    let h=`<button class="mfb${CUR_MES==="TOTAL"&&!dtFrom&&!dtTo?" a":""}" onclick="setMes('TOTAL',this)">📅 Total</button>`;
    mesesVisiveis.forEach(m=>{h+=`<button class="mfb${CUR_MES===m&&!dtFrom&&!dtTo?" a":""}" onclick="setMes('${m}',this)">${monthLabel(m)}</button>`});
    c.innerHTML=h;
  }
}

function setMesDRE(mes){
  if(mes==="TOTAL"){MESES_SEL=[];render();buildMesBar();return;}
  const idx=MESES_SEL.indexOf(mes);
  if(idx>=0)MESES_SEL.splice(idx,1);
  else if(MESES_SEL.length<6)MESES_SEL.push(mes);
  MESES_SEL.sort();
  render();buildMesBar();
}
function updateSourceBar(){
  const hasCA=!!CA_DATA,hasXL=!!XL_DATA;
  document.getElementById("dot-ca").className="src-dot"+(hasCA?" ok":"");
  document.getElementById("dot-xl").className="src-dot"+(hasXL?" ok":"");
  const p=[];if(hasCA)p.push("Conta Azul ✓");
  if(hasXL){p.push(xlUploaded&&!fileHandle?"Excel (servidor)":"Excel ✓ (live 2s)");}
  if(pluggyConnected)p.push("Banco (Pluggy) ✓");
  document.getElementById("src-detail").textContent=p.length?p.join(" · "):"Nenhuma fonte conectada";
}
function updateSyncBadge(ok){
  const b=document.getElementById("sync-badge"),dot=document.getElementById("sync-dot"),txt=document.getElementById("sync-txt");
  b.style.display="flex";dot.className=ok?"live":"err";
  txt.textContent=ok?"Atualizado "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"Erro";
  txt.style.color=ok?"rgba(255,255,255,.9)":"#f87171";
}
function showTab(id,btn){document.querySelectorAll(".sec").forEach(s=>s.classList.remove("a"));document.querySelectorAll(".tb").forEach(b=>b.classList.remove("a"));document.getElementById("sec-"+id).classList.add("a");btn.classList.add("a");CUR_TAB=id;if(id==="dre")MESES_SEL=[];render();buildMesBar();}
function setMes(m,btn){
  CUR_MES=m;dtFrom=null;dtTo=null;
  document.getElementById("dt-from").value="";document.getElementById("dt-to").value="";
  document.querySelectorAll(".mfb").forEach(b=>b.classList.remove("a"));btn.classList.add("a");
  updateHeaderKPIs();render();
}
function applyDateFilter(){
  dtFrom=document.getElementById("dt-from").value||null;
  dtTo=document.getElementById("dt-to").value||null;
  if(dtFrom||dtTo){CUR_MES="TOTAL";document.querySelectorAll(".mfb").forEach(b=>b.classList.remove("a"));}
  updateHeaderKPIs();render();
}
function clearDateFilter(){
  dtFrom=null;dtTo=null;CUR_MES="TOTAL";
  document.getElementById("dt-from").value="";document.getElementById("dt-to").value="";
  document.querySelectorAll(".mfb").forEach(b=>b.classList.remove("a"));
  const totBtn=document.querySelector(".mfb");if(totBtn)totBtn.classList.add("a");
  updateHeaderKPIs();render();
}
window.setProfDisc=function(d,btn){PROF_DISC=d;document.querySelectorAll(".fb").forEach(b=>b.classList.remove("a"));btn.classList.add("a");renderProf()};
async function startAuth(){try{const r=await fetch(API+"?action=auth_url",{headers:authHeaders()});const{url}=await r.json();window.location.href=url;}catch(e){console.error(e);}}
async function logout(){
  await fetch(API+"?action=logout",{headers:authHeaders()});CA_DATA=null;XL_DATA=null;APP=null;MESES=[];CUR_MES="TOTAL";dtFrom=null;dtTo=null;
  if(pollTimer)clearInterval(pollTimer);if(timerXL)clearInterval(timerXL);fileHandle=null;xlLastMod=null;
  document.getElementById("btn-ca").textContent="⚡ Conta Azul";document.getElementById("btn-ca").style.borderColor="";
  document.getElementById("btn-excel").textContent="📊 Excel";document.getElementById("btn-excel").style.borderColor="";
  document.getElementById("btn-logout").style.display="none";document.getElementById("sync-badge").style.display="none";
  document.getElementById("hkpis").innerHTML="";updateSourceBar();buildMesBar();render();
}
async function loadCA(isRefresh){
  try{
    const r=await fetch(API+"?action=data",{headers:authHeaders()});
    if(r.status===401){if(!isRefresh)render();return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    const raw=await r.json();if(raw.error)throw new Error(raw.error);
    LAPA_CA=raw;if(UNIT!=="vm")applyUnit();
    document.getElementById("btn-ca").textContent="⚡ CA ✓";
    document.getElementById("btn-ca").style.borderColor="rgba(74,222,128,.7)";
    document.getElementById("btn-logout").style.display="flex";
  }catch(e){console.error(e);isLoadingCA=false;updateSyncBadge(false);if(!isRefresh){const el=document.getElementById("sec-dre");if(el)el.innerHTML=`<div class="err-box"><b>Erro:</b> ${e.message}</div>`;}}
}
function startPollingCA(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>loadCA(true),POLL_MS);}
// ── AUTENTICAÇÃO ──────────────────────────────────────────────────────────
// Para alterar a senha: substitua "Ninho@2026" nas duas ocorrências abaixo
let AUTH_KEY = "";           // senha de acesso (guardada no navegador)
let ACCESS_LEVEL = null;     // "full" | "vm" | null
let ACCESS_CONFIGURED = false;
function authHeaders(extra){ const h=Object.assign({}, extra||{}); if(AUTH_KEY)h["x-access-key"]=AUTH_KEY; return h; }
async function checkAccess(){
  try{ const r=await fetch(STORE+"?action=access",{headers:authHeaders()}); if(!r.ok)return{level:null,configured:true}; return await r.json(); }
  catch(e){ return {level:null,configured:true}; }
}
// Ajusta a interface conforme o nível de acesso
function applyAccessUI(){
  const vm = ACCESS_LEVEL==="vm";
  const sel=document.getElementById("unit-sel"), stat=document.getElementById("unit-static");
  const acExit=document.getElementById("btn-acesso-sair"); if(acExit)acExit.style.display=ACCESS_CONFIGURED?"inline-flex":"none";
  if(vm){
    UNIT="vm"; try{localStorage.setItem("nh_unit","vm");}catch(e){}
    if(sel)sel.style.display="none";
    if(stat)stat.style.display="block";
    ["btn-ca","btn-ofx","btn-excel","btn-logout"].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display="none";});
  } else {
    if(sel)sel.style.display="";
    if(stat)stat.style.display="none";
  }
}
window.sairAcesso=function(){ try{localStorage.removeItem("nh_key");}catch(e){} AUTH_KEY=""; ACCESS_LEVEL=null; location.reload(); };
window.checkAuth=async function(){
  const v=document.getElementById("auth-pwd").value;
  AUTH_KEY=v;
  const acc=await checkAccess();
  if(acc && acc.level){
    try{localStorage.setItem("nh_key",v);}catch(e){}
    ACCESS_LEVEL=acc.level;
    document.getElementById("auth-wall").style.display="none";
    document.getElementById("auth-pwd").value="";
    document.getElementById("auth-err").style.display="none";
    if(window.__authResolve){const f=window.__authResolve;window.__authResolve=null;f(acc.level);}
  } else {
    AUTH_KEY="";
    document.getElementById("auth-err").style.display="block";
    document.getElementById("auth-pwd").value="";
    document.getElementById("auth-pwd").focus();
  }
};

(async()=>{
  // ── Controle de acesso (senha validada no servidor) ──
  try{AUTH_KEY=localStorage.getItem("nh_key")||"";}catch(e){AUTH_KEY="";}
  const acc=await checkAccess();
  ACCESS_CONFIGURED=(acc.configured!==false);
  ACCESS_LEVEL=(acc.configured===false)?"full":acc.level;
  if(!ACCESS_LEVEL){
    document.getElementById("auth-wall").style.display="flex";
    setTimeout(()=>{const p=document.getElementById("auth-pwd");if(p)p.focus();},60);
    ACCESS_LEVEL=await new Promise(resolve=>{ window.__authResolve=resolve; });
  } else {
    document.getElementById("auth-wall").style.display="none";
  }
  applyAccessUI();
  buildMesBar();render();
  await loadVMFromStore(); // VM do servidor, se houver (senão usa o snapshot embutido)
  applyUnit();
  const params=new URLSearchParams(location.search);
  if(params.toString())history.replaceState({},"","/");
  if(ACCESS_LEVEL==="full"){
    // 1. Planilha da Lapa (servidor)
    const hasStoreData=await loadFromStore();
    if(hasStoreData){updateSourceBar();}
    // 2. Extrato OFX
    loadOFXFromServer().catch(()=>{});
    // 3. Conta Azul
    try{
      const r=await fetch(API+"?action=check",{headers:authHeaders()});
      const{authenticated}=await r.json();
      if(authenticated){ isLoadingCA=true;render(); await loadCA(false); isLoadingCA=false; startPollingCA(); }
      else if(!hasStoreData){render();}
    }catch{if(!hasStoreData)render();}
  } else {
    // Acesso VM: não carrega nada da Lapa
    render();
  }
})();

</script>
