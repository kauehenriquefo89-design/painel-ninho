<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dashboard — Espaço Ninho</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#C4622D;--brand-dark:#9e4e24;--brand-light:#f0e4dc;--bg:#f5f1ef;--card:#fff;--border:#e8ddd8;--text:#2d1f17;--muted:#8b6b5a;--subtle:#c9b5aa;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--gold:#d97706;--purple:#7c3aed}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);font-size:14px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:3px}
#hdr{background:var(--brand);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#hdr-top{display:flex;align-items:center;justify-content:space-between;padding:7px 20px;min-height:56px;gap:8px 12px;flex-wrap:wrap}
#brand-wrap{display:flex;align-items:center;gap:10px}
#logo{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
#bt{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.2px}
#bs{font-size:10px;color:rgba(255,255,255,.75);margin-top:1px}
#hdr-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#hkpis{display:flex;gap:5px;flex-wrap:wrap}
.hk{background:rgba(0,0,0,.2);border-radius:7px;padding:4px 10px}
.hkl{font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.4px}
.hkv{font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:#fff}
#sync-badge{background:rgba(0,0,0,.2);border-radius:7px;padding:5px 11px;display:none;align-items:center;gap:7px}
#sync-dot{width:7px;height:7px;border-radius:50%;transition:all .3s}
#sync-dot.live{background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 2s ease-in-out infinite}
#sync-dot.err{background:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#sync-txt{font-size:10px;color:rgba(255,255,255,.9)}
.hdr-btn{display:flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.5);border-radius:7px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;transition:all .15s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.25)}
#source-bar{background:rgba(0,0,0,.15);padding:3px 20px;display:flex;align-items:center;gap:12px;font-size:10px;color:rgba(255,255,255,.8)}
.src-badge{display:flex;align-items:center;gap:5px}
.src-dot{width:6px;height:6px;border-radius:50%;background:#94a3b8}.src-dot.ok{background:#4ade80}
#tabs{display:flex;gap:0;padding:0 12px;background:var(--brand-dark);overflow-x:auto}
.tb{padding:9px 14px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tb.a{color:#fff;border-bottom-color:#fff}.tb:hover:not(.a){color:rgba(255,255,255,.85)}
#fbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.flbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mfb{padding:5px 13px;border-radius:6px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.mfb.a{background:var(--brand);border-color:var(--brand);color:#fff}
.date-inputs{display:flex;align-items:center;gap:6px}
.date-inputs input{padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;font-family:inherit;color:var(--text)}
.date-inputs input:focus{outline:none;border-color:var(--brand)}
.fbtn{padding:4px 12px;border-radius:6px;border:none;background:var(--brand);color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
#content{padding:16px 20px;max-width:1600px;margin:0 auto}
.sec{display:none}.sec.a{display:block}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:16px;padding:24px}
.splash-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;box-shadow:0 4px 20px rgba(196,98,45,.3)}
.splash-title{font-size:22px;font-weight:800;color:var(--text)}
.splash-sub{font-size:13px;color:var(--muted);line-height:1.7;max-width:480px}
.splash-btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);border:none;border-radius:10px;padding:13px 28px;color:#fff;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(196,98,45,.35);transition:all .2s}
.splash-btn:hover{transform:translateY(-1px)}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:14px 18px;margin:8px 0;font-size:12px;color:#991b1b;line-height:1.6}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border-radius:10px;padding:13px 16px;flex:1;min-width:150px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:3px solid var(--brand)}
.cl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;font-weight:600}
.cv{font-family:'Courier New',monospace;font-size:20px;font-weight:700;color:var(--text)}
.cs{font-size:11px;color:var(--muted);margin-top:2px}.cp{font-size:11px;font-weight:700;margin-top:2px}
.panel{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:12px}
.pt{font-weight:700;font-size:14px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pt-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--brand-light);color:var(--brand);white-space:nowrap}
.prow{display:flex;gap:12px;margin-bottom:12px}.prow>.panel{flex:1;margin-bottom:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#faf7f5;font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:7px 10px;border-bottom:2px solid var(--border);white-space:nowrap;text-align:left}
th.r{text-align:right}td{padding:7px 10px;border-bottom:1px solid #f8f3f1;font-size:12px;color:var(--text)}
td.r{text-align:right}tr:hover td{background:#fdf9f7}
tr:nth-child(even) td{background:#fdf7f5}
td.mn{font-family:'Courier New',monospace;font-size:11px}td.b{font-weight:700}
td.rd{color:var(--red)}td.gn{color:var(--green)}
.bdg{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9px;font-weight:700}
.bg{background:#dcfce7;color:#166534}.by{background:#fef3c7;color:#92400e}.br{background:#fee2e2;color:#991b1b}.bo{background:#fff7ed;color:#9a3412}
.alrt{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:9px 13px;margin-bottom:10px;display:flex;gap:9px;align-items:flex-start;font-size:11px;color:#9a3412}
.fltrs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fb{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:10px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
.fb.a{background:var(--brand);border-color:var(--brand);color:#fff}
.cwrap{width:100%;overflow-x:auto}
.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.dsp td{border-top:2px solid var(--border)!important;background:#faf7f5!important}
.section-title{font-size:11px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--brand-light)}
.no-data{text-align:center;padding:32px;color:var(--muted);font-size:12px}
.excel-needed{background:var(--brand-light);border:1px dashed var(--brand);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--brand-dark);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.src-info{background:#f8f7f5;border-left:3px solid var(--brand-light);border-radius:0 6px 6px 0;padding:8px 12px;font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5}

.dre-toggle{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dre-tb{padding:6px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .12s}
.dre-tb.a{background:var(--brand);border-color:var(--brand);color:#fff}
</style>
</head>
<body>
<div id="auth-wall" style="display:flex;position:fixed;inset:0;background:#fdf6f0;z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:16px;padding:40px;box-shadow:0 4px 24px rgba(0,0,0,.12);max-width:340px;width:90%;text-align:center">
    <div style="font-size:36px;margin-bottom:8px">🪹</div>
    <div style="font-size:20px;font-weight:700;color:#C4622D;margin-bottom:4px">Espaço Ninho</div>
    <div style="font-size:13px;color:#999;margin-bottom:28px">Dashboard Financeiro</div>
    <input id="auth-pwd" type="password" placeholder="Senha de acesso"
      style="width:100%;padding:12px 14px;border:1.5px solid #e5d5cc;border-radius:8px;font-size:14px;outline:none;margin-bottom:12px;box-sizing:border-box"

    </button>

<script>

const API    = "/api/api";
// Cores fixas por procedimento (determinísticas — mesma cor independente do mês)
const PROC_COLORS=[
  "#C4622D","#3b82f6","#10b981","#f59e0b","#8b5cf6","#ef4444",
  "#06b6d4","#84cc16","#ec4899","#f97316","#14b8a6","#6366f1",
  "#a16207","#0ea5e9","#d946ef","#22c55e","#e11d48","#7c3aed"
];
const _procColorMap={};
function getProcColor(name){
  if(!_procColorMap[name]){
    const keys=Object.keys(_procColorMap);
    _procColorMap[name]=PROC_COLORS[keys.length%PROC_COLORS.length];
  }
  return _procColorMap[name];
}
const STORE  = "/api/store";
const PLUGGY = "/api/pluggy";
const POLL_MS = 300000;
const TAX = {pis:0.0065, cofins:0.03, iss:0.05};
const BASE_PRESUMIDA = 0.32; // Lucro Presumido: base de cálculo para serviços

// Deduções mensais sobre faturamento (PIS/COFINS/ISS)
function calcDeducoesFiscais(rb){
  const pis=rb*TAX.pis, cofins=rb*TAX.cofins, iss=rb*TAX.iss;
  return{pis, cofins, iss, total:pis+cofins+iss};
}

// CSLL/IRPJ: Lucro Presumido — base 32%, apuração trimestral
// rb_trimestral: soma da receita bruta dos 3 meses
function calcCsllIrpj(rb_trimestral){
  const base = rb_trimestral * BASE_PRESUMIDA;
  const csll = base * 0.09;
  const irpj = base * 0.15;
  const adicional = base > 60000 ? (base - 60000) * 0.10 : 0;
  const total = csll + irpj + adicional;
  return { base, csll, irpj, adicional, total, mensal: total / 3 };
}

// Compatibilidade: quando não há contexto trimestral, estima com rb*3
function calcImpostos(rb){
  const ded=calcDeducoesFiscais(rb);
  const tri=calcCsllIrpj(rb*3);
  return{pis:ded.pis,cofins:ded.cofins,iss:ded.iss,csll:tri.csll/3,irpj:tri.irpj/3,adicional:tri.adicional/3,total:ded.total+tri.total/3};
}

// ── NORMALIZADORES PARA PREVISTO (todos os lançamentos, pagos ou não) ────────
function normalizarCRprevisto(item){
  if(isTransfer(item))return null;
  const total=toNum(item.total||0);
  if(total<=0)return null;
  const mes=toYYYYMM(item.data_vencimento||item.data_competencia);
  if(!mes)return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"";
  return{mes,cat,e:total};
}
function normalizarCPprevisto(item){
  if(isTransfer(item))return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"";
  const grupo=getGrupoCp(cat);
  if(grupo==="imposto")return null;
  const total=toNum(item.total||0);
  if(total<=0)return null;
  const mes=toYYYYMM(item.data_vencimento||item.data_competencia);
  if(!mes)return null;
  return{mes,cat,grupo,s:total};
}

// ── NORMALIZADORES PARA FLUXO DE CAIXA PREVISTO (itens futuros) ─────────────
function normalizarCRfuture(item){
  if(isTransfer(item))return null;
  const aberto=toNum(item.total||0)-toNum(item.pago||0);
  if(aberto<=0)return null; // só itens em aberto
  const mes=toYYYYMM(item.data_vencimento);
  if(!mes)return null;
  return{mes,faturado:aberto,recebido:0,aberto};
}
function normalizarCPfuture(item){
  if(isTransfer(item))return null;
  const cat=(item.categorias?.[0]?.nome||item.descricao||"");
  const grupo=getGrupoCp(cat);
  if(grupo==="imposto")return null;
  const aberto=toNum(item.total||0)-toNum(item.pago||0);
  if(aberto<=0)return null;
  const mes=toYYYYMM(item.data_vencimento);
  if(!mes)return null;
  return{mes,cat,grupo,pago:0,original:aberto,aberto};
}

// ── DRE CATEGORY GROUPING (based on real Conta Azul categories) ──
// Classifica uma linha de CAIXA (extrato/CA) num grupo da DRE.
// O extrato usa vocabulário próprio (Categoria FdC) que o getGrupoCp não conhece,
// então mapeamos por palavra-chave antes de cair no default.
function grupoCaixa(cat){
  const c=(cat||"").toLowerCase().trim();
  if(!c)return null; // sem categoria → tratado como "outros" (vai p/ administrativo agregado)
  if(c.includes("profiss")||c.includes("repasse"))return "repasse";
  if(c.includes("imposto")||c.includes("darf")||c.includes("das ")||c==="das"||c.includes("inss")||c.includes("fgts")||c.includes("iss")||c.includes("pis")||c.includes("cofins")||c.includes("irpj")||c.includes("csll")||c.includes("iptu")||c.includes("tribut"))return "imposto";
  if(c.includes("marketing")||c.includes("publicidade")||c.includes("brinde")||c.includes("comerci")||c.includes("propaganda")||c.includes("anúncio")||c.includes("anuncio")||c.includes("trafego")||c.includes("tráfego"))return "comercial";
  if(c.includes("tarifa")||c.includes("bancar")||c.includes("bancár")||c.includes("juros")||c.includes("iof")||c.includes("financ"))return "financeiro";
  if(c.includes("rendimento")||c.includes("aplicac")||c.includes("aplicaç"))return "rendimento";
  if(c.includes("emprest")||c.includes("emprést")||c.includes("divida")||c.includes("dívida")||c.includes("financiamento")||c.includes("amortiz"))return "emprestimo";
  if(c.includes("identificar"))return null; // "(-) Pagamentos a identificar" → outros (administrativo)
  return getGrupoCp(cat); // demais (Aluguel, Água, Secretária, Manutenção, Contabilidade...) → administrativo
}
function getGrupoCp(cat) {
  const c = (cat||"").toLowerCase().trim();
  if (c==="pis"||c==="cofins"||c==="iss"||c==="csll"||c==="irpj"||c==="irpj adicional") return "imposto";
  if (c.includes("repasse")) return "repasse";
  if (c.includes("marketing") || c.includes("publicidade") || c.includes("brinde") || c.includes("comerci")) return "comercial";
  if (c.includes("rendimento") || c.includes("aplicacao") || c.includes("aplicação")) return "rendimento";
  if (c.includes("emprestimo") || c.includes("empréstimo") || c.includes("divida") || c.includes("dívida") || c.includes("financiamento") || c.includes("banco") && c.includes("emprést")) return "emprestimo";
  if (c.includes("tarifa") || c.includes("bancaria") || c.includes("juros") || c.includes("iof") || c.includes("financ")) return "financeiro";
  return "administrativo"; // default: Pró-labore, Aluguel, Salários, etc.
}

function getQuarter(mes){
  if(!mes)return null;
  const[y,m]=mes.split("-").map(Number);
  return y+"-Q"+Math.ceil(m/3);
}

// Recalcula CSLL/IRPJ com base trimestral correta (Lucro Presumido)
// Chamado após buildMonth processar todos os meses
function recalcQuarterlyTax(byMes, allMeses){
  // Agrupa meses por trimestre
  const quarters={};
  allMeses.forEach(mes=>{
    const q=getQuarter(mes);
    if(!quarters[q])quarters[q]=[];
    quarters[q].push(mes);
  });

  // Para cada trimestre: calcula imposto sobre receita total e redistribui mensalmente
  Object.entries(quarters).forEach(([q,meses])=>{
    const rb_trim=meses.reduce((a,m)=>a+(byMes[m]?.rl||0),0);
    const tri=calcCsllIrpj(rb_trim);
    const n=meses.length;

    // Se algum mês do trimestre tem valor real do CA → zera provisão dos demais
    const anyCSLLreal=meses.some(m=>byMes[m]?.impostos?.csllFromCA);
    const anyIRPJreal=meses.some(m=>byMes[m]?.impostos?.irpjFromCA);
    const anyAdicReal=meses.some(m=>byMes[m]?.impostos?.adicFromCA);
    meses.forEach(mes=>{
      const d=byMes[mes];if(!d)return;
      if(anyCSLLreal){
        if(!d.impostos.csllFromCA) d.impostos.csll=0;
      } else {
        d.impostos.csll=tri.csll/n;
      }
      if(anyIRPJreal){
        if(!d.impostos.irpjFromCA) d.impostos.irpj=0;
      } else {
        d.impostos.irpj=tri.irpj/n;
      }
      // IRPJ Adicional: zera nos outros meses se houver IRPJ real OU adicional real no trimestre
      if(anyAdicReal||anyIRPJreal){
        if(!d.impostos.adicFromCA) d.impostos.adicional=0;
      } else {
        d.impostos.adicional=tri.adicional/n;
      }
      d.impostos.total=d.impostos.pis+d.impostos.cofins+d.impostos.iss+d.impostos.csll+d.impostos.irpj+d.impostos.adicional;
      d.impostos.base_presumida=tri.base;
      d.impostos.rb_trimestral=rb_trim;
      d.impostos.trimestre=q;
      // Recalcula Lucro Líquido com imposto correto
      d.impostos.total=d.impostos.pis+d.impostos.cofins+d.impostos.iss+d.impostos.csll+d.impostos.irpj+(d.impostos.adicional||0);
      const csll_irpj=d.impostos.csll+d.impostos.irpj+(d.impostos.adicional||0);
      d.ll=d.ebt-csll_irpj;
    });
  });
}

function toYYYYMM(v){if(!v)return null;if(v instanceof Date||Object.prototype.toString.call(v)==="[object Date]"){const d=new Date(v);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}const s=String(v);const m1=s.match(/^(\d{4})-(\d{2})/);if(m1)return m1[1]+"-"+m1[2];const m2=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m2)return m2[3]+"-"+m2[2].padStart(2,"0");return null}

// ── FILTER ──
function getActiveMeses(){
  let m=[...MESES];
  if(dtFrom)m=m.filter(x=>x>=dtFrom);
  if(dtTo)m=m.filter(x=>x<=dtTo);
  return m;
}

function getActiveData(){
  if(!APP||!APP.byMes)return null;
  const meses=getActiveMeses();
  // Se apenas 1 mês selecionado via botão
  if(CUR_MES!=="TOTAL"&&MESES.includes(CUR_MES)&&!dtFrom&&!dtTo){
    return APP.byMes[CUR_MES]||APP.byMes["TOTAL"];
  }
  // Agrega os meses ativos (respeita filtro De/Até)
  return buildAggregate(meses);
}

function buildAggregate(meses){
  if(!meses||!meses.length)return APP.byMes["TOTAL"];
  if(meses.length===MESES.length&&!dtFrom&&!dtTo)return APP.byMes["TOTAL"];

  const agg={mes:"AGG",rl:0,rb_excel:0,desc_excel:0,recebido:0,abertoCR:0,rep:0,
    desp_comercial:0,desp_admin:0,desp_financeiro:0,rendimentos:0,emprestimo:0,
    at:0,pac:0};
  const catMap={},catCAaggMap={},cpCatMap={},profMap={},discMap={},famMap={};

  meses.forEach(m=>{
    const d=APP.byMes[m];if(!d)return;
    ["rl","rb_excel","desc_excel","recebido","abertoCR","rep","desp_comercial","desp_admin","desp_financeiro","rendimentos","emprestimo","at"].forEach(k=>agg[k]+=(d[k]||0));
    (d.categorias||[]).forEach(c=>{if(!catMap[c.n])catMap[c.n]={n:c.n,faturado:0,recebido:0,aberto:0};catMap[c.n].faturado+=c.faturado;catMap[c.n].recebido+=c.recebido;catMap[c.n].aberto+=c.aberto});
    (d.categoriasCA||[]).forEach(c=>{if(!catCAaggMap[c.n])catCAaggMap[c.n]={n:c.n,faturado:0,recebido:0,aberto:0};catCAaggMap[c.n].faturado+=c.faturado;catCAaggMap[c.n].recebido+=c.recebido;catCAaggMap[c.n].aberto+=c.aberto});
    (d.cpCategorias||[]).forEach(c=>{const k=c.n+"|"+c.grupo;if(!cpCatMap[k])cpCatMap[k]={n:c.n,grupo:c.grupo,valor:0};cpCatMap[k].valor+=c.valor});
    (d.profissionais||[]).forEach(p=>{const k=p.n+"||"+p.d;if(!profMap[k])profMap[k]={...p,rb:0,rl:0,rep:0,at:0};profMap[k].rb+=p.rb;profMap[k].rl+=p.rl;profMap[k].rep+=p.rep;profMap[k].at+=p.at});
    (d.disciplinas||[]).forEach(x=>{if(!discMap[x.n])discMap[x.n]={...x,rl:0,rep:0,at:0,pac:0};discMap[x.n].rl+=x.rl;discMap[x.n].rep+=x.rep;discMap[x.n].at+=x.at;discMap[x.n].pac+=x.pac});
    // famMap handled after loop from atRows
  });

  // Recalcula derivados
  agg.rf=agg.rendimentos-agg.desp_financeiro;
  agg.lucro_bruto=agg.rl-agg.rep;
  agg.lucro_operacional=agg.lucro_bruto-agg.desp_comercial-agg.desp_admin;
  agg.lucro_liquido_antes=agg.lucro_operacional+agg.rf;
  agg.lucro_final=agg.lucro_liquido_antes; // amortização não entra no resultado
  // buildAggregate: soma os impostos mensais (não recalcular sobre total)
  const aggImpSum={pis:0,cofins:0,iss:0,csll:0,irpj:0,adicional:0,total:0};
  meses.forEach(m=>{const i=APP.byMes[m]?.impostos||{};
    aggImpSum.pis+=(i.pis||0);aggImpSum.cofins+=(i.cofins||0);aggImpSum.iss+=(i.iss||0);
    aggImpSum.csll+=(i.csll||0);aggImpSum.irpj+=(i.irpj||0);aggImpSum.adicional+=(i.adicional||0);
    aggImpSum.total+=(i.total||0);
  });
  agg.impostos=aggImpSum;
  agg.ll=agg.lucro_final-agg.impostos.total;
  agg.tAt=agg.at>0?agg.rl/agg.at:0;
  agg.categorias=Object.values(catMap).sort((a,b)=>b.faturado-a.faturado);
  agg.categoriasCA=Object.values(catCAaggMap).sort((a,b)=>b.faturado-a.faturado);
  agg.cpCategorias=Object.values(cpCatMap).sort((a,b)=>b.valor-a.valor);
  agg.profissionais=Object.values(profMap).map(p=>{const mc2=p.rl-p.rep,i2=calcImpostos(p.rl),ll2=mc2-i2.total;return{...p,mc:mc2,imp:i2.total,ll:ll2,mcP:p.rl>0?mc2/p.rl:0,repP:p.rl>0?p.rep/p.rl:0,llP:p.rl>0?ll2/p.rl:0,tAt:p.at>0?p.rl/p.at:0}}).sort((a,b)=>b.rl-a.rl);
  agg.disciplinas=Object.values(discMap).map(d=>{const mc2=d.rl-d.rep,i2=calcImpostos(d.rl),ll2=mc2-i2.total;return{...d,mc:mc2,imp:i2.total,ll:ll2,mcP:d.rl>0?mc2/d.rl:0,repP:d.rl>0?d.rep/d.rl:0,llP:d.rl>0?ll2/d.rl:0,tAt:d.at>0?d.rl/d.at:0,tPac:d.pac>0?d.rl/d.pac:0}}).sort((a,b)=>b.rl-a.rl);
  // Rebuild familias and pac from raw atRows filtered by meses
  const aggAtRows=(APP.atRows||[]).filter(r=>meses.includes(r.mes));
  agg.pac=new Set(aggAtRows.map(r=>r.paciente).filter(Boolean)).size;
  agg.tPac=agg.pac>0?agg.rl/agg.pac:0;
  const aggFamMap={};
  aggAtRows.forEach(r=>{const fn=r.familia||"Sem família";if(!aggFamMap[fn])aggFamMap[fn]={n:fn,rl:0,at:0,pacs:new Set()};aggFamMap[fn].rl+=r.rl;aggFamMap[fn].at++;aggFamMap[fn].pacs.add(r.paciente)});
  agg.familias=Object.values(aggFamMap).map(f=>({n:f.n,rl:f.rl,at:f.at,pac:f.pacs.size,tAt:f.at>0?f.rl/f.at:0,tPac:f.pacs.size>0?f.rl/f.pacs.size:0})).sort((a,b)=>b.rl-a.rl);
  return agg;
}

// ── NORMALIZADORES ──
function isTransfer(item){
  const cat=(item.categorias?.[0]?.nome||item.descricao||"").toLowerCase();
  return cat.includes("transfer") || cat.includes("transf.") ||
         (item.tipo||"").toLowerCase().includes("transfer");
}
function normalizarCR(item){
  if(isTransfer(item))return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"Sem categoria";
  const faturado=toNum(item.total||0),recebido=toNum(item.pago||0);
  // DRE: SOMENTE data_competencia (nunca data_vencimento — seria regime de caixa)
  const mes=toYYYYMM(item.data_competencia);
  // Fluxo de Caixa: data_vencimento (regime de caixa, separado da DRE)
  const mesFC=toYYYYMM(item.data_vencimento);
  if(!mes)return null; // descarta lançamentos sem data de competência
  const cliente=item.cliente?.nome||item.cliente?.razao_social||item.contato?.nome||"Sem identificação";
  const venc=(item.data_vencimento||"").slice(0,10);
  // "aberto" = o que o próprio sistema diz que não foi pago (nao_pago), com fallback total-pago
  const emAberto=item.nao_pago!=null?toNum(item.nao_pago):Math.max(0,faturado-recebido);
  const quitado=(item.status||item.status_traduzido||"").toString().toUpperCase();
  const pago100=quitado.includes("ACQUITTED")||quitado.includes("RECEB")||quitado.includes("PAG")||emAberto<=0.005;
  return{mes,mesFC,cat,faturado,recebido,aberto:faturado-recebido,cliente,venc,emAberto,pago100,descricao:item.descricao||""};
}
function normalizarCP(item){
  if(isTransfer(item))return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"Sem categoria";
  const original=toNum(item.total||0),pago=toNum(item.pago||0);
  // DRE: SOMENTE data_competencia
  const mes=toYYYYMM(item.data_competencia);
  // Fluxo de Caixa: data_vencimento
  const mesFC=toYYYYMM(item.data_vencimento);
  if(!mes)return null; // descarta lançamentos sem data de competência
  const grupo=getGrupoCp(cat);
  return{mes,mesFC,cat,grupo,original,pago,aberto:original-pago};
}

// ── NORMALIZADORES PARA FLUXO DE CAIXA (regime caixa — data vencimento) ──
// Separados dos normalizadores da DRE para não contaminar regimes
function normalizarCRfc(item){
  if(isTransfer(item))return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"Sem categoria";
  const recebido=toNum(item.pago||0);
  const faturado=toNum(item.total||0);
  // FC REALIZADO: pago>0 + vencimento <= mês atual
  if(recebido<=0)return null;
  const mes=toYYYYMM(item.data_vencimento||item.data_competencia);
  if(!mes)return null;
  const _hj=new Date();const hoje=_hj.getFullYear()+"-"+String(_hj.getMonth()+1).padStart(2,"0");
  if(mes>hoje)return null; // exclui futuros
  return{mes,cat,recebido,faturado,aberto:faturado-recebido};
}
function normalizarCPfc(item){
  if(isTransfer(item))return null;
  const cat=item.categorias?.[0]?.nome||item.descricao||"Sem categoria";
  const pago=toNum(item.pago||0);
  const original=toNum(item.total||0);
  // FC REALIZADO: pago>0 + vencimento <= mês atual
  if(pago<=0)return null;
  const mes=toYYYYMM(item.data_vencimento||item.data_competencia);
  if(!mes)return null;
  const _hj=new Date();const hoje=_hj.getFullYear()+"-"+String(_hj.getMonth()+1).padStart(2,"0");
  if(mes>hoje)return null; // exclui futuros
  if(!mes)return null;
  const grupo=getGrupoCp(cat);
  return{mes,cat,grupo,pago,original,aberto:original-pago};
}

// Planilha: "Relação geral"
// Colunas: Data Atendimento | Horário | Procedimento | Família | Paciente | Profissional | Valor | Desconto | Valor a Receber | Repasse | Valor Profissional
function xlsxToObjects(wb,nm){
  const ws=wb.Sheets[nm];if(!ws)return[];
  const raw=window.XLSX.utils.sheet_to_json(ws,{defval:""});
  // Normaliza chaves: remove espaços extras e caracteres invisíveis
  return raw.map(r=>{
    const out={};
    Object.entries(r).forEach(([k,v])=>{out[k.trim()]=v;});
    return out;
  });
}
function processExcel(wb){
  // Aceita "Relação geral" ou "Base_Atendimentos"
  const sheetName=wb.SheetNames.find(n=>n.includes("Relação")||n.includes("Relacao")||n.includes("Base_Atend"))||wb.SheetNames[0];
  const rows=xlsxToObjects(wb,sheetName);
  if(!rows.length)return null;
  return{at:rows,sheetName};
}
function parseAtRow(r){
  // Suporte ao formato "Relação geral" e ao formato "Base_Atendimentos"
  const data=r["Data Atendimento"]||r["data_atendimento"];
  const proc=String(r["Procedimento"]||r["Disciplina"]||"").trim();
  const familia=(String(r["Família"]||r["Familia"]||r["família"]||"").trim().replace(/\s+/g," "))||"Sem família";
  const paciente=String(r["Paciente"]||"").trim();
  const prof=String(r["Profissional"]||"").trim();
  // Faturamento = coluna "Valor a Receber" (col. I). O Desconto NÃO é trazido.
  // Aliases de cabeçalho aceitos; sem fallback para "Valor - Desconto".
  const rl=toNum(r["Valor a Receber"]||r["Receita Clínica"]||r["Receita Clinica"]||0);
  const rb=rl;
  // Repasse
  const rep=toNum(r["Valor Profissional"]||r["Repasse Profissional"]||0);
  const mes=toYYYYMM(data);
  return{mes,paciente,familia,prof,disc:proc,rb,rl,rep};
}

// ── OFX: upload e parse do extrato bancário ──────────────────────────────
function parseOFX(text){
  // Remove headers e pega só o XML/SGML
  const txns=[];
  // Suporte a OFX clássico (SGML) e moderno (XML)
  const stmtTrn=/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;
  let match;
  while((match=stmtTrn.exec(text))!==null){
    const block=match[1];
    const get=(tag)=>{const m=new RegExp(`<${tag}>([^<]+)`,'i').exec(block);return m?m[1].trim():null;};
    const trntype=get('TRNTYPE')||'';
    const dtposted=get('DTPOSTED')||'';
    const trnamt=parseFloat(get('TRNAMT')||'0');
    const memo=get('MEMO')||get('NAME')||'';
    if(!dtposted||isNaN(trnamt))continue;
    // Converte data OFX: 20260115 → 2026-01-15
    const ano=dtposted.slice(0,4), mes=dtposted.slice(4,6), dia=dtposted.slice(6,8);
    const date=`${ano}-${mes}-${dia}`;
    txns.push({date, amount:trnamt, description:memo, type:trnamt>=0?'CREDIT':'DEBIT'});
  }
  return txns;
}

async function loadOFX(){
  try{
    const [fh]=await window.showOpenFilePicker({types:[{description:"Extrato OFX",accept:{"application/x-ofx":[".ofx",".OFX"]}}]});
    const file=await fh.getFile();
    const text=await file.text();
    const txns=parseOFX(text);
    if(!txns.length){alert("Nenhuma transação encontrada no arquivo OFX.");return;}
    OFX_DATA={transactions:txns,total:txns.length,fileName:file.name,uploadedAt:new Date().toISOString()};

async function openPluggyWidget(){
  try{
    // Busca connect token
    const r=await fetch(PLUGGY+"?action=connect_token",{headers:authHeaders()});
    if(!r.ok){
      const txt=await r.text();
      alert("Erro HTTP "+r.status+": "+txt.slice(0,200));
      return;
    }
    const d=await r.json();
    if(!d.accessToken){alert("Erro ao gerar token Pluggy: "+(d.error||JSON.stringify(d)));return;}

    // Carrega o widget do Pluggy dinamicamente
    if(!window.PluggyConnect){
      // Tenta carregar o widget Pluggy de diferentes URLs
      const cdnUrls=[
        "https://cdn.pluggy.ai/pluggy-connect/latest/pluggy-connect.js",
        "https://cdn.pluggy.ai/pluggy-connect/v2.7.0/pluggy-connect.js",
      ];
      let loaded=false;
      for(const url of cdnUrls){
        try{
          await new Promise((resolve,reject)=>{
            const s=document.createElement("script");
            s.src=url;
            s.onload=()=>{loaded=true;resolve();};
            s.onerror=reject;
            document.head.appendChild(s);
          });
          if(loaded)break;
        }catch(e){console.warn("CDN falhou:",url);}
      }
      if(!loaded)throw new Error("Não foi possível carregar o widget Pluggy. Verifique sua conexão.");
    }

    const PluggyConnectClass = window.PluggyConnect || window.pluggyConnect;
    if(!PluggyConnectClass){
      alert("Widget Pluggy não carregado. Verifique sua conexão.");
      return;
    }
    const pluggyConnect=new PluggyConnectClass({
      connectToken: d.accessToken,
      onSuccess: async ({item})=>{
        // Salva o itemId no servidor
        await fetch(PLUGGY+"?action=save_item",{
          method:"POST",
          headers:authHeaders({"Content-Type":"application/json"}),
          body:JSON.stringify({itemId:item.id})
        });
        document.getElementById("btn-bank").textContent="🏦 Carregando...";
        await loadPluggyTransactions();
        alert("✅ Conta bancária conectada com sucesso!");
      },
      onError: (e)=>{console.error("Pluggy widget error:",e);},
      onClose: ()=>{console.log("Pluggy widget fechado");},
    });
    pluggyConnect.init();
  }catch(e){
    console.error("openPluggyWidget erro completo:",e);
    alert("Erro ao conectar banco: "+(e?.message||e?.toString()||JSON.stringify(e)||"sem mensagem"));
  }
}

    const mesesStr=meses&&meses.length?meses.map(m=>{const[y,mo]=m.split("-");return["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][+mo-1]+"/"+String(y).slice(2)}).join(", "):"";
    const dateStr=uploadedAt?new Date(uploadedAt).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    btn.textContent="📊 "+totalRows+" atend.";
    btn.style.borderColor="rgba(74,222,128,.7)";
    btn.title=(fileName||"Excel")+(dateStr?" · "+dateStr:"")+(mesesStr?" · "+mesesStr:"");
  }
}

async function connectExcel(){
  if(!window.showOpenFilePicker){alert("Use Chrome ou Edge para o live sync.");return;}
  try{
    const[h]=await window.showOpenFilePicker({types:[{description:"Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx",".xlsm",".xls"]}}],multiple:false});
    fileHandle=h;const file=await h.getFile();const buf=await file.arrayBuffer();
    const wb=window.XLSX.read(buf,{type:"array",cellDates:true});
    XL_DATA=processExcel(wb);xlLastMod=file.lastModified;
    if(XL_DATA){
      document.getElementById("btn-excel").textContent="📊 "+file.name.slice(0,15);
      document.getElementById("btn-excel").style.borderColor="rgba(74,222,128,.7)";
      updateSourceBar();processData();startPollingXL();
      // Salva no Blob para compartilhar com todos os visitantes
      setTimeout(()=>{
        const rows=(APP&&APP.atRows)||[];
        console.log("Rows para upload:",rows.length);
        if(rows.length)uploadToStore(rows,file.name).catch(e=>console.error("Upload erro:",e));
        else console.warn("APP.atRows vazio — processData pode não ter rodado");
      },500);
    }else{
      document.getElementById("btn-excel").textContent="📊 Estrutura inválida";
    }
  }catch(e){
    if(e.name!=="AbortError"){
      console.error("connectExcel error:",e);
      alert("Erro ao carregar planilha: "+e.message);
    }
  }
}
function startPollingXL(){
  if(timerXL)clearInterval(timerXL);
  timerXL=setInterval(async()=>{
    if(!fileHandle)return;
    try{const file=await fileHandle.getFile();if(file.lastModified!==xlLastMod){const buf=await file.arrayBuffer();const wb=window.XLSX.read(buf,{type:"array",cellDates:true});const nd=processExcel(wb);if(nd){XL_DATA=nd;xlLastMod=file.lastModified;processData();updateSyncBadge(true);
          const rows=(APP&&APP.atRows)||[];if(rows.length)uploadToStore(rows,file.name||"Base.xlsx").catch(()=>{});}}}catch(e){}
  },2000);
}

// ── PROCESSAMENTO CENTRAL ──
function processData(silent){
  if(!CA_DATA&&!XL_DATA)return null;

  const cr=CA_DATA?(CA_DATA.cr||[]).map(normalizarCR).filter(r=>r&&r.mes):[];
  const cp=CA_DATA?(CA_DATA.cp||[]).map(normalizarCP).filter(r=>r&&r.mes):[];
  // FC usa normalizadores próprios (data_vencimento, valores pagos/recebidos)
  const crFC=CA_DATA?(CA_DATA.cr||[]).map(normalizarCRfc).filter(r=>r&&r.mes):[];
  const cpFC=CA_DATA?(CA_DATA.cp||[]).map(normalizarCPfc).filter(r=>r&&r.mes):[];

  // Se dados já foram processados (vindos do servidor), usa direto sem re-parsear
  const atRows=XL_DATA?.at?(XL_DATA.preProcessed?XL_DATA.at.filter(r=>r.mes&&r.mes>="2020-01"):XL_DATA.at.map(parseAtRow).filter(r=>r.mes&&r.mes>="2020-01")):[];

  const mesSet=new Set([...cr,...cp,...atRows].map(r=>r.mes).filter(Boolean));
  const allMeses=[...mesSet].sort();
  if(!allMeses.length){console.warn("Nenhum dado encontrado");return;}

  function buildMonth(mes){
    const crM=cr.filter(r=>r.mes===mes),cpM=cp.filter(r=>r.mes===mes),atM=atRows.filter(r=>r.mes===mes);

    // ── RECEITA BRUTA: EXCLUSIVAMENTE do Excel (regime competência) ──
    // rb_excel = coluna "Valor a Receber" (col. I) = FATURAMENTO — decisão do cliente
    // desc_excel = 0: o Desconto não é trazido para a DRE (Valor a Receber já é líquido dele)
    // Calculado a partir de r.rl para valer também nos dados já gravados no servidor.
    const rb_excel=atM.reduce((a,r)=>a+r.rl,0);      // Receita Bruta = Valor a Receber
    const desc_excel=0;                              // sem linha de desconto
    const rl=atM.reduce((a,r)=>a+r.rl,0);              // Receita Bruta Líq. (Valor a Receber)
    const hasExcel=atM.length>0;

    // Conta Azul CR: usado APENAS para inadimplência e fluxo de caixa
    const recebido=crM.reduce((a,r)=>a+r.recebido,0);
    const abertoCR=crM.reduce((a,r)=>a+r.aberto,0);

    // ── REPASSE (CUSTO DOS SERVIÇOS): EXCLUSIVAMENTE do Conta Azul (competência) ──
    // Regra: repasse SEMPRE do CA, nunca do Excel
    // Filtra apenas lançamentos classificados como repasse
    const cpRepasses=cpM.filter(r=>r.grupo==="repasse");
    const rep=cpRepasses.reduce((a,r)=>a+r.original,0);

    // ── DESPESAS OPERACIONAIS: Conta Azul (competência) ──
    const sumGrupo=g=>cpM.filter(r=>r.grupo===g).reduce((a,r)=>a+r.original,0);
    const desp_comercial=sumGrupo("comercial");
    const desp_admin=sumGrupo("administrativo");
    const desp_financeiro=sumGrupo("financeiro");
    const rendimentos=sumGrupo("rendimento");
    const emprestimo=sumGrupo("emprestimo");

    // ── DRE ESTRUTURA CORRETA ──
    // Verifica se há lançamentos reais de PIS/COFINS/ISS no CA
    // PIS/COFINS/ISS: usa valor real do CA se lançado; senão provisão
    const catNorm2=s=>(s||"").toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const _isPIS   =c=>catNorm2(c.cat)==="pis";
    const _isCOFINS=c=>catNorm2(c.cat)==="cofins";
    const _isISS   =c=>catNorm2(c.cat)==="iss";
    const _isCSLL  =c=>catNorm2(c.cat)==="csll";
    const _isIRPJ      =c=>catNorm2(c.cat)==="irpj";
    const _isIRPJAdic  =c=>catNorm2(c.cat)==="irpj adicional";
    const pisPago   =cpM.filter(_isPIS).reduce((a,r)=>a+r.original,0);
    const cofinsPago=cpM.filter(_isCOFINS).reduce((a,r)=>a+r.original,0);
    const issPago   =cpM.filter(_isISS).reduce((a,r)=>a+r.original,0);
    const csllPago  =cpM.filter(_isCSLL).reduce((a,r)=>a+r.original,0);
    const irpjPago     =cpM.filter(_isIRPJ).reduce((a,r)=>a+r.original,0);
    const irpjAdicPago =cpM.filter(_isIRPJAdic).reduce((a,r)=>a+r.original,0);


    const imp=calcImpostos(rl);
    const pisFinal   =pisPago>0    ? pisPago    : imp.pis;
    const cofinsFinal=cofinsPago>0 ? cofinsPago : imp.cofins;
    const issFinal   =issPago>0    ? issPago    : imp.iss;
    const csllFinal  =csllPago>0   ? csllPago   : imp.csll;
    const irpjFinal  =irpjPago>0   ? irpjPago   : imp.irpj;
    const irpjAdicFinal=irpjAdicPago>0 ? irpjAdicPago : imp.adicional;
    const impFinal={...imp, pis:pisFinal, cofins:cofinsFinal, iss:issFinal, csll:csllFinal, irpj:irpjFinal, adicional:irpjAdicFinal,
      csllFromCA:csllPago>0, irpjFromCA:irpjPago>0, adicFromCA:irpjAdicPago>0};
    impFinal.total=pisFinal+cofinsFinal+issFinal+csllFinal+irpjFinal+impFinal.adicional;
    const deducoes=pisFinal+cofinsFinal+issFinal;
    const rl_liq=rl-deducoes;                  // Receita Líquida (após impostos s/ faturamento)
    const margem_bruta=rl_liq-rep;             // Margem Bruta (era "lucro_bruto")
    const ebitda=margem_bruta-desp_comercial-desp_admin; // EBITDA (era "lucro_operacional")
    const rf=rendimentos-desp_financeiro;      // Resultado Financeiro
    const ebt=ebitda+rf;                        // EBT - antes dos impostos s/ lucro (amortização não é resultado)
    const csll_irpj=impFinal.csll+impFinal.irpj+impFinal.adicional;
    const ll=ebt-csll_irpj;                    // Lucro Líquido

    // Aliases para compatibilidade com código legado
    const lucro_bruto=margem_bruta;
    const lucro_operacional=ebitda;
    const lucro_liquido_antes=ebt+emprestimo;
    const lucro_final=ebt;

    const at=atM.length||crM.length;
    const pacs=new Set(atM.map(r=>r.paciente)).size;

    // Categorias de RECEITA (DRE): Excel quando disponível (col. Valor, por Procedimento)
    const catMap={};
    if(hasExcel && atM.length){
      atM.forEach(r=>{
        const n=r.disc||"Sem categoria";
        if(!catMap[n])catMap[n]={n,faturado:0,recebido:0,aberto:0};
        catMap[n].faturado+=r.rb;   // col. Valor
        catMap[n].recebido+=r.rl;   // col. Valor a Receber
        catMap[n].aberto+=0;
      });
    } else {
      crM.forEach(r=>{if(!catMap[r.cat])catMap[r.cat]={n:r.cat,faturado:0,recebido:0,aberto:0};catMap[r.cat].faturado+=r.faturado;catMap[r.cat].recebido+=r.recebido;catMap[r.cat].aberto+=r.aberto});
    }
    const categorias=Object.values(catMap).sort((a,b)=>b.faturado-a.faturado);

    // Categorias do Conta Azul (para Inadimplência e aba Categorias)
    // Sempre do CA — tem info de recebimento real
    const catCAmap={};
    crM.forEach(r=>{if(!catCAmap[r.cat])catCAmap[r.cat]={n:r.cat,faturado:0,recebido:0,aberto:0};catCAmap[r.cat].faturado+=r.faturado;catCAmap[r.cat].recebido+=r.recebido;catCAmap[r.cat].aberto+=r.aberto});
    const categoriasCA=Object.values(catCAmap).sort((a,b)=>b.faturado-a.faturado);

    // Categorias CP (despesas detalhadas)
    const cpCatMap={};
    cpM.forEach(r=>{const k=r.cat+"|"+r.grupo;if(!cpCatMap[k])cpCatMap[k]={n:r.cat,grupo:r.grupo,valor:0};cpCatMap[k].valor+=r.original});
    const cpCategorias=Object.values(cpCatMap).sort((a,b)=>b.valor-a.valor);

    // Profissionais (Excel)
    const profMap={};
    atM.forEach(r=>{const k=r.prof+"||"+r.disc;if(!profMap[k])profMap[k]={n:r.prof,d:r.disc,rb:0,rl:0,rep:0,at:0};profMap[k].rb+=r.rb;profMap[k].rl+=r.rl;profMap[k].rep+=r.rep;profMap[k].at++});
    const profissionais=Object.values(profMap).map(p=>{const mc2=p.rl-p.rep,i2=calcImpostos(p.rl),ll2=mc2-i2.total;return{...p,mc:mc2,imp:i2.total,ll:ll2,mcP:p.rl>0?mc2/p.rl:0,repP:p.rl>0?p.rep/p.rl:0,llP:p.rl>0?ll2/p.rl:0,tAt:p.at>0?p.rl/p.at:0}}).sort((a,b)=>b.rl-a.rl);

    // Disciplinas (Excel)
    const discMap={};
    atM.forEach(r=>{if(!discMap[r.disc])discMap[r.disc]={n:r.disc,rl:0,rep:0,at:0,pacs:new Set()};discMap[r.disc].rl+=r.rl;discMap[r.disc].rep+=r.rep;discMap[r.disc].at++;discMap[r.disc].pacs.add(r.paciente)});
    const disciplinas=Object.values(discMap).map(d=>{const mc2=d.rl-d.rep,i2=calcImpostos(d.rl),ll2=mc2-i2.total,pac=d.pacs.size;return{n:d.n,rl:d.rl,rep:d.rep,at:d.at,pac,mc:mc2,imp:i2.total,ll:ll2,mcP:d.rl>0?mc2/d.rl:0,repP:d.rl>0?d.rep/d.rl:0,llP:d.rl>0?ll2/d.rl:0,tAt:d.at>0?d.rl/d.at:0,tPac:pac>0?d.rl/pac:0}}).sort((a,b)=>b.rl-a.rl);

    // Famílias (Excel)
    const famMap={};
    atM.forEach(r=>{if(!famMap[r.familia])famMap[r.familia]={n:r.familia,rl:0,at:0,pacs:new Set()};famMap[r.familia].rl+=r.rl;famMap[r.familia].at++;famMap[r.familia].pacs.add(r.paciente)});
    const familias=Object.values(famMap).map(f=>({n:f.n,rl:f.rl,at:f.at,pac:f.pacs.size,tAt:f.at>0?f.rl/f.at:0,tPac:f.pacs.size>0?f.rl/f.pacs.size:0})).sort((a,b)=>b.rl-a.rl);

    return{mes,rl,rb_excel:rb_excel,desc_excel:desc_excel,recebido,abertoCR,rep,desp_comercial,desp_admin,desp_financeiro,rendimentos,emprestimo,rf,ebt,margem_bruta,ebitda,lucro_bruto,lucro_operacional,lucro_liquido_antes,lucro_final,impostos:impFinal,ll,at,pac:pacs,tAt:at>0?rl/at:0,tPac:pacs>0?rl/pacs:0,categorias,categoriasCA,cpCategorias,profissionais,disciplinas,familias};
  }

  const byMes={};
  allMeses.forEach(m=>{byMes[m]=buildMonth(m)});

  // Recalcula CSLL/IRPJ com base trimestral correta (Lucro Presumido)
  recalcQuarterlyTax(byMes, allMeses);

  // Meses visíveis: apenas meses com dados Excel, sem dezembro, sem futuros
  const excelMeses2=new Set(atRows.map(r=>r.mes).filter(Boolean));
  const hoje=new Date().toISOString().slice(0,7);
  const mesesVisiveis=allMeses.filter(m=>{
    if(m.endsWith("-12"))return false;
    if(m>hoje)return false;
    if(excelMeses2.has(m))return true;
    return m===hoje;
  });

  // TOTAL (agrega apenas meses visíveis)
  const tot={mes:"TOTAL",rl:0,rb_excel:0,desc_excel:0,recebido:0,abertoCR:0,rep:0,desp_comercial:0,desp_admin:0,desp_financeiro:0,rendimentos:0,emprestimo:0,at:0,pac:0};
  mesesVisiveis.forEach(m=>{const d=byMes[m];["rl","rb_excel","desc_excel","recebido","abertoCR","rep","desp_comercial","desp_admin","desp_financeiro","rendimentos","emprestimo","at"].forEach(k=>tot[k]+=(d[k]||0))});
  // Pacientes únicos: conta com Set global, não soma por mês
  tot.pac=new Set(atRows.map(r=>r.paciente).filter(Boolean)).size;
  tot.rf=tot.rendimentos-tot.desp_financeiro;
  tot.lucro_bruto=tot.rl-tot.rep;
  tot.lucro_operacional=tot.lucro_bruto-tot.desp_comercial-tot.desp_admin;
  tot.lucro_liquido_antes=tot.lucro_operacional+tot.rf;
  tot.lucro_final=tot.lucro_liquido_antes-tot.emprestimo;
  // TOTAL: soma os impostos já calculados por mês (recalcQuarterlyTax)
  // Não usar calcImpostos(tot.rl) pois tot.rl é soma de múltiplos meses
  const totImpAgg={pis:0,cofins:0,iss:0,csll:0,irpj:0,adicional:0,total:0};
  mesesVisiveis.forEach(m=>{const i=byMes[m]?.impostos||{};
    totImpAgg.pis+=(i.pis||0);totImpAgg.cofins+=(i.cofins||0);totImpAgg.iss+=(i.iss||0);
    totImpAgg.csll+=(i.csll||0);totImpAgg.irpj+=(i.irpj||0);totImpAgg.adicional+=(i.adicional||0);
    totImpAgg.total+=(i.total||0);
  });
  tot.impostos=totImpAgg;
  tot.ll=tot.lucro_final-tot.impostos.total;
  tot.tAt=tot.at>0?tot.rl/tot.at:0;
  tot.tPac=tot.pac>0?tot.rl/tot.pac:0;
  // Categorias agregadas
  const totCat={};mesesVisiveis.forEach(m=>{(byMes[m].categorias||[]).forEach(c=>{if(!totCat[c.n])totCat[c.n]={n:c.n,faturado:0,recebido:0,aberto:0};totCat[c.n].faturado+=c.faturado;totCat[c.n].recebido+=c.recebido;totCat[c.n].aberto+=c.aberto})});
  tot.categorias=Object.values(totCat).sort((a,b)=>b.faturado-a.faturado);
  // categoriasCA: sempre do CA (para inadimplência)
  const totCatCA={};mesesVisiveis.forEach(m=>{(byMes[m].categoriasCA||[]).forEach(c=>{if(!totCatCA[c.n])totCatCA[c.n]={n:c.n,faturado:0,recebido:0,aberto:0};totCatCA[c.n].faturado+=c.faturado;totCatCA[c.n].recebido+=c.recebido;totCatCA[c.n].aberto+=c.aberto})});
  tot.categoriasCA=Object.values(totCatCA).sort((a,b)=>b.faturado-a.faturado);
  const totCpCat={};mesesVisiveis.forEach(m=>{(byMes[m]?.cpCategorias||[]).forEach(c=>{const k=c.n+"|"+c.grupo;if(!totCpCat[k])totCpCat[k]={n:c.n,grupo:c.grupo,valor:0};totCpCat[k].valor+=c.valor})});
  tot.cpCategorias=Object.values(totCpCat).sort((a,b)=>b.valor-a.valor);
  const totProf={};mesesVisiveis.forEach(m=>{(byMes[m]?.profissionais||[]).forEach(p=>{const k=p.n+"||"+p.d;if(!totProf[k])totProf[k]={...p,rb:0,rl:0,rep:0,at:0};totProf[k].rb+=p.rb;totProf[k].rl+=p.rl;totProf[k].rep+=p.rep;totProf[k].at+=p.at})});
  tot.profissionais=Object.values(totProf).map(p=>{const mc2=p.rl-p.rep,i2=calcImpostos(p.rl),ll2=mc2-i2.total;return{...p,mc:mc2,imp:i2.total,ll:ll2,mcP:p.rl>0?mc2/p.rl:0,repP:p.rl>0?p.rep/p.rl:0,llP:p.rl>0?ll2/p.rl:0,tAt:p.at>0?p.rl/p.at:0}}).sort((a,b)=>b.rl-a.rl);
  const totDisc={};mesesVisiveis.forEach(m=>{(byMes[m]?.disciplinas||[]).forEach(d=>{if(!totDisc[d.n])totDisc[d.n]={...d,rl:0,rep:0,at:0,pac:0};totDisc[d.n].rl+=d.rl;totDisc[d.n].rep+=d.rep;totDisc[d.n].at+=d.at;totDisc[d.n].pac+=d.pac})});
  tot.disciplinas=Object.values(totDisc).map(d=>{const mc2=d.rl-d.rep,i2=calcImpostos(d.rl),ll2=mc2-i2.total;return{...d,mc:mc2,imp:i2.total,ll:ll2,mcP:d.rl>0?mc2/d.rl:0,repP:d.rl>0?d.rep/d.rl:0,llP:d.rl>0?ll2/d.rl:0,tAt:d.at>0?d.rl/d.at:0,tPac:d.pac>0?d.rl/d.pac:0}}).sort((a,b)=>b.rl-a.rl);
  // Famílias: rebuild from atRows com Sets para evitar dupla contagem de pacientes
  const totFamMap={};
  atRows.forEach(r=>{
    const fn=r.familia||"Sem família";
    if(!totFamMap[fn])totFamMap[fn]={n:fn,rl:0,at:0,pacs:new Set()};
    totFamMap[fn].rl+=r.rl;totFamMap[fn].at++;totFamMap[fn].pacs.add(r.paciente);
  });
  tot.familias=Object.values(totFamMap).map(f=>({n:f.n,rl:f.rl,at:f.at,pac:f.pacs.size,tAt:f.at>0?f.rl/f.at:0,tPac:f.pacs.size>0?f.rl/f.pacs.size:0})).sort((a,b)=>b.rl-a.rl);
  byMes["TOTAL"]=tot;

  // FC REALIZADO: prioriza Pluggy (extrato bancário com datas reais) sobre CA
  // Se Pluggy não conectado, usa CA com data_vencimento como aproximação
  // Saldo inicial de Dezembro (anterior ao período de análise) — definido globalmente
  // Se Pluggy conectado, usa transações bancárias reais
  // FC: usa CA como fonte primária (data_pagamento real + categorias)
  // OFX fica disponível como conferência mas não substitui o CA categorizadocorreto
  let fcData;
  {
    // REALIZADO por CAIXA (data real): usa a MESMA fonte do fluxo diário
    // (extrato bancário manda na data; CA quitado só preenche o que o extrato não cobre).
    // Assim o realizado mensal = soma exata dos dias, e bate com o saldo do banco.
    const realSrc=(typeof fcDiarioFonteReal==="function")?fcDiarioFonteReal():{rows:[]};
    const rr=(realSrc.rows||[]).filter(r=>r.d&&r.v);
    const fcMeses=[...new Set(rr.map(r=>r.d.slice(0,7)))].sort();
    let acum=saldoInicialUnidade();
    fcData=fcMeses.map(m=>{
      const its=rr.filter(r=>r.d.slice(0,7)===m);
      const e=its.filter(r=>r.v>0).reduce((a,r)=>a+r.v,0);
      // Saídas por grupo — classifica a saída pela categoria (extrato traz categoria; CA idem)
      const g=grp=>its.filter(r=>r.v<0&&grupoCaixa(r.c)===grp).reduce((a,r)=>a-r.v,0);
      const rep=g("repasse"),com=g("comercial"),adm=g("administrativo"),fin=g("financeiro"),emp=g("emprestimo"),imp=g("imposto");
      const rend=its.filter(r=>r.v>0&&grupoCaixa(r.c)==="rendimento").reduce((a,r)=>a+r.v,0);
      // Saídas que não caíram em nenhum grupo conhecido (ex.: extrato sem categoria) → administrativo
      const somaGrupos=rep+com+adm+fin+emp+imp;
      const saidaTotal=its.filter(r=>r.v<0).reduce((a,r)=>a-r.v,0);
      const outros=saidaTotal-somaGrupos;
      const admAj=adm+(outros>0?outros:0);
      const s=rep+com+admAj+fin+emp+imp;
      const sm=e-s;acum+=sm;
      return{m:monthLabel(m),mes:m,e,s,sm,ac:acum,fonte:realSrc.fonte||"caixa",rep,com,adm:admAj,fin,rend,emp,imp};
    });
  }  // end FC build

  // ── FLUXO PREVISTO: todos os lançamentos por data_vencimento ──────────────
  const crPrev=CA_DATA?(CA_DATA.cr||[]).map(normalizarCRprevisto).filter(r=>r&&r.mes):[];
  const cpPrev=CA_DATA?(CA_DATA.cp||[]).map(normalizarCPprevisto).filter(r=>r&&r.mes):[];
  const prevMeses=[...new Set([...crPrev,...cpPrev].map(r=>r.mes).filter(Boolean))].sort();
  let acumPrev=SALDO_INICIAL_DEZ;
  const fcDataPrevisto=prevMeses.map(m=>{
    const crM=crPrev.filter(r=>r.mes===m);
    const cpM=cpPrev.filter(r=>r.mes===m);
    const e=crM.reduce((a,r)=>a+r.e,0);
    const rep=cpM.filter(r=>r.grupo==="repasse").reduce((a,r)=>a+r.s,0);
    const com=cpM.filter(r=>r.grupo==="comercial").reduce((a,r)=>a+r.s,0);
    const adm=cpM.filter(r=>r.grupo==="administrativo").reduce((a,r)=>a+r.s,0);
    const fin=cpM.filter(r=>r.grupo==="financeiro").reduce((a,r)=>a+r.s,0);
    const rend=cpM.filter(r=>r.grupo==="rendimento").reduce((a,r)=>a+r.s,0);
    const emp=cpM.filter(r=>r.grupo==="emprestimo").reduce((a,r)=>a+r.s,0);
    const s=rep+com+adm+fin+emp;
    const sm=e-s+rend; acumPrev+=sm;
    return{m:monthLabel(m),mes:m,e,s,sm,ac:acumPrev,fonte:"prev",rep,com,adm,fin,rend,emp,imp:0};
  });

  // Projeção: CA real (vencimentos futuros) ou média móvel se não houver
  if(fcData.length){
    const reais=fcData.filter(r=>!r.projecao&&r.e>0);
    const hoje=new Date().toISOString().slice(0,7);
    if(reais.length>0){
      let[y,mo]=fcData[fcData.length-1].mes.split("-").map(Number),ac2=fcData[fcData.length-1].ac;
      const buffer=[...reais];
      for(let i=0;i<6;i++){
        mo++;if(mo>12){mo=1;y++;}
        const ms=y+"-"+String(mo).padStart(2,"0");
        if(fcData.find(r=>r.mes===ms))continue;
        // Tenta usar lançamentos futuros do CA (valor em aberto no vencimento)
        const crFut=CA_DATA?(CA_DATA.cr||[]).map(normalizarCRfuture).filter(r=>r&&r.mes===ms):[];
        const cpFut=CA_DATA?(CA_DATA.cp||[]).map(normalizarCPfuture).filter(r=>r&&r.mes===ms):[];
        const caE=crFut.reduce((a,r)=>a+r.aberto,0);
        const caS=cpFut.reduce((a,r)=>a+r.aberto,0);
        let e,s,fonte,rep=0,com=0,adm=0,fin=0,rend=0,emp=0,imp=0;
        if(caE>0||caS>0){
          // Usa dados reais do CA — breakdown por grupo
          e=caE;
          rep=cpFut.filter(r=>r.grupo==="repasse").reduce((a,r)=>a+r.aberto,0);
          com=cpFut.filter(r=>r.grupo==="comercial").reduce((a,r)=>a+r.aberto,0);
          adm=cpFut.filter(r=>r.grupo==="administrativo").reduce((a,r)=>a+r.aberto,0);
          fin=cpFut.filter(r=>r.grupo==="financeiro").reduce((a,r)=>a+r.aberto,0);
          rend=cpFut.filter(r=>r.grupo==="rendimento").reduce((a,r)=>a+r.aberto,0);
          emp=cpFut.filter(r=>r.grupo==="emprestimo").reduce((a,r)=>a+r.aberto,0);
          imp=cpFut.filter(r=>r.grupo==="imposto").reduce((a,r)=>a+r.aberto,0);
          s=rep+com+adm+fin+emp+imp;
          fonte="ca_prev";
        } else {
          // Fallback: média móvel dos últimos 3 meses
          const ultimos3=buffer.slice(-3);
          e=ultimos3.reduce((a,r)=>a+r.e,0)/ultimos3.length;
          s=ultimos3.reduce((a,r)=>a+r.s,0)/ultimos3.length;
          rep=ultimos3.reduce((a,r)=>a+(r.rep||0),0)/ultimos3.length;
          com=ultimos3.reduce((a,r)=>a+(r.com||0),0)/ultimos3.length;
          adm=ultimos3.reduce((a,r)=>a+(r.adm||0),0)/ultimos3.length;
          fin=ultimos3.reduce((a,r)=>a+(r.fin||0),0)/ultimos3.length;
          fonte="media";
        }
        const sm=e-s+rend; ac2+=sm;
        const novo={m:monthLabel(ms),mes:ms,e,s,sm,ac:ac2,projecao:true,fonte,rep,com,adm,fin,rend,emp,imp};
        fcData.push(novo);
        buffer.push(novo);
      }
    }
  }

  // ── DRE PREVISTO: timeline Jan→Dez do ano corrente ──────────────────────
  // Realizado (Excel) para meses com receita real; meses futuros/sem receita:
  // previsão do CA (competência) e, na ausência, média móvel dos últimos 3 meses.
  const _prevYear=hoje.slice(0,4);
  const _prevEnd=_prevYear+"-12";
  let _prevStart=(mesesVisiveis[0]||allMeses[0]||_prevYear+"-01");
  if(_prevStart<_prevYear+"-01")_prevStart=_prevYear+"-01"; // clampa ao ano corrente (Jan→Dez)
  const drePrevMeses=[];{let _py=+_prevStart.slice(0,4),_pm=+_prevStart.slice(5,7);while(true){const _ms=_py+"-"+String(_pm).padStart(2,"0");if(_ms>_prevEnd)break;drePrevMeses.push(_ms);_pm++;if(_pm>12){_pm=1;_py++;}}}

  // Meses REALIZADOS para efeito da DRE anual = os que têm receita Excel real (>0)
  const _realMeses=drePrevMeses.filter(m=>byMes[m]&&(byMes[m].rb_excel||0)>0);
  // Base de média móvel: últimos 3 meses realizados
  const _base=_realMeses.slice(-3).map(m=>byMes[m]);
  const _avg=k=>_base.length?_base.reduce((a,d)=>a+(d[k]||0),0)/_base.length:0;
  const _media=_base.length?{
    rb:_avg("rb_excel"),rl:_avg("rl"),rep:_avg("rep"),
    desp_comercial:_avg("desp_comercial"),desp_admin:_avg("desp_admin"),
    desp_financeiro:_avg("desp_financeiro"),rendimentos:_avg("rendimentos"),
    ratio:_avg("rb_excel")>0?_avg("rl")/_avg("rb_excel"):1
  }:null;

  function buildMonthPrev(mes,media){
    const crM=cr.filter(r=>r.mes===mes),cpM=cp.filter(r=>r.mes===mes);
    const sumG=g=>cpM.filter(r=>r.grupo===g).reduce((a,r)=>a+r.original,0);
    // Valores do CA por competência (podem ser 0 se não há lançamento futuro)
    let rb=crM.reduce((a,r)=>a+r.faturado,0);
    let rep=sumG("repasse"),desp_comercial=sumG("comercial"),desp_admin=sumG("administrativo"),desp_financeiro=sumG("financeiro"),rendimentos=sumG("rendimento");
    let fonteRb="ca";
    // Fallback: média móvel quando o CA não tem lançamento para a linha
    if(media){
      if(rb<=0){rb=media.rb;fonteRb="media";}
      if(rep<=0)rep=media.rep;
      if(desp_comercial<=0)desp_comercial=media.desp_comercial;
      if(desp_admin<=0)desp_admin=media.desp_admin;
      if(desp_financeiro<=0)desp_financeiro=media.desp_financeiro;
      if(rendimentos<=0)rendimentos=media.rendimentos;
    }
    // Receita líquida: se veio do CA usa o próprio total; se veio da média aplica o desconto médio
    const rl=(fonteRb==="media"&&media)?rb*media.ratio:rb;
    // Impostos: valor real do CA se lançado, senão provisão sobre rl
    const cn=s=>(s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const paid=nm=>cpM.filter(r=>cn(r.cat)===nm).reduce((a,r)=>a+r.original,0);
    const pisP=paid("pis"),cofP=paid("cofins"),issP=paid("iss"),csllP=paid("csll"),irpjP=paid("irpj"),adicP=paid("irpj adicional");
    const im=calcImpostos(rl);
    const impostos={...im,
      pis:pisP>0?pisP:im.pis,cofins:cofP>0?cofP:im.cofins,iss:issP>0?issP:im.iss,
      csll:csllP>0?csllP:im.csll,irpj:irpjP>0?irpjP:im.irpj,adicional:adicP>0?adicP:im.adicional,
      csllFromCA:csllP>0,irpjFromCA:irpjP>0,adicFromCA:adicP>0};
    impostos.total=impostos.pis+impostos.cofins+impostos.iss+impostos.csll+impostos.irpj+impostos.adicional;
    // Categorias de receita (drill-down): CR se houver, senão linha única de projeção
    const catMap={};crM.forEach(r=>{if(!catMap[r.cat])catMap[r.cat]={n:r.cat,faturado:0,recebido:0,aberto:0};catMap[r.cat].faturado+=r.faturado;catMap[r.cat].recebido+=r.recebido;catMap[r.cat].aberto+=r.aberto});
    let categorias=Object.values(catMap).sort((a,b)=>b.faturado-a.faturado);
    if(fonteRb==="media")categorias=[{n:"Projeção (média 3m)",faturado:rb,recebido:rl,aberto:0}];
    // Categorias de despesa (drill-down): CP se houver, senão linhas de projeção por grupo
    const cpCatMap={};cpM.forEach(r=>{const k=r.cat+"|"+r.grupo;if(!cpCatMap[k])cpCatMap[k]={n:r.cat,grupo:r.grupo,valor:0};cpCatMap[k].valor+=r.original});
    const addProj=(grupo,val)=>{if(val>0&&!Object.values(cpCatMap).some(c=>c.grupo===grupo))cpCatMap["proj_"+grupo]={n:"Projeção (média 3m)",grupo,valor:val};};
    addProj("repasse",rep);addProj("comercial",desp_comercial);addProj("administrativo",desp_admin);addProj("financeiro",desp_financeiro);addProj("rendimento",rendimentos);
    const cpCategorias=Object.values(cpCatMap).sort((a,b)=>b.valor-a.valor);
    const ded=impostos.pis+impostos.cofins+impostos.iss;
    const rl_liq=rl-ded,margem_bruta=rl_liq-rep,ebitda=margem_bruta-desp_comercial-desp_admin;
    const rf=rendimentos-desp_financeiro,ebt=ebitda+rf,csll_irpj=impostos.csll+impostos.irpj+impostos.adicional,ll=ebt-csll_irpj;
    return{mes,rl,rb_excel:rb,desc_excel:0,recebido:0,abertoCR:0,rep,desp_comercial,desp_admin,desp_financeiro,rendimentos,emprestimo:0,rf,ebt,margem_bruta,ebitda,impostos,ll,at:crM.length,pac:0,categorias,categoriasCA:categorias,cpCategorias,profissionais:[],disciplinas:[],familias:[],_previsto:true,_fonteRb:fonteRb};
  }

  const byMesPrev={};const drePrevSet=new Set();const drePrevFonte={};
  drePrevMeses.forEach(m=>{
    if(byMes[m]&&(byMes[m].rb_excel||0)>0){byMesPrev[m]=byMes[m];}       // realizado (receita Excel real)
    else{const d=buildMonthPrev(m,_media);byMesPrev[m]=d;drePrevSet.add(m);drePrevFonte[m]=d._fonteRb;} // previsão
  });
  // Previsão pura (todos os meses) — base do comparativo Previsto × Realizado
  const byMesFore={};drePrevMeses.forEach(m=>{byMesFore[m]=buildMonthPrev(m,_media);});

  // Meses visíveis: apenas meses com dados Excel (atRows)
  // Isso garante que o TOTAL = exatamente a soma dos meses no seletor
  MESES=mesesVisiveis;
  if(CUR_MES!=="TOTAL"&&!MESES.includes(CUR_MES))CUR_MES="TOTAL";
  APP={byMes,allMeses,mesesVisiveis,fcData,fcDataPrevisto,atRows,crRows:cr,cpRows:cp,byMesPrev,drePrevMeses,drePrevSet,drePrevFonte,byMesFore};
  if(silent) return APP; // usado pelo consolidado para calcular cada unidade sem renderizar
  if(UNIT==="consolidado") applyConsolidatedTaxes();
  buildMesBar();updateHeaderKPIs();updateSyncBadge(true);render();
  return APP;
}

// Movimentos bancários (extrato) da unidade ativa → [{d,v,ds,c}]
// ── CONCILIAÇÃO extrato × Conta Azul ───────────────────────────────────────
// O CA da Lapa tem categoria rica mas NÃO tem data de pagamento (endpoints de
// "baixas" retornam 404). O extrato tem data/valor reais mas não tem categoria.
// Casamos cada lançamento do banco com a conta do CA por VALOR + data próxima
// para herdar a categoria. Sem match → palavra-chave na descrição do banco.
let FC_CONC={tot:0,ca:0,desc:0,sem:0};
function classificaDescricaoBanco(ds){
  const s=(ds||"").toLowerCase();
  if(!s)return "";
  if(s.includes("tarifa")||s.includes("cesta")||s.includes("iof")||s.includes("juros")||s.includes("anuidade")||s.includes("manutencao de conta")||s.includes("pacote de servi"))return "Tarifas Bancárias";
  if(s.includes("darf")||s.includes("gps ")||s.includes("das ")||s.includes("simples nacional")||s.includes("inss")||s.includes("fgts")||s.includes("iss")||s.includes("iptu")||s.includes("tribut")||s.includes("imposto"))return "Impostos";
  if(s.includes("rend pago")||s.includes("rendimento")||s.includes("aplicac")||s.includes("aplicaç")||s.includes("resgate"))return "Rendimentos";
  if(s.includes("emprest")||s.includes("emprést")||s.includes("financiamento")||s.includes("amortiz")||s.includes("parcela credito"))return "Empréstimo";
  if(s.includes("salario")||s.includes("salário")||s.includes("folha")||s.includes("pro labore")||s.includes("pró-labore")||s.includes("prolabore"))return "Salários";
  if(s.includes("aluguel"))return "Aluguel";
  return "";
}
function concInfo(){
  const t=FC_CONC.tot; if(!t)return "";
  const pct=Math.round((FC_CONC.ca/t)*100);
  let s=` · 🔗 ${FC_CONC.ca}/${t} lançamentos do banco com categoria do Conta Azul (${pct}%)`;
  if(FC_CONC.desc)s+=`, ${FC_CONC.desc} pela descrição`;
  if(FC_CONC.sem)s+=`, ${FC_CONC.sem} sem categoria → Desp. Adm.`;
  return s;
}
function conciliarExtrato(exRows){
  FC_CONC={tot:exRows.length,ca:0,desc:0,sem:0};
  if(!exRows.length)return exRows;
  // índice do CA: valor em centavos → lista de {d, cat, sinal}
  const idx=new Map();
  const add=(it,sinal)=>{
    const pago=toNum(it.pago||0); if(pago<=0||isTransfer(it))return;
    const d=(it.data_vencimento||it.data_competencia||"").slice(0,10); if(!d)return;
    const cat=(it.categorias&&it.categorias[0]&&it.categorias[0].nome)||"";
    if(!cat)return;
    const k=Math.round(pago*100)+"|"+sinal;
    if(!idx.has(k))idx.set(k,[]);
    idx.get(k).push({d,cat,usado:false});
  };
  if(CA_DATA){(CA_DATA.cr||[]).forEach(it=>add(it,1));(CA_DATA.cp||[]).forEach(it=>add(it,-1));}
  const dias=(a,b)=>Math.abs((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/86400000);
  const JANELA=10; // dias de tolerância entre vencimento e pagamento efetivo
  return exRows.map(r=>{
    if(r.c){FC_CONC.ca++;return r;} // extrato já traz categoria (caso da VM)
    const k=Math.round(Math.abs(r.v)*100)+"|"+(r.v>0?1:-1);
    const cands=idx.get(k);
    if(cands){
      let melhor=null,melhorD=Infinity;
      for(const c of cands){ if(c.usado)continue; const dd=dias(r.d,c.d); if(dd<=JANELA&&dd<melhorD){melhor=c;melhorD=dd;} }
      if(melhor){melhor.usado=true;FC_CONC.ca++;return{...r,c:melhor.cat,conc:"ca"};}
    }
    const porDesc=classificaDescricaoBanco(r.ds);
    if(porDesc){FC_CONC.desc++;return{...r,c:porDesc,conc:"desc"};}
    FC_CONC.sem++;return r;
  });
}
function extratoRows(){
  const out=[];
  if(UNIT==="vm"||UNIT==="consolidado"){
    const v=vmData(); (v&&v.ex||[]).forEach(x=>out.push({d:x.d,v:x.v,ds:x.ds||"",c:x.c||"",u:"VM"}));
  }
  if(UNIT==="lapa"||UNIT==="consolidado"){
    const t=(OFX_DATA&&OFX_DATA.transactions)||[];
    t.forEach(x=>out.push({d:(x.date||"").slice(0,10),v:toNum(x.amount),ds:x.description||"",c:"",u:"Lapa"}));
  }
  return out.filter(r=>r.d&&r.v);
}

// Lê a planilha da Vila Mariana (abas Base + Despesas) no navegador → {atRows, cpRows}
function processExcelVM(wb){
  const X=window.XLSX;
  const num=v=>{ if(v==null||v==="")return 0; if(typeof v==="number")return v; const n=parseFloat(String(v).replace("R$","").replace(/\s/g,"")); return isNaN(n)?0:n; };
  const ymd=v=>{ if(v instanceof Date)return v.toISOString().slice(0,10); return String(v).slice(0,10); };
  const rows=name=>{ const ws=wb.Sheets[name]; return ws?X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}):[]; };
  // Base por ÍNDICE de coluna: 0 Data,1 Proc,2 Pac,3 Valor,4 Desc,5 ValorAReceber,6 Repasse(prof),7 ValorProf,8 CatDRE,9 Mês
  const base=rows("Base").slice(1), at=[], repMes={};
  for(const r of base){
    if(r[0]==null)continue;
    const mes=(r[9]!=null?String(r[9]):ymd(r[0])).slice(0,7);
    const receber=num(r[5]);           // receita = coluna F (Valor a Receber); Desconto não entra
    const rep=num(r[7]);
    at.push({mes,paciente:String(r[2]||"").trim(),familia:"Sem família",prof:String(r[6]||"").trim()||"Sem profissional",disc:String(r[8]||r[1]||"Sem categoria").trim(),rb:Math.round(receber*100)/100,rl:Math.round(receber*100)/100,rep:Math.round(rep*100)/100});
    repMes[mes]=(repMes[mes]||0)+rep;
  }
  // Despesas: 0 Data,1 Descrição,2 Valor,3 Categoria — "Sem categoria" é ignorada
  const desp=rows("Despesas").slice(1), cp=[];
  for(const r of desp){
    if(r[0]==null)continue;
    const val=Math.abs(num(r[2])); if(!val)continue;
    const cat=String(r[3]||"").trim();
    if(cat===""||cat.toLowerCase()==="sem categoria")continue;
    const d=ymd(r[0]);
    cp.push({total:Math.round(val*100)/100,pago:Math.round(val*100)/100,data_competencia:d,data_vencimento:d,categorias:[{nome:cat}],descricao:String(r[1]||"").trim()});
  }
  Object.keys(repMes).sort().forEach(mes=>{ const t=repMes[mes]; if(t>0)cp.push({total:Math.round(t*100)/100,pago:Math.round(t*100)/100,data_competencia:mes+"-15",data_vencimento:mes+"-15",categorias:[{nome:"Repasse Profissionais"}],descricao:"Repasse (Base)"}); });
  // Extrato bancário (fluxo de caixa diário): 0 Data,1 Lançamento,2 Razão Social,3 CPF/CNPJ,4 Valor,5 Saldo,6 Categoria,7 Data Num,8 Categoria FdC
  const exSheet=rows("Extrato").slice(1), ex=[]; let saldoIni=null;
  for(const r of exSheet){
    if(r[0]==null)continue;
    const ds=String(r[1]||"").trim();
    const val=num(r[4]);
    if(ds.toUpperCase().indexOf("SALDO ANTERIOR")>=0){ saldoIni=num(r[5]); continue; }
    if(!val)continue;
    ex.push({d:ymd(r[0]),v:Math.round(val*100)/100,ds:ds.slice(0,60),c:String(r[8]||r[6]||"").trim().slice(0,40)});
  }
  return {atRows:at, cpRows:cp, exRows:ex, saldoIni:saldoIni};
}

// Carrega o dataset da VM do servidor (GitHub). Retorna true se veio dado.

    }
  }catch(e){}
  return false;
}

// Botão "Atualizar planilha" da VM: lê o xlsx, salva no servidor (todos passam a ver)
async function onVMFile(ev){
  const file=ev.target.files[0]; if(!file)return;
  const btn=document.getElementById("btn-vm-upload"); const old=btn?btn.innerHTML:"";
  try{
    if(btn){btn.innerHTML="⏳ Processando…"; btn.disabled=true;}
    const buf=await file.arrayBuffer();
    const wb=window.XLSX.read(buf,{type:"array",cellDates:true});
    const {atRows,cpRows,exRows,saldoIni}=processExcelVM(wb);
    if(!atRows.length)throw new Error("Nenhum atendimento encontrado na aba Base");
    if(btn)btn.innerHTML="⏳ Salvando…";
    const r=await fetch(STORE+"?action=save&unit=vm",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({atRows,cpRows,exRows,saldoIni,fileName:file.name})});
    if(!r.ok){ let e={}; try{e=await r.json();}catch(_){}; throw new Error(e.error||("HTTP "+r.status)); }
    VM_SERVER={xl:{at:atRows,sheetName:"Vila Mariana (servidor)",preProcessed:true},ca:{cr:[],cp:cpRows},ex:exRows||VM_EX,saldoIni:(typeof saldoIni==="number"?saldoIni:VM_SALDO_INI)};
    if(UNIT==="vm"||UNIT==="consolidado")applyUnit();
    if(btn)btn.innerHTML="✅ Atualizada!";
    setTimeout(()=>{ if(btn){btn.innerHTML=old; btn.disabled=false;} },2500);
  }catch(e){
    alert("Erro ao atualizar a planilha da Vila Mariana:\n"+e.message);

// Consolidado: impostos = soma dos impostos de cada unidade (cada CNPJ calculado na própria base)
function applyConsolidatedTaxes(){
  const merged=APP, sx=XL_DATA, sc=CA_DATA, sMeses=MESES;
  XL_DATA=(LAPA_XL&&LAPA_XL.at&&LAPA_XL.at.length)?LAPA_XL:null; CA_DATA=LAPA_CA;
  const lapa=(XL_DATA||CA_DATA)?processData(true):{byMes:{}};
  const _v=vmData(); XL_DATA=_v.xl; CA_DATA=_v.ca;
  const vmU=processData(true)||{byMes:{}};
  XL_DATA=sx; CA_DATA=sc; APP=merged; MESES=sMeses; // restaura o modelo mesclado e o MESES global
  const Z={pis:0,cofins:0,iss:0,csll:0,irpj:0,adicional:0};
  Object.keys(merged.byMes).forEach(m=>{
    const d=merged.byMes[m];
    const lt=(lapa.byMes[m]&&lapa.byMes[m].impostos)||Z;
    const vt=(vmU.byMes[m]&&vmU.byMes[m].impostos)||Z;
    const imp={
      pis:(lt.pis||0)+(vt.pis||0), cofins:(lt.cofins||0)+(vt.cofins||0), iss:(lt.iss||0)+(vt.iss||0),
      csll:(lt.csll||0)+(vt.csll||0), irpj:(lt.irpj||0)+(vt.irpj||0), adicional:(lt.adicional||0)+(vt.adicional||0),
      csllFromCA:!!(lt.csllFromCA||vt.csllFromCA), irpjFromCA:!!(lt.irpjFromCA||vt.irpjFromCA), adicFromCA:!!(lt.adicFromCA||vt.adicFromCA)
    };
    imp.total=imp.pis+imp.cofins+imp.iss+imp.csll+imp.irpj+imp.adicional;
    d.impostos=imp;
    // recompõe as linhas que dependem de imposto
    const ded=imp.pis+imp.cofins+imp.iss, rl_liq=d.rl-ded;
    d.margem_bruta=rl_liq-d.rep;
    d.ebitda=d.margem_bruta-d.desp_comercial-d.desp_admin;
    d.ebt=d.ebitda+d.rf; // rf independe de imposto
    d.ll=d.ebt-(imp.csll+imp.irpj+imp.adicional);
    d.lucro_bruto=d.margem_bruta; d.lucro_operacional=d.ebitda;
    d.lucro_final=d.ebt; d.lucro_liquido_antes=d.ebt+(d.emprestimo||0);
  });
}

// Tooltip no hover mostra recebimentos, pagamentos e saldo. Usado no diário e no mensal.
let FC_TIPD=[];
function fcGrafico(items,opt){
  opt=opt||{};
  if(!items||!items.length)return '<div style="color:var(--muted);text-align:center;padding:20px">Sem dados</div>';
  FC_TIPD=items.map(x=>({lb:x.lb,e:x.e||0,s:x.s||0,sm:(x.e||0)-(x.s||0),ac:x.ac||0}));
  const W=1000,H=opt.h||270,padL=64,padR=16,padT=16,padB=28;
  const n=items.length,iw=W-padL-padR,ih=H-padT-padB,step=iw/n;
  const bw=Math.max(3,Math.min(26,step*0.5));
  const vals=[0];items.forEach(x=>{vals.push(x.ac||0,(x.e||0)-(x.s||0));});
  let mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  if(mx===mn){mx+=1;mn-=1;}
  const folga=(mx-mn)*0.12;mx+=folga;mn-=folga;
  const y=v=>padT+ih-((v-mn)/(mx-mn))*ih, x=i=>padL+step*(i+0.5);
  const kf=v=>{const a=Math.abs(v);return a>=1000?Math.round(v/1000)+"k":String(Math.round(v));};
  let grid="";
  for(let i=0;i<=5;i++){const t=mn+(mx-mn)*i/5,yy=y(t);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`+
          `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kf(t)}</text>`;}
  const y0=y(0);
  grid+=`<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="var(--muted)" stroke-width="1.2"/>`;
  let bars="";
  items.forEach((d,i)=>{const sm=(d.e||0)-(d.s||0);if(!sm)return;
    const yy=y(sm),top=Math.min(yy,y0),h=Math.max(1,Math.abs(yy-y0));
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${sm>=0?"#43b581":"#ef4c62"}" opacity=".88"/>`;});
  const pts=items.map((d,i)=>x(i).toFixed(1)+","+y(d.ac||0).toFixed(1)).join(" ");
  const linha=`<polyline points="${pts}" fill="none" stroke="#40587a" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`;
  let dots="";items.forEach((d,i)=>{dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(d.ac||0).toFixed(1)}" r="2.7" fill="#40587a"/>`;});
  let xl="";items.forEach((d,i)=>{if(n<=16||i%Math.ceil(n/16)===0)xl+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.xl||d.lb}</text>`;});
  let hov="";items.forEach((d,i)=>{hov+=`<rect x="${(padL+step*i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:crosshair" onmousemove="fcTip(event,${i})" onmouseleave="fcTipOff()"/>`;});
  return `<div class="fcg-wrap" style="position:relative;width:100%">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">${grid}${bars}${linha}${dots}${xl}${hov}</svg>
    <div id="fcg-tip" style="display:none;position:absolute;pointer-events:none;background:#2f6fd0;color:#fff;border-radius:9px;padding:9px 13px;font-size:11.5px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.24);z-index:20;white-space:nowrap"></div>
  </div>`;
}
window.fcTip=function(ev,i){
  const d=FC_TIPD[i];if(!d)return;

    `<div>Recebimentos: <b>${fR(d.e)}</b></div>`+

function barG(lbls,series,W,H){W=W||720;H=H||260;if(!lbls||!lbls.length)return"<div style='color:var(--muted);text-align:center;padding:20px'>Sem dados</div>";const pL=62,pR=16,pT=14,pB=52,cW=W-pL-pR,cH=H-pT-pB,n=Math.max(1,lbls.length),ns=Math.max(1,series.length);const allVals=series.flatMap(s=>s.v.map(v=>Math.abs(v||0)));const mx=Math.max(1,...allVals)*1.12||1;const bw=Math.min(22,(cW/n-6)/ns),gap=cW/n;let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;for(let g=0;g<=4;g++){const yy=pT+cH-g*(cH/4);s+=`<line x1="${pL}" y1="${yy}" x2="${pL+cW}" y2="${yy}" stroke="#f0e4dc" stroke-width="1"/><text x="${pL-3}" y="${yy+4}" text-anchor="end" font-size="9" fill="#c9b5aa" font-family="sans-serif">${fR(mx*g/4)}</text>`}series.forEach((sr,si)=>{sr.v.forEach((v,i)=>{const bh=Math.abs(v)/mx*cH,x=pL+i*gap+(si*bw)+(gap-ns*bw)/2;s+=`<rect x="${x}" y="${pT+cH-bh}" width="${bw-2}" height="${Math.max(bh,1)}" rx="2" fill="${Array.isArray(sr.c)?sr.c[i]||'var(--brand)':sr.c||'var(--brand)'}" opacity=".9"/>`})});lbls.forEach((l,i)=>{s+=`<text x="${pL+i*gap+gap/2}" y="${pT+cH+13}" text-anchor="middle" font-size="9" fill="#8b6b5a" font-family="sans-serif">${l}</text>`});series.forEach((sr,i)=>{const lx=pL+i*110;s+=`<rect x="${lx}" y="${pT+cH+26}" width="9" height="9" rx="2" fill="${sr.c}" opacity=".9"/><text x="${lx+13}" y="${pT+cH+34}" font-size="10" fill="#8b6b5a" font-family="sans-serif">${sr.nm}</text>`});return s+"</svg>"}
