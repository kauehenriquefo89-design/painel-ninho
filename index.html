// ── DRE RENDERER ──────────────────────────────────────────────────────────
let DRE_MODE = "normal";
let DRE_REALPREV = "real"; // "real" | "previsto"
let FC_MODE = "realizado"; // "realizado" | "previsto" | "ambos"
// Sort state per table: {tableId: {col, dir}}
const SORT_STATE={};
function sortTable(tableId, col, dir){
  const cur=SORT_STATE[tableId]||{};
  const actualDir=(cur.col===col&&cur.dir==="asc")?"desc":"asc";
  SORT_STATE[tableId]={col,dir:actualDir};
  dir=actualDir;
  const tbl=document.getElementById(tableId);
  if(!tbl)return;
  const tbody=tbl.querySelector("tbody");
  // For prof table: sort only main rows, keep sub-rows attached
  const isProfTable=tableId==="tbl-prof";
  if(isProfTable){
    const mainRows=[...tbody.querySelectorAll("tr.prof-main")];
    mainRows.sort((a,b)=>{
      const ca=a.cells[col]?.dataset?.v||a.cells[col]?.textContent?.replace(/[R$.()\s%▲▼]/g,"")||"0";
      const cb=b.cells[col]?.dataset?.v||b.cells[col]?.textContent?.replace(/[R$.()\s%▲▼]/g,"")||"0";
      const na=parseFloat(ca)||0,nb=parseFloat(cb)||0;
      const sa=isNaN(parseFloat(ca))?ca:null,sb=isNaN(parseFloat(cb))?cb:null;
      if(sa!==null&&sb!==null)return actualDir==="asc"?sa.localeCompare(sb,"pt-BR"):sb.localeCompare(sa,"pt-BR");
      return actualDir==="asc"?na-nb:nb-na;
    });
    mainRows.forEach(mainRow=>{
      const pid=mainRow.dataset.pid;
      tbody.appendChild(mainRow);
      // Move sub-rows right after their parent
      [...tbody.querySelectorAll(`.prof-sub-${pid}`)].forEach(sub=>tbody.appendChild(sub));
    });
    tbl.querySelectorAll("th.sort-th").forEach((th,i)=>{th.classList.remove("asc","desc");if(i===col)th.classList.add(actualDir);});
    return;
  }
  const rows=[...tbody.querySelectorAll("tr")];
  const idx=col;
  rows.sort((a,b)=>{
    const ca=a.cells[idx]?.dataset?.v||a.cells[idx]?.textContent?.replace(/[R$.()\s]/g,"")||"0";
    const cb=b.cells[idx]?.dataset?.v||b.cells[idx]?.textContent?.replace(/[R$.()\s]/g,"")||"0";
    const na=parseFloat(ca)||0, nb=parseFloat(cb)||0;
    const sa=isNaN(parseFloat(ca))?ca:null, sb=isNaN(parseFloat(cb))?cb:null;
    if(sa!==null&&sb!==null)return dir==="asc"?sa.localeCompare(sb,"pt-BR"):sb.localeCompare(sa,"pt-BR");
    return dir==="asc"?na-nb:nb-na;
  });
  rows.forEach(r=>tbody.appendChild(r));
  // Update header styles
  tbl.querySelectorAll("th.sort-th").forEach((th,i)=>{
    th.classList.remove("asc","desc");
    if(i===col)th.classList.add(dir);
  });
}
function thSort(tableId,col,label,cls){
  const s=SORT_STATE[tableId]||{};
  const isActive=s.col===col;
  const curDir=isActive?s.dir:"none";
  const nextDir=curDir==="asc"?"desc":"asc";
  return`<th class="sort-th${cls?" "+cls:""}${isActive?" "+curDir:""}" onclick="sortTable('${tableId}',${col},'${nextDir}')">${label}<span class="sort-arrows"><span class="up">▲</span><span class="dn">▼</span></span></th>`;
}

function renderDRE(){
  const el=document.getElementById("sec-dre");
  if(!APP){el.innerHTML=splashHTML();return;}
  const d=getActiveData();if(!d){el.innerHTML=splashHTML();return;}

  const rpToggle = DRE_MODE==="normal" ? `<span style="margin-left:14px;padding-left:14px;border-left:1px solid var(--border);display:inline-flex;gap:6px;align-items:center">
      <button class="dre-tb${DRE_REALPREV==="real"?" a":""}" onclick="setDreRealPrev('real')">✅ Realizado</button>
      <button class="dre-tb${DRE_REALPREV==="previsto"?" a":""}" onclick="setDreRealPrev('previsto')">📋 Previsto (até Dez)</button>
      <button class="dre-tb${DRE_REALPREV==="ambos"?" a":""}" onclick="setDreRealPrev('ambos')">⚖️ Prev × Real</button>
    </span>` : "";
  const toggleBar=`<div class="dre-toggle">
    <button class="dre-tb${DRE_MODE==="normal"?" a":""}" onclick="setDreMode('normal')">📊 DRE</button>
    <button class="dre-tb${DRE_MODE==="cc"?" a":""}" onclick="setDreMode('cc')">🏢 Centro de Custo</button>
    ${rpToggle}
    <button class="dre-tb" onclick="exportDRE()" style="margin-left:auto;background:#22c55e;color:#fff;border-color:transparent;font-size:11px">⬇ Excel</button>
  </div>`;

  if(DRE_MODE==="cc"){el.innerHTML=toggleBar+renderDREbyCostCenter(d);return;}

  const hasExcel=!!XL_DATA;

  // Modo Previsto: DRE anual (Jan→Dez), meses futuros com previsão do CA
  if(DRE_REALPREV==="previsto"){
    el.innerHTML=toggleBar+renderDREMulti(APP.drePrevMeses||[], hasExcel, {srcMap:APP.byMesPrev, prevSet:APP.drePrevSet, fonte:APP.drePrevFonte, previsto:true});
    return;
  }
  if(DRE_REALPREV==="ambos"){
    el.innerHTML=toggleBar+renderDRECompare(APP.drePrevMeses||[]);
    return;
  }

  // ── Determina meses para comparativo ────────────────────────────────────
  // Usa MESES_SEL (seletor superior) ou mês ativo
  const mesesExib = MESES_SEL.length>0
    ? MESES_SEL
    : (CUR_MES!=="TOTAL"&&!dtFrom&&!dtTo ? [CUR_MES] : null);

  // Sem seleção: DRE do período total
  if(!mesesExib||mesesExib.length===0){
    el.innerHTML=toggleBar+renderDRESingle(d,null,hasExcel);
    return;
  }

  // 1 mês: DRE simples
  if(mesesExib.length===1){
    const md=APP.byMes[mesesExib[0]];
    el.innerHTML=toggleBar+(md?renderDRESingle(md,mesesExib[0],hasExcel):`<div class="no-data">Sem dados para ${monthLabel(mesesExib[0])}</div>`);
    return;
  }

  // 2+ meses: tabela comparativa
  el.innerHTML=toggleBar+renderDREMulti(mesesExib,hasExcel);
}

// ── DRE Período único (original) ──────────────────────────────────────────
function renderDRESingle(d, mes, hasExcel){
  const lbl=mes?monthLabel(mes):"Período Selecionado";

  const rb=d.rb_excel||d.rl;
  const desc=d.desc_excel||0;
  const rl=d.rl;
  const imp=d.impostos||calcImpostos(rl);
  // Usa PIS/COFINS/ISS do d.impostos (CA real se lançado, senão provisão)
  const deducoes=(imp.pis||0)+(imp.cofins||0)+(imp.iss||0);
  const rl_liq=rl-deducoes;
  const rep=d.rep;
  const margem_bruta=rl_liq-rep;
  const desp_comercial=d.desp_comercial||0;
  const desp_admin=d.desp_admin||0;
  const ebitda=margem_bruta-desp_comercial-desp_admin;
  const rendVal=d.rendimentos||0;
  const finVal=d.desp_financeiro||0;
  const rf=rendVal-finVal;
  const ebt=ebitda+rf;
  const csll_irpj=(imp.csll||0)+(imp.irpj||0)+(imp.adicional||0);
  const ll=ebt-csll_irpj;

  const alerts=[];
  if(ll<0)alerts.push({tipo:"red",msg:`Lucro Líquido negativo: ${fR(ll)} — despesas superam receita líquida`});
  if(rb>0&&margem_bruta/rb<0.3)alerts.push({tipo:"yellow",msg:`Margem Bruta baixa (${fP(margem_bruta/rb)}) — repasses elevados`});
  if(!hasExcel)alerts.push({tipo:"red",msg:`⚠ Excel não conectado — Receita Bruta indisponível`});

  const cpCats=d.cpCategorias||[];
  const comerciais=cpCats.filter(c=>c.grupo==="comercial");
  const admins=cpCats.filter(c=>c.grupo==="administrativo");
  const rendimentos_cats=cpCats.filter(c=>c.grupo==="rendimento");
  const financeiros=cpCats.filter(c=>c.grupo==="financeiro");
  const recCats=d.categorias||[];

  // Função drill-down row
  const sec=(id,label,val,color,children)=>{
    const pct=rb>0?val/rb:0;
    const hasKids=children&&children.length>0;
    const icon=hasKids?`<span id="ico-${id}" style="font-size:10px;margin-right:4px;opacity:.5">▶</span>`:"  ";
    const click=hasKids?`onclick="dreDrill('${id}')" style="cursor:pointer"`:"";
    return`<tr class="dre-main" ${click}>
      <td style="font-weight:700;color:${color||"var(--text)"};padding-left:8px;font-size:12px">${icon}${label}</td>
      <td class="r mn" style="color:${color||"var(--text)"};font-weight:600">${fR(val)}</td>
      <td class="r" style="color:var(--muted);font-size:10px">${fP(pct)}</td>
    </tr>
    ${hasKids?`<tr id="dr-${id}" style="display:none"><td colspan="3" style="padding:0">
      <table style="width:100%;background:var(--hover)">
      ${children.map(c=>`<tr>
        <td style="font-size:10px;color:var(--muted);padding-left:28px">↳ ${c.l}</td>
        <td class="r mn" style="font-size:10px;color:var(--muted)">${fR(c.v)}</td>
        <td class="r" style="font-size:10px;color:var(--subtle)">${fP(rb>0?c.v/rb:0)}</td>
      </tr>`).join("")}
      </table></td></tr>`:""}`;
  };
  const sep=()=>`<tr class="dsp"><td colspan="3"></td></tr>`;

  return`
  ${alerts.map(a=>`<div class="alrt ${a.tipo}">⚠ ${a.msg}</div>`).join("")}
  <div class="cards">
    ${kCard("Receita Bruta",fR(rb),"","var(--blue)",hasExcel?d.at+" atend.":"⚠ Requer Excel")}

      <tr><td style="font-weight:700;padding-left:8px;font-size:12px;color:${margem_bruta>=0?"var(--gold)":"var(--red)"}"  >= MARGEM BRUTA</td><td class="r mn" style="color:${margem_bruta>=0?"var(--gold)":"var(--red)"};font-weight:600">${fR(margem_bruta)}</td><td class="r" style="font-size:10px;color:var(--muted)">${fP(rb>0?margem_bruta/rb:0)}</td></tr>

// ── DRE Multi-colunas (comparativo) ───────────────────────────────────────
function renderDREMulti(meses, hasExcel, opts){
  opts=opts||{};
  const src=opts.srcMap||APP.byMes;
  const prevSet=opts.prevSet||new Set();
  const fonteMap=opts.fonte||{};
  const isPrevView=!!opts.previsto;
  // Prepara dados de cada mês
  const cols=meses.map(m=>{
    const md=src[m];if(!md)return null;
    const rb=md.rb_excel||md.rl;
    const desc=md.desc_excel||0;
    const rl=md.rl;
    const imp2=md.impostos||calcImpostos(rl);
    const rl_liq=rl-((imp2.pis||0)+(imp2.cofins||0)+(imp2.iss||0));
    const rep=md.rep;
    const mb=rl_liq-rep;
    const dc=md.desp_comercial||0, da=md.desp_admin||0;
    const ebitda=mb-dc-da;
    const rf=(md.rendimentos||0)-(md.desp_financeiro||0);
    const ebt=ebitda+rf;
    const imp=md.impostos||{csll:0,irpj:0,adicional:0};
    const csll_irpj=(imp.csll||0)+(imp.irpj||0)+(imp.adicional||0);
    const ll=ebt-csll_irpj;
    return{m,rb,desc,rl,rl_liq,rep,mb,dc,da,ebitda,rf,ebt,csll_irpj,ll,imp,
      cats:md.categorias||[], cpCats:md.cpCategorias||[], at:md.at||0};
  }).filter(Boolean);

  if(!cols.length)return`<div class="no-data">Sem dados para os meses selecionados</div>`;

  // Variação % entre primeiro e último mês selecionado
  const varPct=(a,b)=>b&&b!==0?((a-b)/Math.abs(b)):null;
  const varSpan=(cur,prev,inv)=>{
    const v=varPct(cur,prev);
    if(v===null||prev===0)return"";
    const pos=inv?v<0:v>0;
    return`<span style="font-size:9px;color:${pos?"var(--green)":"var(--red)"}">${v>0?"▲":"▼"}${Math.abs(v*100).toFixed(1)}%</span>`;
  };

  // Cabeçalho
  const nCols=cols.length;
  const colW=Math.floor(520/nCols);
  let thead=`<thead><tr><th style="min-width:180px">Linha</th>`;
  cols.forEach((c,i)=>{
    const isP=prevSet.has(c.m);
    const _bl=fonteMap[c.m]==="media"?"📊 média":fonteMap[c.m]==="ca"?"📋 CA":"📋 prev";
    thead+=`<th class="r" style="width:${colW}px${isP?";color:var(--brand)":""}">${monthLabel(c.m)}${isP?`<br><span style="font-size:8px;font-weight:400;opacity:.85">${_bl}</span>`:""}</th>`;
    thead+=`<th class="r" style="width:38px;font-size:9px;color:var(--muted)">AV%</th>`;
    if(i>0)thead+=`<th class="r" style="width:50px;font-size:9px;color:var(--muted)">Var%</th>`;
  });
  thead+=`</tr></thead>`;

  // Linha de dados
  const row=(label,fn,color,bold,sep)=>{
    let r=`<tr class="${sep?"dsp":""}"><td style="font-weight:${bold?700:400};color:${color||"var(--text)"};padding-left:8px;font-size:${bold?12:11}px">${label}</td>`;
    cols.forEach((c,i)=>{
      const v=fn(c);
      const rb=c.rb||1;
      r+=`<td class="r mn" style="color:${color||"var(--text)"};font-weight:${bold?600:400}">${fR(v)}</td>`;
      r+=`<td class="r" style="font-size:9px;color:var(--muted)">${fP(rb>0?v/rb:0)}</td>`;
      if(i>0){
        const prev=fn(cols[i-1]);
        r+=`<td class="r" style="font-size:9px">${varSpan(v,prev,v<0)}</td>`;
      }
    });
    return r+`</tr>`;
  };

  // Linha com subcategorias por mês
  const rowSub=(label,fn,color)=>{
    let r=`<tr><td style="font-size:10px;color:${color||"var(--muted)"};padding-left:24px">↳ ${label}</td>`;
    cols.forEach((c,i)=>{
      const v=fn(c);
      const rb=c.rb||1;
      r+=`<td class="r mn" style="font-size:10px;color:${color||"var(--muted)"}">${fR(v)}</td>`;
      r+=`<td class="r" style="font-size:9px;color:var(--subtle)">${fP(rb>0?v/rb:0)}</td>`;
      if(i>0){
        const prev=fn(cols[i-1]);
        r+=`<td class="r" style="font-size:9px">${varSpan(v,prev,v<0)}</td>`;
      }
    });
    return r+`</tr>`;
  };

  const sep=()=>`<tr class="dsp"><td colspan="${1+nCols+(nCols-1)}"></td></tr>`;

  // Todas as categorias únicas
  const allRecCats=[...new Set(cols.flatMap(c=>c.cats.map(x=>x.n)))];
  const allRepasses=[...new Set(cols.flatMap(c=>c.cpCats.filter(x=>x.grupo==="repasse").map(x=>x.n)))];
  const allComercial=[...new Set(cols.flatMap(c=>c.cpCats.filter(x=>x.grupo==="comercial").map(x=>x.n)))];
  const allAdmin=[...new Set(cols.flatMap(c=>c.cpCats.filter(x=>x.grupo==="administrativo").map(x=>x.n)))];
  const allFin=[...new Set(cols.flatMap(c=>c.cpCats.filter(x=>x.grupo==="financeiro").map(x=>x.n)))];

  const allRend=[...new Set(cols.flatMap(c=>c.cpCats.filter(x=>x.grupo==="rendimento").map(x=>x.n)))];

  const getCat=(c,cats,n)=>(cats?cats.find(x=>x.n===n)?.faturado:0)||0;
  const getCpCat=(c,n)=>c.cpCats.find(x=>x.n===n)?.valor||0;

  const _srcInfo=isPrevView
    ? `📋 DRE Anual — Realizado (Excel+CA) · 📋 CA = lançado no Conta Azul · 📊 média = média móvel dos últimos 3 meses`
    : `📊 Selecione até 6 meses para comparar · Receita: Excel · Despesas: Conta Azul (competência)`;
  const _titulo=isPrevView
    ? `DRE Anual — Realizado + Previsto (${monthLabel(cols[0].m)} → ${monthLabel(cols[cols.length-1].m)})`
    : `DRE Comparativa — ${cols.map(c=>monthLabel(c.m)).join(" × ")}`;
  return`
  <div class="src-info">${_srcInfo}</div>
  <div class="panel"><div class="pt">${_titulo} <span class="pt-badge">Competência</span></div>
  <div class="tw" style="overflow-x:auto"><table style="width:100%;min-width:${180+nCols*(colW+90)}px">
  ${thead}<tbody>
  ${row("01 RECEITA BRUTA",c=>c.rb,"var(--blue)",true)}
  ${allRecCats.map(n=>rowSub(n,c=>getCat(c,c.cats,n))).join("")}
  ${sep()}
  ${row("02 DEDUÇÕES",c=>-(c.desc+(c.imp.pis+c.imp.cofins+c.imp.iss)),"var(--red)",true)}
  ${row("= RECEITA LÍQUIDA",c=>c.rl_liq,"var(--brand)",true)}
  ${sep()}
  ${row("03 REPASSES",c=>-c.rep,"var(--red)",true)}
  ${allRepasses.map(n=>rowSub(n,c=>-getCpCat(c,n))).join("")}
  ${row("= MARGEM BRUTA",c=>c.mb,null,true)}
  ${sep()}
  ${row("04.1 DESPESAS COMERCIAIS",c=>-c.dc,"var(--red)",true)}
  ${allComercial.map(n=>rowSub(n,c=>-getCpCat(c,n))).join("")}
  ${row("04.2 DESPESAS ADMINISTRATIVAS",c=>-c.da,"var(--red)",true)}
  ${allAdmin.map(n=>rowSub(n,c=>-getCpCat(c,n))).join("")}
  ${row("= EBITDA",c=>c.ebitda,null,true)}
  ${sep()}
  ${row("05 RESULTADO FINANCEIRO",c=>c.rf,"var(--muted)",true)}
  ${allRend.map(n=>rowSub(n,c=>getCpCat(c,n))).join("")}
  ${allFin.map(n=>rowSub(n,c=>-getCpCat(c,n))).join("")}
  ${sep()}
  ${row("= EBT (ANTES DOS IMPOSTOS)",c=>c.ebt,null,true)}
  ${row("(–) CSLL/IRPJ (provisão)",c=>-c.csll_irpj,"var(--muted)",false)}
  ${sep()}
  ${row("= LUCRO LÍQUIDO",c=>c.ll,null,true)}
  </tbody></table></div></div>




  `;
}


function renderDRECompare(meses){
  const fore=APP.byMesFore||{}, real=APP.byMes||{}, foreFonte=APP.drePrevFonte||{};
  function deriveDRE(md){
    const rb=md.rb_excel||md.rl||0, desc=md.desc_excel||0, rl=md.rl||0;
    const imp=md.impostos||calcImpostos(rl);
    const ded=(imp.pis||0)+(imp.cofins||0)+(imp.iss||0);
    const rl_liq=rl-ded, rep=md.rep||0, mb=rl_liq-rep;
    const dc=md.desp_comercial||0, da=md.desp_admin||0, ebitda=mb-dc-da;
    const rf=(md.rendimentos||0)-(md.desp_financeiro||0), ebt=ebitda+rf;
    const csll_irpj=(imp.csll||0)+(imp.irpj||0)+(imp.adicional||0), ll=ebt-csll_irpj;
    return{rb,desc,ded,rl_liq,rep,mb,dc,da,ebitda,rf,ebt,csll_irpj,ll};
  }
  const cols=meses.map(m=>{
    const fMd=fore[m]; if(!fMd)return null;
    const rMd=(real[m]&&(real[m].rb_excel||0)>0)?real[m]:null; // realizado só com receita Excel real
    return{m,fMd,rMd,f:deriveDRE(fMd),r:rMd?deriveDRE(rMd):null,isReal:!!rMd,fonte:foreFonte[m]};
  }).filter(Boolean);
  if(!cols.length)return`<div class="no-data">Sem dados para o comparativo</div>`;
  const nC=cols.length, bl="2px solid var(--border)";

  // Acessores de categoria (funcionam tanto no previsto quanto no realizado)
  const getRec=(md,n)=>(md&&md.categorias?(md.categorias.find(x=>x.n===n)||{}).faturado:0)||0;
  const getCp=(md,n,g)=>(md&&md.cpCategorias?(md.cpCategorias.find(x=>x.n===n&&x.grupo===g)||{}).valor:0)||0;
  const uni=(arr)=>[...new Set(arr)];
  const recNames=uni(cols.flatMap(c=>[...(c.fMd.categorias||[]),...(c.rMd?(c.rMd.categorias||[]):[])].map(x=>x.n)));
  const cpNames=g=>uni(cols.flatMap(c=>[...(c.fMd.cpCategorias||[]),...(c.rMd?(c.rMd.cpCategorias||[]):[])].filter(x=>x.grupo===g).map(x=>x.n)));

  // Monta lista ordenada de linhas: principais (main) intercaladas com subcategorias (sub)
  const rows=[];
  let _curPid=null;
  const M=(l,get,o={})=>{_curPid=o.id||null;rows.push({l,get,main:1,pid:o.id||null,color:o.color,bold:o.bold});};
  const S=(l,get)=>rows.push({l,get,sub:1,pid:_curPid});
  const SEP=()=>{_curPid=null;rows.push({sepRow:1});};

  M("01 RECEITA BRUTA",d=>d.rb,{color:"var(--blue)",bold:1,id:"rec"});
  recNames.forEach(n=>S(n,md=>getRec(md,n)));
  SEP();
  M("02 DEDUÇÕES",d=>-(d.desc+d.ded),{color:"var(--red)",id:"ded"});
  S("PIS 0,65%",md=>-((md.impostos||{}).pis||0));
  S("COFINS 3,0%",md=>-((md.impostos||{}).cofins||0));
  S("ISS 5,0%",md=>-((md.impostos||{}).iss||0));
  M("= RECEITA LÍQUIDA",d=>d.rl_liq,{color:"var(--brand)",bold:1});
  SEP();
  M("03 REPASSES",d=>-d.rep,{color:"var(--red)",id:"rep"});
  cpNames("repasse").forEach(n=>S(n,md=>-getCp(md,n,"repasse")));
  M("= MARGEM BRUTA",d=>d.mb,{bold:1});
  SEP();
  M("04.1 DESPESAS COMERCIAIS",d=>-d.dc,{color:"var(--red)",id:"com"});
  cpNames("comercial").forEach(n=>S(n,md=>-getCp(md,n,"comercial")));
  M("04.2 DESPESAS ADMINISTRATIVAS",d=>-d.da,{color:"var(--red)",id:"adm"});
  cpNames("administrativo").forEach(n=>S(n,md=>-getCp(md,n,"administrativo")));
  M("= EBITDA",d=>d.ebitda,{bold:1});
  SEP();
  M("05 RESULTADO FINANCEIRO",d=>d.rf,{color:"var(--muted)",id:"fin"});
  cpNames("rendimento").forEach(n=>S(n+" (+)",md=>getCp(md,n,"rendimento")));
  cpNames("financeiro").forEach(n=>S(n+" (−)",md=>-getCp(md,n,"financeiro")));
  M("= EBT (ANTES DOS IMPOSTOS)",d=>d.ebt,{bold:1});
  M("(–) CSLL/IRPJ",d=>-d.csll_irpj,{color:"var(--muted)",id:"imp"});
  S("CSLL",md=>-((md.impostos||{}).csll||0));
  S("IRPJ",md=>-((md.impostos||{}).irpj||0));
  S("IRPJ Adicional",md=>-((md.impostos||{}).adicional||0));
  SEP();
  M("= LUCRO LÍQUIDO",d=>d.ll,{bold:1});

  // Cabeçalho em 2 níveis
  let head=`<thead><tr><th rowspan="2" style="min-width:180px;text-align:left;vertical-align:bottom">Linha</th>`;
  cols.forEach(c=>{
    const badge=c.isReal?"":(c.fonte==="media"?' <span style="font-size:8px;color:var(--brand)">📊</span>':' <span style="font-size:8px;color:var(--brand)">📋</span>');
    head+=`<th colspan="3" class="r" style="border-left:${bl};${c.isReal?"":"opacity:.9"}">${monthLabel(c.m)}${badge}</th>`;
  });
  head+=`</tr><tr>`;
  cols.forEach(()=>{head+=`<th class="r" style="font-size:9px;color:var(--brand);border-left:${bl};font-weight:600">Prev</th><th class="r" style="font-size:9px;color:var(--text);font-weight:600">Real</th><th class="r" style="font-size:9px;color:var(--muted)">Δ%</th>`;});
  head+=`</tr></thead>`;

  const fmtD=(rv,pv)=>{
    if(rv==null||pv==null||pv===0)return`<span style="color:var(--subtle);font-size:9px">—</span>`;
    const d=(rv-pv)/Math.abs(pv), g=(rv-pv)>=0;
    return`<span style="color:${g?"var(--green)":"var(--red)"};font-size:9px">${g?"▲":"▼"}${Math.abs(d*100).toFixed(0)}%</span>`;
  };

  const kidPids=new Set(rows.filter(r=>r.sub).map(r=>r.pid));
  let body="<tbody>";
  rows.forEach(row=>{
    if(row.sepRow){body+=`<tr class="dsp"><td colspan="${1+nC*3}"></td></tr>`;return;}
    const sub=row.sub;
    const hasKids=!sub&&row.pid&&kidPids.has(row.pid);
    const trAttr=sub?`class="cmp-sub cmp-sub-${row.pid}" style="display:none"`:(hasKids?`class="cmp-main" onclick="cmpDrill('${row.pid}')" style="cursor:pointer"`:"");
    const icon=hasKids?`<span id="cico-${row.pid}" style="font-size:10px;margin-right:3px;opacity:.55">▶</span>`:"";
    body+=`<tr ${trAttr}>`;
    body+=`<td style="${sub?`font-size:10px;color:var(--muted);padding-left:26px`:`font-weight:${row.bold?700:400};color:${row.color||"var(--text)"};padding-left:8px;font-size:${row.bold?12:11}px`}">${sub?"↳ ":icon}${row.l}</td>`;
    cols.forEach(c=>{
      const pv = sub ? row.get(c.fMd)       : row.get(c.f);
      const rv = sub ? (c.rMd?row.get(c.rMd):null) : (c.r?row.get(c.r):null);
      body+=`<td class="r mn" style="border-left:${bl};color:var(--brand);font-size:${sub?9:10}px${sub?";opacity:.85":""}">${fR(pv)}</td>`;
      body+=`<td class="r mn" style="font-size:${sub?9:10}px;color:${sub?"var(--muted)":(row.color||"var(--text)")};font-weight:${row.bold?600:400}">${rv==null?'<span style="color:var(--subtle)">—</span>':fR(rv)}</td>`;
      body+=`<td class="r">${fmtD(rv,pv)}</td>`;
    });
    body+=`</tr>`;
  });
  body+="</tbody>";

  return`

function renderDREbyCostCenter(d){
  if(!APP) return splashHTML();
  const hasExcel=!!XL_DATA, hasCA=!!CA_DATA;

  // ── PERÍODO ATIVO ────────────────────────────────────────────────────────
  const inPeriod=m=>{
    if(!m)return false;
    if(MESES_SEL.length>0)return MESES_SEL.includes(m);
    if(CUR_MES!=="TOTAL"&&!dtFrom&&!dtTo)return m===CUR_MES;
    if(dtFrom&&m<dtFrom)return false;
    if(dtTo&&m>dtTo)return false;
    return true;
  };

  // ── TOTAIS DRE (fonte única de verdade) ──────────────────────────────────
  const imp=d.impostos||{pis:0,cofins:0,iss:0,csll:0,irpj:0,adicional:0};
  const rb_total   = d.rb_excel||d.rl||0;
  const rl_total   = d.rl||0;
  const ded_total  = (imp.pis||0)+(imp.cofins||0)+(imp.iss||0);
  const desc_total = d.desc_excel||0;
  const rl_liq_total = rl_total - ded_total;
  const rep_total  = d.rep||0;
  const mb_total   = rl_liq_total - rep_total;
  const dc_total   = d.desp_comercial||0;
  const da_total   = d.desp_admin||0;
  const ebitda_total = mb_total - dc_total - da_total;
  const rend_total = d.rendimentos||0;
  const fin_total  = d.desp_financeiro||0;
  const rf_total   = rend_total - fin_total;
  const ebt_total  = ebitda_total + rf_total;
  const csll_irpj_total = (imp.csll||0)+(imp.irpj||0)+(imp.adicional||0);
  const ll_total   = ebt_total - csll_irpj_total;

  // ── RECEITA POR CC (Excel — col. Procedimento) ──────────────────────────
  const ccMap={};
  const addCC=n=>{if(!ccMap[n])ccMap[n]={n,rb:0,rl:0,rep:0,dc:0,da:0,rend:0,fin:0};};

  (APP.atRows||[]).filter(r=>inPeriod(r.mes)).forEach(r=>{
    const n=(r.disc||"Sem Procedimento");
    addCC(n);
    ccMap[n].rb+=(r.rb||0);
    ccMap[n].rl+=(r.rl||0);
  });

  // ── REPASSES E DESPESAS POR CC (Conta Azul — por competência) ────────────
  (CA_DATA?.cp||[]).forEach(item=>{
    const mes=toYYYYMM(item.data_competencia);
    if(!inPeriod(mes))return;
    const cat=item.categorias?.[0]?.nome||item.descricao||"";
    const grupo=getGrupoCp(cat);
    if(grupo==="imposto")return; // impostos distribuídos proporcionalmente depois
    const val=toNum(item.total||0);
    const ccs=item.centros_de_custo?.length?item.centros_de_custo:[{nome:"Sem Centro de Custo"}];
    ccs.forEach(cc=>{
      const n=cc.nome||"Sem Centro de Custo";
      addCC(n);
      if(grupo==="repasse")          ccMap[n].rep+=val;
      else if(grupo==="comercial")   ccMap[n].dc+=val;
      else if(grupo==="rendimento")  ccMap[n].rend+=val;
      else if(grupo==="financeiro")  ccMap[n].fin+=val;
      else if(grupo==="emprestimo")  {} // ignorado na DRE
      else                           ccMap[n].da+=val;
    });
  });

  // ── CÁLCULOS POR CC ──────────────────────────────────────────────────────
  const ccs=Object.values(ccMap);

  // Deduções proporcionais ao rl de cada CC (mesma base da DRE)
  ccs.forEach(cc=>{
    const prop=rl_total>0?cc.rl/rl_total:0;
    cc.ded   = ded_total*prop;               // PIS+COFINS+ISS proporcional
    cc.rl_liq= cc.rl - cc.ded;              // consistente com DRE
    cc.mb    = cc.rl_liq - cc.rep;
    cc.desp_op= cc.dc + cc.da;
    cc.ebitda = cc.mb - cc.desp_op;
    cc.rf    = cc.rend - cc.fin;
    cc.ebt   = cc.ebitda + cc.rf;
    // CSLL/IRPJ proporcional ao rb de cada CC
    cc.csll_irpj = rb_total>0?(csll_irpj_total*cc.rb/rb_total):0;
    cc.ll    = cc.ebt - cc.csll_irpj;
  });

  // ── AJUSTE RECONCILIAÇÃO (garante que total CC = total DRE) ─────────────
  // Diferença de repasses, despesas e RF vai para "Sem Centro de Custo"
  const sumCC=k=>ccs.reduce((a,c)=>a+(c[k]||0),0);
  const semCC=ccMap["Sem Centro de Custo"]||(addCC("Sem Centro de Custo"),ccMap["Sem Centro de Custo"]);

  const diffRep=rep_total - sumCC("rep");
  const diffDC =dc_total  - sumCC("dc");
  const diffDA =da_total  - sumCC("da");
  const diffRF =rf_total  - (sumCC("rend")-sumCC("fin"));

  if(Math.abs(diffRep)>0.5) semCC.rep+=diffRep;
  if(Math.abs(diffDC)>0.5)  semCC.dc+=diffDC;
  if(Math.abs(diffDA)>0.5)  semCC.da+=diffDA;
  if(Math.abs(diffRF)>0.5)  {semCC.rend+=diffRF>0?diffRF:0; semCC.fin+=diffRF<0?-diffRF:0;}

  // Recalcula Sem CC
  semCC.mb    =semCC.rl_liq-semCC.rep;
  semCC.desp_op=semCC.dc+semCC.da;
  semCC.ebitda=semCC.mb-semCC.desp_op;
  semCC.rf    =semCC.rend-semCC.fin;
  semCC.ebt   =semCC.ebitda+semCC.rf;
  semCC.csll_irpj=rb_total>0?(csll_irpj_total*semCC.rb/rb_total):0;
  semCC.ll    =semCC.ebt-semCC.csll_irpj;

  // Ordena: maior receita primeiro, sem CC no final
  const sorted=ccs.filter(c=>c.n!=="Sem Centro de Custo").sort((a,b)=>b.rb-a.rb);
  if(ccMap["Sem Centro de Custo"])sorted.push(ccMap["Sem Centro de Custo"]);

  // ── LINHA DE TOTAL ────────────────────────────────────────────────────────
  const tot={n:"TOTAL",rb:rb_total,rl:rl_total,ded:ded_total,rl_liq:rl_liq_total,
    rep:rep_total,mb:mb_total,desp_op:dc_total+da_total,ebitda:ebitda_total,
    rf:rf_total,ebt:ebt_total,csll_irpj:csll_irpj_total,ll:ll_total};

  if(!sorted.length) return`<div class="no-data">Nenhum dado encontrado.<br>
    <span style="font-size:11px;color:var(--muted)">Conecte Excel e Conta Azul.</span></div>`;

  // ── RENDERIZAÇÃO ──────────────────────────────────────────────────────────
  const fRow=(c,isTot)=>`<tr style="${isTot?"background:var(--hover);font-weight:700;border-top:2px solid var(--border)":""}">
    <td class="b" style="font-size:${isTot?12:11}px">${c.n}</td>
    <td class="r mn">${fR(c.rb)}</td>
    <td class="r mn" style="color:var(--red)">${c.ded?fR(-c.ded):""}</td>
    <td class="r mn">${fR(c.rl_liq)}</td>
    <td class="r mn" style="color:var(--red)">${c.rep?fR(-c.rep):""}</td>
    <td class="r mn b" style="color:${clr(c.mb)}">${fR(c.mb)}</td>
    <td class="r" style="font-size:10px">${bdg(c.rb>0?c.mb/c.rb:0)}</td>
    <td class="r mn" style="color:var(--red)">${c.desp_op?fR(-c.desp_op):""}</td>
    <td class="r mn b" style="color:${clr(c.ebitda)}">${fR(c.ebitda)}</td>
    <td class="r" style="font-size:10px">${bdg(c.rb>0?c.ebitda/c.rb:0)}</td>
    <td class="r mn" style="color:${clr(c.rf)}">${fR(c.rf)}</td>
    <td class="r mn b" style="color:${clr(c.ebt)}">${fR(c.ebt)}</td>
    <td class="r mn" style="color:var(--muted)">${c.csll_irpj?fR(-c.csll_irpj):""}</td>
    <td class="r mn b" style="color:${clr(c.ll)}">${fR(c.ll)}</td>
    <td class="r" style="font-size:10px">${bdg(c.rb>0?c.ll/c.rb:0)}</td>
  </tr>`;

  return`
  <div class="src-info">📊 Receita: ${hasExcel?"Excel · col. Procedimento":"⚠ Requer Excel"} · Custos: ${hasCA?"Conta Azul · competência":"⚠ Requer Conta Azul"} · Totais reconciliados com a DRE</div>
  <div class="panel"><div class="tw" style="overflow-x:auto">
  <table id="tbl-cc" style="width:100%;min-width:900px"><thead><tr>
    <th style="min-width:160px">Centro de Custo</th>
    <th class="r">Rec.Bruta</th>
    <th class="r">Deduções</th>
    <th class="r">Rec.Líquida</th>
    <th class="r">Repasse</th>
    <th class="r">Mg.Bruta</th>
    <th class="r">%MB</th>
    <th class="r">Desp.Op.</th>
    <th class="r">EBITDA</th>
    <th class="r">%EBITDA</th>
    <th class="r">Res.Fin.</th>
    <th class="r">EBT</th>
    <th class="r">CSLL/IRPJ</th>
    <th class="r">Lucro Líq.</th>
    <th class="r">%LL</th>
  </tr></thead><tbody>
  ${sorted.map(c=>fRow(c,false)).join("")}
  ${fRow(tot,true)}
  </tbody></table></div></div>




  `;
}


window.exportDRE=function(){
  if(!APP){alert("Carregue os dados primeiro.");return;}
  const meses=MESES_SEL.length>0?MESES_SEL:(CUR_MES!=="TOTAL"?[CUR_MES]:MESES);
  const wb=window.XLSX.utils.book_new();
  const fmtN=v=>v!=null&&!isNaN(v)?Math.round(v):"";
  const fmtP=v=>v!=null&&!isNaN(v)?+(v*100).toFixed(1):"";
  const getDRELines=(d,mesLabel)=>{
    if(!d)return[];
    const rb=d.rb_excel||d.rl||0;
    const imp=d.impostos||{pis:0,cofins:0,iss:0,csll:0,irpj:0,adicional:0};
    const deducoes=(imp.pis||0)+(imp.cofins||0)+(imp.iss||0);
    const desc=d.desc_excel||0;
    const rl_liq=d.rl-deducoes;
    const rep=d.rep||0;
    const mb=rl_liq-rep;
    const dc=d.desp_comercial||0,da=d.desp_admin||0;
    const ebitda=mb-dc-da;
    const rf=(d.rendimentos||0)-(d.desp_financeiro||0);
    const ebt=ebitda+rf;
    const csll_irpj=(imp.csll||0)+(imp.irpj||0)+(imp.adicional||0);
    const ll=ebt-csll_irpj;
    const av=v=>rb>0?fmtP(v/rb):"";
    const ln=(label,v,tipo)=>({"Mes":mesLabel,"Linha":label,"Valor":fmtN(v),"AV%":av(v),"Tipo":tipo||""});
    const br=()=>({"Mes":"","Linha":"","Valor":"","AV%":"","Tipo":""});
    const rows=[];
    rows.push(ln("01 RECEITA BRUTA",rb,"principal"));
    (d.categorias||[]).forEach(c=>rows.push(ln("  >> "+c.n,c.faturado,"sub")));
    rows.push(ln("02 DEDUCOES DA RECEITA BRUTA",-(deducoes+desc),"principal"));
    if(desc>0)rows.push(ln("  >> Descontos Concedidos",-desc,"sub"));
    rows.push(ln("  >> PIS 0,65%",-(imp.pis||0),"sub"));
    rows.push(ln("  >> COFINS 3,0%",-(imp.cofins||0),"sub"));
    rows.push(ln("  >> ISS 5,0%",-(imp.iss||0),"sub"));
    rows.push(ln("= RECEITA LIQUIDA",rl_liq,"resultado"));
    rows.push(br());
    rows.push(ln("03 REPASSES",-rep,"principal"));
    (d.cpCategorias||[]).filter(c=>c.grupo==="repasse").forEach(c=>rows.push(ln("  >> "+c.n,-c.valor,"sub")));
    rows.push(ln("= MARGEM BRUTA",mb,"resultado"));
    rows.push(br());
    rows.push(ln("04.1 DESPESAS COMERCIAIS",-dc,"principal"));
    (d.cpCategorias||[]).filter(c=>c.grupo==="comercial").forEach(c=>rows.push(ln("  >> "+c.n,-c.valor,"sub")));
    rows.push(ln("04.2 DESPESAS ADMINISTRATIVAS",-da,"principal"));
    (d.cpCategorias||[]).filter(c=>c.grupo==="administrativo").forEach(c=>rows.push(ln("  >> "+c.n,-c.valor,"sub")));
    rows.push(ln("= EBITDA",ebitda,"resultado"));
    rows.push(br());
    rows.push(ln("05 RESULTADO FINANCEIRO",rf,"principal"));
    (d.cpCategorias||[]).filter(c=>c.grupo==="rendimento").forEach(c=>rows.push(ln("  >> "+c.n,c.valor,"sub")));
    (d.cpCategorias||[]).filter(c=>c.grupo==="financeiro").forEach(c=>rows.push(ln("  >> "+c.n,-c.valor,"sub")));
    rows.push(ln("= EBT (ANTES DOS IMPOSTOS)",ebt,"resultado"));
    rows.push(br());
    rows.push(ln("CSLL / IRPJ",-csll_irpj,"principal"));
    rows.push(ln("  >> CSLL 9%/3",-(imp.csll||0),"sub"));
    rows.push(ln("  >> IRPJ 15%/3",-(imp.irpj||0),"sub"));
    rows.push(ln("  >> IRPJ Adicional",-(imp.adicional||0),"sub"));
    rows.push(br());
    rows.push(ln("= LUCRO LIQUIDO",ll,"resultado"));
    return rows;
  };
  const allRows=[];
  meses.forEach(m=>{
    allRows.push(...getDRELines(APP.byMes[m],m));
    allRows.push({"Mes":"","Linha":"---","Valor":"","AV%":"","Tipo":""});
  });
  if(meses.length>1) allRows.push(...getDRELines(getActiveData(),"TOTAL"));
  const ws=window.XLSX.utils.json_to_sheet(allRows,{header:["Mes","Linha","Valor","AV%","Tipo"]});
  ws["!cols"]=[{wch:10},{wch:50},{wch:16},{wch:8},{wch:10}];
  window.XLSX.utils.book_append_sheet(wb,ws,"DRE");
  const periodo=meses.length>1?meses[0]+"_a_"+meses[meses.length-1]:(meses[0]||"total");
  window.XLSX.writeFile(wb,"DRE_Espaco_Ninho_"+periodo+".xlsx");
};

// Agrega dados de múltiplos meses para abas de análise
function getAggData(){
  if(!APP)return null;
  const meses=MESES_SEL.length>0?MESES_SEL:(CUR_MES!=="TOTAL"?[CUR_MES]:null);
  if(!meses)return getActiveData(); // TOTAL normal
  if(meses.length===1)return APP.byMes[meses[0]]||getActiveData();
  // Múltiplos meses: agrega atRows e profissionais
  const atRows=[],profissionais=[],disciplinas=[],familias=[];
  const catMap={};
  meses.forEach(m=>{
    const d=APP.byMes[m];if(!d)return;
    if(d.atRows)atRows.push(...(d.atRows||[])); // não disponível aqui
    if(d.profissionais)profissionais.push(...d.profissionais);
    if(d.disciplinas)disciplinas.push(...d.disciplinas);
    if(d.familias)familias.push(...d.familias);
  });
  // Para ticket: agrega familias
  const famMap={};
  familias.forEach(f=>{
    if(!famMap[f.n])famMap[f.n]={n:f.n,rl:0,at:0,pac:f.pac||0};
    famMap[f.n].rl+=f.rl;famMap[f.n].at+=f.at;famMap[f.n].pac+=f.pac||0;
  });
  // Para procedimentos: agrega disciplinas
  const discMap={};
  disciplinas.forEach(d=>{
    if(!discMap[d.n])discMap[d.n]={...d};
    else{discMap[d.n].rl+=d.rl;discMap[d.n].rep+=d.rep;discMap[d.n].at+=d.at;
      discMap[d.n].mc+=d.mc;discMap[d.n].imp+=d.imp;discMap[d.n].ll+=d.ll;discMap[d.n].pac+=d.pac;}
  });
  const aggDisc=Object.values(discMap).map(d=>{
    const mc=d.rl-d.rep,i=calcImpostos(d.rl),ll=mc-i.total;
    return{...d,mc,imp:i.total,ll,mcP:d.rl>0?mc/d.rl:0,repP:d.rl>0?d.rep/d.rl:0,llP:d.rl>0?ll/d.rl:0,tAt:d.at>0?d.rl/d.at:0,tPac:d.pac>0?d.rl/d.pac:0};
  }).sort((a,b)=>b.rl-a.rl);
  const aggFam=Object.values(famMap).map(f=>({...f,tAt:f.at>0?f.rl/f.at:0,tPac:f.pac>0?f.rl/f.pac:0})).sort((a,b)=>b.rl-a.rl);

  // Agrega totais do período (soma de cada mês selecionado)
  let rl=0,rb_excel=0,rep=0,at=0,pac=0;
  const catMap2={};
  meses.forEach(m=>{
    const d=APP.byMes[m];if(!d)return;
    rl+=d.rl||0; rb_excel+=d.rb_excel||0; rep+=d.rep||0; at+=d.at||0; pac+=d.pac||0;
    (d.categorias||[]).forEach(c=>{
      if(!catMap2[c.n])catMap2[c.n]={n:c.n,faturado:0,recebido:0,aberto:0};
      catMap2[c.n].faturado+=c.faturado;catMap2[c.n].recebido+=c.recebido;catMap2[c.n].aberto+=c.aberto;
    });
  });
  const aggCategorias=Object.values(catMap2).sort((a,b)=>b.faturado-a.faturado);

  // Base da getActiveData mas com totais e detalhes agregados do período
  const base=getActiveData()||{};
  return{...base,rl,rb_excel,rep,at,pac,
    tAt:at>0?rl/at:0,tPac:pac>0?rl/pac:0,
    disciplinas:aggDisc,familias:aggFam,profissionais,categorias:aggCategorias};
}

// ── FLUXO DE CAIXA DIÁRIO ──────────────────────────────────────────────────
// Realizado: extrato bancário (data real). Sem extrato → CA por vencimento (badge avisa).
// Previsto: lançamentos do CA por data_vencimento.
// Lançamentos JÁ QUITADOS no Conta Azul, ignorando o intervalo já coberto pelo extrato
// (dentro da janela do extrato o banco já é a verdade → evita contar duas vezes)
function caQuitadoRows(pulaIni,pulaFim){
  const rows=[];if(!CA_DATA)return rows;
  const cat=it=>(it.categorias&&it.categorias[0]&&it.categorias[0].nome)||"";
  const dv=it=>(it.data_vencimento||it.data_competencia||"").slice(0,10);
  // Dentro da janela do extrato o banco é soberano. A borda inicial vai até o 1º dia do
  // mês em que o extrato começa — senão lançamentos por competência (ex.: pago dia 2,
  // compensado dia 5) entrariam de novo e duplicariam o movimento.
  const ini=pulaIni?pulaIni.slice(0,8)+"01":null;
  const dentro=d=>ini&&pulaFim&&d>=ini&&d<=pulaFim;
  (CA_DATA.cr||[]).forEach(it=>{const p=toNum(it.pago||0);if(p<=0||isTransfer(it))return;const d=dv(it);
    if(!d||dentro(d))return;
    rows.push({d,v:p,ds:(it.cliente&&(it.cliente.nome||it.cliente.razao_social))||it.descricao||"Recebimento",c:cat(it),k:"R",f:"ca"});});
  (CA_DATA.cp||[]).forEach(it=>{const p=toNum(it.pago||0);if(p<=0||isTransfer(it))return;const d=dv(it);
    if(!d||dentro(d))return;
    rows.push({d,v:-p,ds:it.descricao||"Pagamento",c:cat(it),k:"R",f:"ca"});});
  return rows;
}
// REALIZADO em camadas: extrato vale na janela que ele cobre; fora dela, Conta Azul quitado
function fcDiarioFonteReal(){
  const ex=conciliarExtrato(extratoRows()).map(r=>({...r,k:"R",f:"banco"}));
  const ds=ex.map(r=>r.d).sort();
  const exMin=ds[0]||null, exMax=ds[ds.length-1]||null;
  const ca=caQuitadoRows(exMin,exMax);
  const rows=[...ex,...ca];
  const fonte=ex.length?(ca.length?"hibrido":"extrato"):"ca";
  return{rows,fonte,exMin,exMax};
}
function fcDiarioFontePrev(){
  const rows=[];
  if(CA_DATA){
    (CA_DATA.cr||[]).forEach(it=>{if(isTransfer(it))return;const t=toNum(it.total||0);if(!t)return;
      const d=(it.data_vencimento||it.data_competencia||"").slice(0,10);if(!d)return;
      rows.push({d,v:t,ds:(it.cliente&&(it.cliente.nome||it.cliente.razao_social))||it.descricao||"A receber",c:(it.categorias&&it.categorias[0]&&it.categorias[0].nome)||""});});
    (CA_DATA.cp||[]).forEach(it=>{if(isTransfer(it))return;const t=toNum(it.total||0);if(!t)return;
      const d=(it.data_vencimento||it.data_competencia||"").slice(0,10);if(!d)return;
      rows.push({d,v:-t,ds:it.descricao||"A pagar",c:(it.categorias&&it.categorias[0]&&it.categorias[0].nome)||""});});
  }
  return{rows,fonte:"ca"};
}
// Agrega por dia dentro do mês, com saldo de abertura (tudo que veio antes)
function buildDiario(mes,src){
  const ini=mes+"-01";
  const [y,mo]=mes.split("-").map(Number);
  const ndias=new Date(y,mo,0).getDate();
  let abertura=saldoInicialUnidade();
  src.rows.forEach(r=>{ if(r.d<ini) abertura+=r.v; });
  const porDia={};
  src.rows.forEach(r=>{ if(r.d.slice(0,7)!==mes)return; (porDia[r.d]=porDia[r.d]||[]).push(r); });
  let ac=abertura; const dias=[];
  for(let i=1;i<=ndias;i++){
    const ds=mes+"-"+String(i).padStart(2,"0");
    const its=porDia[ds]||[];
    const e=its.filter(r=>r.v>0).reduce((a,r)=>a+r.v,0);
    const s=its.filter(r=>r.v<0).reduce((a,r)=>a-r.v,0);
    ac+=e-s;
    dias.push({d:ds,dia:i,e,s,sm:e-s,ac,itens:its,dow:new Date(y,mo-1,i).getDay()});
  }
  return{dias,abertura,fonte:src.fonte,ndias};
}
// Fonte HÍBRIDA (Projetado): extrato → CA quitado (preenche lacuna até hoje) → CA em aberto (futuro)
function fcDiarioFonteProj(){
  const hoje=new Date().toISOString().slice(0,10);
  const nomeCli=it=>(it.cliente&&(it.cliente.nome||it.cliente.razao_social))||it.descricao||"Recebimento";
  const cat=it=>(it.categorias&&it.categorias[0]&&it.categorias[0].nome)||"";
  const dv=it=>(it.data_vencimento||it.data_competencia||"").slice(0,10);
  const real=fcDiarioFonteReal();               // extrato + CA quitado (camadas 1 e 2)
  const rows=real.rows.filter(r=>r.d<=hoje);    // realizado nunca passa de hoje
  const ultimoEx=real.exMax||"";
  let corte=rows.length?rows.map(r=>r.d).sort().slice(-1)[0]:hoje;
  if(corte>hoje)corte=hoje;
  // Camada 3: em aberto (total − pago) com vencimento depois do corte = previsão
  if(CA_DATA){
    (CA_DATA.cr||[]).forEach(it=>{if(isTransfer(it))return;const ab=toNum(it.total||0)-toNum(it.pago||0);if(ab<=0)return;
      const d=dv(it); if(!d||d<=corte)return; rows.push({d,v:ab,ds:nomeCli(it),c:cat(it),k:"P",f:"ca"});});
    (CA_DATA.cp||[]).forEach(it=>{if(isTransfer(it))return;const ab=toNum(it.total||0)-toNum(it.pago||0);if(ab<=0)return;
      const d=dv(it); if(!d||d<=corte)return; rows.push({d,v:-ab,ds:it.descricao||"A pagar",c:cat(it),k:"P",f:"ca"});});
  }
  const temPrev=rows.some(r=>r.k==="P");
  return{rows,corte,fonte:"hibrido",temExtrato:!!ultimoEx,ultimoEx,temPrev};
}
// Série diária para um intervalo qualquer (usado no horizonte de 30 dias)
function buildRangeDias(ini,fim,src){
  let ab=saldoInicialUnidade();
  src.rows.forEach(r=>{if(r.d<ini)ab+=r.v;});
  const porDia={};
  src.rows.forEach(r=>{if(r.d>=ini&&r.d<=fim)(porDia[r.d]=porDia[r.d]||[]).push(r);});
  const dias=[];let ac=ab;
  const cur=new Date(ini+"T12:00:00"),end=new Date(fim+"T12:00:00");
  while(cur<=end){
    const ds=cur.toISOString().slice(0,10),its=porDia[ds]||[];
    const e=its.filter(x=>x.v>0).reduce((a,x)=>a+x.v,0);
    const s=its.filter(x=>x.v<0).reduce((a,x)=>a-x.v,0);
    ac+=e-s;
    dias.push({d:ds,dia:cur.getDate(),e,s,sm:e-s,ac,itens:its,dow:cur.getDay()});
    cur.setDate(cur.getDate()+1);
  }
  return{dias,abertura:ab};
}
// ══════════════════════════════════════════════════════════════════════════
//  FLUXO DE CAIXA — CENTRAL DE COMANDO FINANCEIRO (camada de apresentação)
//  IMPORTANTE: nenhuma lógica financeira aqui. Tudo é derivado das funções-fonte
//  já existentes: fcDiarioFonteReal / fcDiarioFontePrev / fcDiarioFonteProj /
//  buildDiario / buildRangeDias / saldoInicialUnidade / APP.fcData / APP.crRows.
// ══════════════════════════════════════════════════════════════════════════
let FC_HORIZON = 30;      // próximos dias: 7 | 15 | 30
let FC_MES_EXP = {};      // meses expandidos (fluxo mensal)
let FC_DAY_EXP = {};      // dias expandidos (fluxo diário)

const _ddmm = d => (d||"").slice(8)+"/"+(d||"").slice(5,7);
const _ddmmaa = d => (d||"").slice(8)+"/"+(d||"").slice(5,7)+"/"+(d||"").slice(2,4);

// Dinheiro compacto (R$ 190 mil / R$ 1,2 mi) com valor exato no hover
function fRk(v){
  if(v==null||isNaN(v))return '<span class="mn">—</span>';
  const ex=fR(v), a=Math.abs(v), neg=v<0; let s;
  if(a>=1e6)      s=(neg?"(":"")+"R$ "+(a/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi"+(neg?")":"");
  else if(a>=1e5) s=(neg?"(":"")+"R$ "+Math.round(a/1e3).toLocaleString("pt-BR")+" mil"+(neg?")":"");
  else            s=ex;
  return `<span class="mn" title="${ex}">${s}</span>`;
}

// Mês de referência do painel (selecionado; senão último mês com movimento real; nunca no futuro)
function fcMesRef(){
  const hoje=new Date().toISOString().slice(0,10), mesHoje=hoje.slice(0,7);
  if(FC_DIA_MES)return FC_DIA_MES;
  if(CUR_MES&&CUR_MES!=="TOTAL")return CUR_MES;
  const real=fcDiarioFonteReal();
  const meses=real.rows.map(r=>r.d.slice(0,7)).filter(m=>m&&m<=mesHoje).sort();
  return meses.length?meses[meses.length-1]:mesHoje;
}

// Resumo executivo — derivado SOMENTE das funções-fonte (lógica intacta)
function fcResumo(mesRef){
  const hoje=new Date().toISOString().slice(0,10);
  const proj=fcDiarioFonteProj();                 // real + previsto contínuo
  const corte=(proj.corte&&proj.corte<=hoje)?proj.corte:hoje;
  const [y,mo]=mesRef.split("-").map(Number);
  const fim=mesRef+"-"+String(new Date(y,mo,0).getDate()).padStart(2,"0");
  const saldoInicial=saldoInicialUnidade();
  const realRows=proj.rows.filter(r=>r.k!=="P");
  const saldoDisp=saldoInicial+realRows.reduce((a,r)=>a+r.v,0);   // acumulado real no corte
  const prevRows=proj.rows.filter(r=>r.k==="P"&&r.d>corte&&r.d<=fim);
  const entPrev=prevRows.filter(r=>r.v>0).reduce((a,r)=>a+r.v,0);
  const saiPrev=prevRows.filter(r=>r.v<0).reduce((a,r)=>a+(-r.v),0);
  const saldoProj=saldoDisp+entPrev-saiPrev;                       // = acumulado no fim
  // caminho projetado a partir de HOJE (menor saldo / risco) — parte da posição real
  const byDay={}; prevRows.forEach(r=>{byDay[r.d]=(byDay[r.d]||0)+r.v;});
  let ac=saldoDisp, minAc=saldoDisp, minData=corte;
  Object.keys(byDay).sort().forEach(d=>{ac+=byDay[d]; if(ac<minAc){minAc=ac;minData=d;}});
  const necessidade=minAc<0?Math.abs(minAc):0;
  return {hoje,corte,fim,mesRef,saldoInicial,saldoDisp,entPrev,saiPrev,saldoProj,minAc,minData,necessidade,proj};
}

// Contas a receber / inadimplência (das contas a receber do CA, já normalizadas)
function fcInadResumo(){
  const hoje=new Date().toISOString().slice(0,10);
  const cr=(APP&&APP.crRows)||[];
  let fat=0,rec=0,ab=0,venc=0; const cli=new Set();
  cr.forEach(r=>{ if(!(r.faturado>0))return; fat+=r.faturado; rec+=r.recebido; ab+=Math.max(0,r.faturado-r.recebido);
    if(r.venc&&r.venc<hoje&&r.emAberto>0.005){venc+=r.emAberto;cli.add(r.cliente);} });
  return {fat,rec,ab,venc,clientes:cli.size,pct:fat>0?venc/fat:0,pctAberto:fat>0?ab/fat:0,semCA:!cr.length};
}

// Status gerencial de um mês (não marca "risco" só porque o mês isolado é negativo)
function fcStatusMes(sm,ac,projecao){
  if(projecao) return {l:"PROJETADO",c:"var(--muted)",bg:"bo"};
  if(ac<0)     return {l:"RISCO",   c:"var(--red)",  bg:"br"};
  if(sm<0)     return {l:"ATENÇÃO", c:"var(--gold)", bg:"bo"};
  return          {l:"SAUDÁVEL",c:"var(--green)",bg:"bg"};
}

// ── Gráfico EVOLUÇÃO DO CAIXA: barras (movimento) + linha (saldo), divisor HOJE ──
function fcGraficoEvo(items,cutIndex){
  if(!items||!items.length)return '<div class="no-data">Sem dados no período.</div>';
  FC_TIPD=items.map(x=>({lb:x.lb,e:x.e||0,s:x.s||0,sm:(x.e||0)-(x.s||0),ac:x.ac||0}));
  const W=1000,H=300,padL=64,padR=16,padT=20,padB=30;
  const n=items.length,iw=W-padL-padR,ih=H-padT-padB,step=iw/n;
  const bw=Math.max(2,Math.min(22,step*0.46));
  const vals=[0]; items.forEach(x=>vals.push(x.ac||0,(x.e||0)-(x.s||0)));
  let mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  if(mx===mn){mx+=1;mn-=1;} const folga=(mx-mn)*0.12; mx+=folga; mn-=folga;
  const y=v=>padT+ih-((v-mn)/(mx-mn))*ih, x=i=>padL+step*(i+0.5);
  const kf=v=>{const a=Math.abs(v);return a>=1000?Math.round(v/1000)+"k":String(Math.round(v));};
  const y0=y(0);
  let grid="";
  for(let i=0;i<=5;i++){const t=mn+(mx-mn)*i/5,yy=y(t);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`+
          `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kf(t)}</text>`;}
  grid+=`<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="var(--muted)" stroke-width="1.1"/>`;
  // zona de risco (saldo futuro negativo)
  let risco="";
  if(mn<0){ const yb=Math.min(y(0),padT+ih); risco=`<rect x="${padL}" y="${y(0)}" width="${iw}" height="${Math.max(0,padT+ih-y(0))}" fill="var(--red)" opacity="0.05"/>`; }
  // barras de movimento
  let bars="";
  items.forEach((d,i)=>{const sm=(d.e||0)-(d.s||0); if(!sm)return;
    const yy=y(sm),top=Math.min(yy,y0),h=Math.max(1,Math.abs(yy-y0)), fut=cutIndex!=null&&i>cutIndex;
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${sm>=0?"#16a34a":"#dc2626"}" opacity="${fut?0.4:0.85}"/>`;});
  // linha do saldo — sólida (realizado) até o corte, tracejada (projetado) depois
  const ptsAll=items.map((d,i)=>x(i).toFixed(1)+","+y(d.ac||0).toFixed(1));
  let linha="";
  if(cutIndex==null||cutIndex>=n-1){
    linha=`<polyline points="${ptsAll.join(" ")}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>`;
  }else if(cutIndex<0){
    // mês inteiro no futuro → linha toda projetada (tracejada)
    linha=`<polyline points="${ptsAll.join(" ")}" fill="none" stroke="#C4622D" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  }else{
    const real=ptsAll.slice(0,cutIndex+1).join(" ");
    const futu=ptsAll.slice(cutIndex).join(" ");
    linha=`<polyline points="${real}" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>`+
          `<polyline points="${futu}" fill="none" stroke="#C4622D" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  }
  let dots=""; items.forEach((d,i)=>{const fut=cutIndex!=null&&i>cutIndex; dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(d.ac||0).toFixed(1)}" r="2.6" fill="${fut?"#C4622D":"#2563eb"}"/>`;});
  // divisor HOJE
  let hoje="";
  if(cutIndex!=null&&cutIndex>=0&&cutIndex<n){
    const hx=(padL+step*(cutIndex+1)).toFixed(1);
    hoje=`<line x1="${hx}" y1="${padT-4}" x2="${hx}" y2="${padT+ih}" stroke="var(--brand)" stroke-width="1.4" stroke-dasharray="4 3"/>`+
         `<text x="${hx}" y="${padT-8}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--brand)">HOJE</text>`;
  }
  let xl=""; items.forEach((d,i)=>{ if(n<=16||i%Math.ceil(n/16)===0) xl+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.xl||d.lb}</text>`;});
  let hov=""; items.forEach((d,i)=>{hov+=`<rect x="${(padL+step*i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:crosshair" onmousemove="fcTip(event,${i})" onmouseleave="fcTipOff()"/>`;});
  return `<div class="fcg-wrap" style="position:relative;width:100%">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">${grid}${risco}${bars}${linha}${dots}${hoje}${xl}${hov}</svg>
    <div id="fcg-tip" style="display:none;position:absolute;pointer-events:none;background:#2f6fd0;color:#fff;border-radius:9px;padding:9px 13px;font-size:11.5px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.24);z-index:20;white-space:nowrap"></div>
  </div>`;
}

  let alerta;
  if(r.necessidade>0){
    alerta=`<div style="background:#fdecea;border:1px solid #f5c6c0;border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;margin-bottom:12px">
      <div style="font-weight:700;color:var(--red);font-size:13px;margin-bottom:4px">⚠ Necessidade de caixa</div>
      <div style="display:flex;gap:26px;flex-wrap:wrap;font-size:12px">

        <div><span style="color:var(--muted)">Necessidade mínima</span><br><b>${fR(r.necessidade)}</b> de aporte</div>
      </div></div>`;
  } else {
    alerta=`<div style="background:#eafaf0;border:1px solid #bfe6cd;border-left:4px solid var(--green);border-radius:8px;padding:11px 14px;margin-bottom:12px">
      <span style="font-weight:700;color:var(--green);font-size:13px">✓ Caixa coberto</span>
      <span style="color:var(--muted);font-size:12px;margin-left:8px">Não há necessidade adicional de caixa no período projetado (menor saldo ${fR(r.minAc)} em ${_ddmmaa(r.minData)}).</span></div>`;
  }
  // ── Gráfico de evolução (diário projetado do mês, divisor HOJE) ──
  const serie=buildRangeDias(mesRef+"-01",r.fim,r.proj);
  let cutIdx=-1; serie.dias.forEach((x,i)=>{ if(x.d<=r.corte)cutIdx=i; });
  const chartItems=serie.dias.map(x=>({lb:_ddmmaa(x.d),xl:String(x.dia),e:x.e,s:x.s,ac:x.ac}));
  const grafico=`<div class="panel"><div class="pt">Evolução do caixa <span class="pt-badge">${monthLabel(mesRef)}</span>
      <span style="float:right;font-size:10px;color:var(--muted);font-weight:400">━ realizado · ┈ projetado · divisor HOJE · passe o mouse</span></div>
    ${fcGraficoEvo(chartItems,cutIdx)}</div>`;

  const risco=`<div class="panel" style="display:flex;gap:30px;flex-wrap:wrap;align-items:center">
    <div><div class="cl">Menor saldo projetado</div><div style="font-size:19px;font-weight:700;color:${r.minAc>=0?"var(--green)":"var(--red)"}">${fR(r.minAc)}</div></div>
    <div><div class="cl">Data</div><div style="font-size:14px;font-weight:600">${_ddmmaa(r.minData)}</div></div>

  // ── Contas a receber / inadimplência ──
  const cr=inad.semCA?"":`<div class="panel"><div class="pt">Contas a receber <span class="pt-badge">Conta Azul</span></div>
    <div style="display:flex;gap:30px;flex-wrap:wrap;font-size:12px;padding:2px 0">
      <div><div class="cl">Faturamento</div><div style="font-size:16px;font-weight:700">${fRk(inad.fat)}</div></div>
      <div><div class="cl">Recebido</div><div style="font-size:16px;font-weight:700;color:var(--green)">${fRk(inad.rec)}</div></div>
      <div><div class="cl">Em aberto (total)</div><div style="font-size:16px;font-weight:700;color:var(--gold)">${fRk(inad.ab)}</div></div>
      <div><div class="cl">Vencido (inadimplência)</div><div style="font-size:16px;font-weight:700;color:${inad.venc>0?"var(--red)":"var(--green)"}">${fRk(inad.venc)}</div></div>
      <div><div class="cl">% Inadimplência</div><div style="font-size:16px;font-weight:700;color:${inad.pct>0?"var(--red)":"var(--green)"}">${fP(inad.pct)}</div></div>
      <div style="align-self:center"><a href="#" onclick="fcGoTab('inadimp');return false" style="color:var(--brand);font-weight:600;font-size:12px">Ver detalhe →</a></div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-top:6px">Recuperar dívida antiga ≠ recebimento operacional do período. "Vencido" = já venceu e não foi pago.</div></div>`;
  return {r,inad,html:cards+alerta+grafico+risco+cr};
}

// ── Realizado × Projetado (mês de referência) ──
function fcRealXProj(mesRef){
  const rr=(APP.fcData||[]).find(x=>x.mes===mesRef);
  const pp=(APP.fcDataPrevisto||[]).find(x=>x.mes===mesRef);
  if(!rr&&!pp)return "";
  const linha=(lbl,prev,real,inv)=>{
    const dif=(real!=null&&prev!=null)?real-prev:null;
    const pct=(prev)?(dif/Math.abs(prev)):null;
    const good=inv?((dif||0)<=0):((dif||0)>=0);
    return `<tr><td class="b">${lbl}</td>
      <td class="r mn" style="color:var(--muted)">${prev!=null?fR(prev):"—"}</td>
      <td class="r mn">${real!=null?fR(real):"—"}</td>
      <td class="r mn" style="color:${dif==null?"var(--muted)":good?"var(--green)":"var(--red)"}">${dif!=null?(dif>0?"+":"")+fR(dif):"—"}</td>
      <td class="r" style="color:${pct==null?"var(--muted)":good?"var(--green)":"var(--red)"}">${pct!=null?(pct>0?"+":"")+(pct*100).toFixed(1)+"%":"—"}</td></tr>`;
  };
  return `<div class="panel"><div class="pt">Realizado × Projetado <span class="pt-badge">${monthLabel(mesRef)}</span></div>
  <div class="tw"><table style="width:100%"><thead><tr><th></th><th class="r">Previsto</th><th class="r">Realizado</th><th class="r">Variação</th><th class="r">%</th></tr></thead>
  <tbody>${linha("Entradas",pp?pp.e:null,rr?rr.e:null,false)}${linha("Saídas",pp?pp.s:null,rr?rr.s:null,true)}${linha("Saldo acumulado",pp?pp.ac:null,rr?rr.ac:null,false)}</tbody></table></div></div>`;
}

// ── Fluxo DIÁRIO — próximos dias (horizonte 7/15/30 a partir de hoje) ──
function fcProximosDias(){
  const hoje=new Date().toISOString().slice(0,10);
  const proj=fcDiarioFonteProj(), corte=(proj.corte&&proj.corte<=hoje)?proj.corte:hoje;
  const fim=(()=>{const d=new Date(hoje+"T12:00:00");d.setDate(d.getDate()+FC_HORIZON);return d.toISOString().slice(0,10);})();
  // inicia alguns dias antes de hoje para dar contexto do realizado recente
  const ini=(()=>{const d=new Date(hoje+"T12:00:00");d.setDate(d.getDate()-3);return d.toISOString().slice(0,10);})();
  const serie=buildRangeDias(ini,fim,proj);
  const dn=["dom","seg","ter","qua","qui","sex","sáb"];
  const sel=[7,15,30].map(n=>`<button class="dre-tb${FC_HORIZON===n?" a":""}" onclick="setFCHorizon(${n})">${n} dias</button>`).join("");
  const linhas=serie.dias.map(x=>{
    const real=x.d<=corte, isHoje=x.d===hoje, exp=!!FC_DAY_EXP[x.d], temIt=x.itens&&x.itens.length;
    const st=real?'<span style="color:var(--green)">● realizado</span>':'<span style="color:var(--brand)">○ previsto</span>';
    const main=`<tr ${temIt?`onclick="fcDayToggle('${x.d}')" style="cursor:pointer;`:'style="'}${isHoje?"background:rgba(196,98,45,.10);font-weight:600;":""}${!temIt?"opacity:.5;":""}">
      <td>${temIt?`<span style="font-size:9px;opacity:.5">${exp?"▼":"▶"}</span> `:""}${x.dia}/${x.d.slice(5,7)} <span style="font-size:9px;color:var(--muted)">${dn[x.dow]}</span>${isHoje?' <span style="font-size:9px;color:var(--brand)">hoje</span>':""}</td>
      <td class="r mn" style="color:var(--green);font-size:11px">${x.e?fRk(x.e):"—"}</td>
      <td class="r mn" style="color:var(--gold);font-size:11px">${x.s?fRk(x.s):"—"}</td>
      <td class="r mn" style="font-size:11px;color:${x.sm>=0?"var(--green)":"var(--red)"}">${x.sm?fRk(x.sm):"—"}</td>
      <td class="r mn b" style="font-size:11px;color:${x.ac>=0?"var(--blue)":"var(--red)"}">${fRk(x.ac)}</td>

    if(!exp||!temIt)return main;
    const det=x.itens.map(it=>`<tr style="background:var(--hover);font-size:10px">

    return main+det;
  }).join("");
  return `<div class="panel"><div class="pt">Fluxo de caixa — próximos dias
      <span style="float:right">${sel}</span></div>
  <div class="tw"><table style="width:100%">
  <thead><tr><th>Data</th><th class="r">Entradas</th><th class="r">Saídas</th><th class="r">Saldo do dia</th><th class="r">Saldo acumulado</th><th class="r">Origem</th></tr></thead>
  <tbody>${linhas}</tbody></table></div>
  <div style="font-size:10px;color:var(--muted);padding-top:6px">● realizado (movimento efetivo) · ○ previsto (contas em aberto por vencimento) · clique no dia para ver os lançamentos</div></div>`;
}

// ── Dispatcher ──
// ══════════════════════════════════════════════════════════════════════════
//  CONTROLADORIA — Realizado × Previsto (camada de apresentação)
//  Deriva TUDO das funções-fonte (fcDiarioFonteReal/Prev/Proj, buildRangeDias,
//  APP.fcData, APP.fcDataPrevisto). Nenhuma fórmula financeira nova.
//  Conceitos (mantidos separados): PREVISTO = plano por vencimento ·
//  REALIZADO = o que ocorreu · "sem realizado" ≠ R$ 0.
// ══════════════════════════════════════════════════════════════════════════
let FC_TAB = "caixa";        // "caixa" | "controladoria"

// Motor de comparação DIÁRIA no intervalo [ini,fim]
function fcDailyCompare(ini,fim){
  const hoje=new Date().toISOString().slice(0,10);
  const real=fcDiarioFonteReal(), prev=fcDiarioFontePrev(), proj=fcDiarioFonteProj();
  const corte=(proj.corte&&proj.corte<=hoje)?proj.corte:hoje;
  const dR=buildRangeDias(ini,fim,real);
  const dP=buildRangeDias(ini,fim,prev);
  const dias=dR.dias.map((r,i)=>{
    const p=dP.dias[i], temReal=r.d<=corte;
    return {d:r.d,dia:r.dia,dow:r.dow,
      ePrev:p.e, sPrev:p.s, acPrev:p.ac,
      eReal:temReal?r.e:null, sReal:temReal?r.s:null, acReal:temReal?r.ac:null,
      temReal};
  });
  return {dias,corte,ini,fim};
}

// Motor de comparação MENSAL (usa APP.fcData × APP.fcDataPrevisto — inalterados)
function fcMonthlyCompare(meses){
  const R=APP.fcData||[], P=APP.fcDataPrevisto||[];
  return meses.map(m=>{
    const r=R.find(x=>x.mes===m), p=P.find(x=>x.mes===m);
    return {mes:m, m:monthLabel(m),
      ePrev:p?p.e:null, eReal:r?r.e:null,
      sPrev:p?p.s:null, sReal:r?r.s:null,
      resPrev:p?(p.e-p.s):null, resReal:r?(r.e-r.s):null,
      acPrev:p?p.ac:null, acReal:r?r.ac:null};
  });
}

// Desvio com natureza (entradas: menos=ruim; saídas: menos=bom; resultado/saldo: mais=bom)
function fcDesvio(real,prev,natureza){
  if(real==null||prev==null)return {dif:null,pct:null,good:null};
  const dif=real-prev, pct=prev!==0?dif/Math.abs(prev):null;
  let good; if(natureza==="saida")good=dif<=0; else good=dif>=0; // entrada/resultado/saldo
  return {dif,pct,good};
}

// ── Gráfico de DUAS LINHAS: saldo realizado × saldo previsto, divisor HOJE ──
let FC_TIPC=[];
function fcGraficoComp(items,cutIndex){
  if(!items||!items.length)return '<div class="no-data">Sem dados no período.</div>';
  FC_TIPC=items.slice();
  const W=1000,H=300,padL=64,padR=16,padT=22,padB=30;
  const n=items.length,iw=W-padL-padR,ih=H-padT-padB,step=iw/n;
  const vals=[]; items.forEach(x=>{if(x.acPrev!=null)vals.push(x.acPrev);if(x.acReal!=null)vals.push(x.acReal);});
  vals.push(0);
  let mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  if(mx===mn){mx+=1;mn-=1;} const folga=(mx-mn)*0.12; mx+=folga; mn-=folga;
  const y=v=>padT+ih-((v-mn)/(mx-mn))*ih, x=i=>padL+step*(i+0.5);
  const kf=v=>{const a=Math.abs(v);return a>=1000?Math.round(v/1000)+"k":String(Math.round(v));};
  let grid="";
  for(let i=0;i<=5;i++){const t=mn+(mx-mn)*i/5,yy=y(t);
    grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`+
          `<text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kf(t)}</text>`;}
  grid+=`<line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1.1"/>`;
  // linha PREVISTO (laranja tracejada) — todo o período
  const ptsP=items.map((d,i)=>x(i).toFixed(1)+","+y(d.acPrev||0).toFixed(1)).join(" ");
  const lineP=`<polyline points="${ptsP}" fill="none" stroke="#C4622D" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  // linha REALIZADO (azul sólida) — só onde há realizado
  const ptsR=items.filter(d=>d.acReal!=null).map(d=>{const i=items.indexOf(d);return x(i).toFixed(1)+","+y(d.acReal).toFixed(1);}).join(" ");
  const lineR=ptsR?`<polyline points="${ptsR}" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round"/>`:"";
  let dots=""; items.forEach((d,i)=>{ if(d.acReal!=null)dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(d.acReal).toFixed(1)}" r="2.4" fill="#2563eb"/>`; });
  // divisor HOJE
  let hoje="";
  if(cutIndex!=null&&cutIndex>=0&&cutIndex<n){
    const hx=(padL+step*(cutIndex+1)).toFixed(1);
    hoje=`<line x1="${hx}" y1="${padT-4}" x2="${hx}" y2="${padT+ih}" stroke="var(--brand)" stroke-width="1.3" stroke-dasharray="4 3"/>`+
         `<text x="${hx}" y="${padT-8}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--brand)">HOJE</text>`;
  }
  let xl=""; items.forEach((d,i)=>{ if(n<=16||i%Math.ceil(n/16)===0) xl+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${d.xl||d.lb}</text>`;});
  let hov=""; items.forEach((d,i)=>{hov+=`<rect x="${(padL+step*i).toFixed(1)}" y="${padT}" width="${step.toFixed(1)}" height="${ih}" fill="transparent" style="cursor:crosshair" onmousemove="fcTipC(event,${i})" onmouseleave="fcTipCOff()"/>`;});
  const legend=`<div style="display:flex;gap:16px;font-size:10px;color:var(--muted);padding:2px 0 6px 64px">
    <span><span style="display:inline-block;width:14px;height:2px;background:#2563eb;vertical-align:middle"></span> Realizado</span>
    <span><span style="display:inline-block;width:14px;border-top:2px dashed #C4622D;vertical-align:middle"></span> Previsto</span></div>`;
  return `<div class="fcg-wrap" style="position:relative;width:100%">${legend}
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">${grid}${lineP}${lineR}${dots}${hoje}${xl}${hov}</svg>
    <div id="fcgc-tip" style="display:none;position:absolute;pointer-events:none;background:#2f3b4d;color:#fff;border-radius:9px;padding:9px 13px;font-size:11px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.24);z-index:20;white-space:nowrap"></div>
  </div>`;
}
window.fcTipC=function(ev,i){
  const d=FC_TIPC[i]; const tip=document.getElementById("fcgc-tip"); if(!d||!tip)return;
  const wrap=tip.parentNode; if(!wrap)return;
  const dv=d.acReal!=null?d.acReal-(d.acPrev||0):null;
  tip.innerHTML=`<div style="font-weight:700;margin-bottom:3px">${d.lb}</div>`+
    `<div>Saldo previsto: <b>${fR(d.acPrev)}</b></div>`+
    `<div>Saldo realizado: <b>${d.acReal!=null?fR(d.acReal):'<span style="opacity:.7">sem realizado</span>'}</b></div>`+
    (dv!=null?`<div>Desvio: <b style="color:${dv>=0?'#7ee2a8':'#f6a5a0'}">${(dv>0?'+':'')+fR(dv)}</b></div>`:"")+
    `<div style="margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.3);font-size:10px;opacity:.9">`+
    `Entradas P/R: ${fR(d.ePrev)} / ${d.eReal!=null?fR(d.eReal):"—"}<br>`+
    `Saídas P/R: ${fR(d.sPrev)} / ${d.sReal!=null?fR(d.sReal):"—"}</div>`;
  tip.style.display="block";
  const r=wrap.getBoundingClientRect(),tw=tip.offsetWidth||200,th=tip.offsetHeight||110;
  let left=ev.clientX-r.left+16,top=ev.clientY-r.top-th/2;
  if(left+tw>r.width)left=ev.clientX-r.left-tw-16; if(left<0)left=0;
  if(top<0)top=0; if(top+th>r.height)top=Math.max(0,r.height-th);
  tip.style.left=left+"px";tip.style.top=top+"px";
};
window.fcTipCOff=function(){const t=document.getElementById("fcgc-tip");if(t)t.style.display="none";};

// ── Gráfico de BARRAS AGRUPADAS: previsto × realizado por categoria ──
function fcBarrasComp(cats){
  // cats: [{lb, prev, real}]
  if(!cats.length)return '<div class="no-data">Sem dados.</div>';
  const W=1000,H=240,padL=64,padR=16,padT=16,padB=34;
  const n=cats.length,iw=W-padL-padR,ih=H-padT-padB,group=iw/n,bw=Math.min(30,group*0.32);
  const vals=[0]; cats.forEach(c=>{vals.push(c.prev||0,c.real||0);});
  let mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals); if(mx===mn)mx+=1; if(mn>0)mn=0;
  const folga=(mx-mn)*0.1; mx+=folga;
  const y=v=>padT+ih-((v-mn)/(mx-mn))*ih, cx=i=>padL+group*(i+0.5);
  const kf=v=>{const a=Math.abs(v);return a>=1000?Math.round(v/1000)+"k":String(Math.round(v));};
  const y0=y(0); let grid="";
  for(let i=0;i<=4;i++){const t=mn+(mx-mn)*i/4,yy=y(t);grid+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kf(t)}</text>`;}
  let bars="",xl="";
  cats.forEach((c,i)=>{
    const xp=cx(i)-bw-2, xr=cx(i)+2;
    const yp=y(c.prev||0), yr=y(c.real||0);
    bars+=`<rect x="${xp.toFixed(1)}" y="${Math.min(yp,y0).toFixed(1)}" width="${bw}" height="${Math.max(1,Math.abs(yp-y0)).toFixed(1)}" rx="2" fill="#C4622D" opacity="0.55"/>`;
    bars+=`<rect x="${xr.toFixed(1)}" y="${Math.min(yr,y0).toFixed(1)}" width="${bw}" height="${Math.max(1,Math.abs(yr-y0)).toFixed(1)}" rx="2" fill="#2563eb" opacity="0.85"/>`;
    xl+=`<text x="${cx(i).toFixed(1)}" y="${H-16}" text-anchor="middle" font-size="10" fill="var(--text)">${c.lb}</text>`;
  });
  const legend=`<div style="display:flex;gap:16px;font-size:10px;color:var(--muted);padding:0 0 4px 64px">
    <span><span style="display:inline-block;width:11px;height:11px;background:#C4622D;opacity:.55;border-radius:2px;vertical-align:middle"></span> Previsto</span>
    <span><span style="display:inline-block;width:11px;height:11px;background:#2563eb;border-radius:2px;vertical-align:middle"></span> Realizado</span></div>`;
  return `${legend}<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" xmlns="http://www.w3.org/2000/svg">${grid}<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="var(--muted)"/>${bars}${xl}</svg>`;
}

// ── Leitura gerencial: insights calculados dos dados ──
function fcLeituraGerencial(cmp){
  const dias=cmp.dias.filter(d=>d.temReal);
  if(!dias.length)return "";
  const totEP=cmp.dias.reduce((a,d)=>a+d.ePrev,0), totER=dias.reduce((a,d)=>a+d.eReal,0);
  const totSP=cmp.dias.reduce((a,d)=>a+d.sPrev,0), totSR=dias.reduce((a,d)=>a+d.sReal,0);
  const ult=dias[dias.length-1];
  const desvioSaldo=ult.acReal-ult.acPrev;
  const ins=[];
  const seta=v=>v>=0?"▲":"▼";
  if(Math.abs(desvioSaldo)>=1){
    ins.push(`O saldo realizado está <b style="color:${desvioSaldo>=0?"var(--green)":"var(--red)"}">${fR(Math.abs(desvioSaldo))} ${desvioSaldo>=0?"acima":"abaixo"}</b> da projeção.`);
  } else ins.push(`O saldo realizado está <b>em linha</b> com a projeção.`);
  // entradas (só compara dias com realizado)
  const epR=dias.reduce((a,d)=>a+d.ePrev,0);
  if(epR>0){const pe=(totER-epR)/epR; ins.push(`As entradas realizadas estão <b style="color:${pe>=0?"var(--green)":"var(--red)"}">${Math.abs(pe*100).toFixed(0)}% ${pe>=0?"acima":"abaixo"}</b> do previsto no período com realização.`);}
  const spR=dias.reduce((a,d)=>a+d.sPrev,0);
  if(spR>0){const ps=(totSR-spR)/spR; ins.push(`As saídas realizadas estão <b style="color:${ps<=0?"var(--green)":"var(--red)"}">${Math.abs(ps*100).toFixed(0)}% ${ps<=0?"abaixo":"acima"}</b> do previsto.`);}
  // maior desvio de saldo
  let pior=null,piorV=0; dias.forEach(d=>{const dv=Math.abs(d.acReal-d.acPrev); if(dv>piorV){piorV=dv;pior=d;}});
  if(pior&&piorV>=1)ins.push(`O principal desvio de saldo ocorreu em <b>${pior.d.slice(8)}/${pior.d.slice(5,7)}</b> (${fR(pior.acReal-pior.acPrev)}).`);
  return `<div class="panel"><div class="pt">Leitura gerencial</div>
    <ul style="margin:4px 0 0;padding-left:18px;font-size:12.5px;line-height:1.9">${ins.map(t=>`<li>${t}</li>`).join("")}</ul></div>`;
}

// Cards comparativos (previsto × realizado) com natureza de desvio
function fcCardComp(titulo,prev,real,natureza){
  const dv=fcDesvio(real,prev,natureza);
  const cor=dv.good==null?"var(--muted)":dv.good?"var(--green)":"var(--red)";
  return `<div class="card" style="border-top-color:${cor};flex:1 1 160px;min-width:150px">
    <div class="cl">${titulo}</div>
    <div style="display:flex;gap:10px;align-items:baseline"><div><div style="font-size:9px;color:var(--muted)">Prev.</div><div class="mn" style="font-size:14px">${fRk(prev)}</div></div>
    <div><div style="font-size:9px;color:var(--muted)">Real.</div><div class="mn" style="font-size:16px;font-weight:700">${real!=null?fRk(real):'<span style="color:var(--muted)">—</span>'}</div></div></div>
    <div class="cs" style="color:${cor};font-weight:600">${dv.dif!=null?(dv.dif>0?"+":"")+fR(dv.dif)+(dv.pct!=null?" ("+(dv.pct>0?"+":"")+(dv.pct*100).toFixed(0)+"%)":""):"sem realizado"}</div></div>`;
}

// ── CONTROLADORIA — MENSAL ──
function fcRenderCtrlMensal(){
  let meses=(APP.mesesVisiveis||[]).slice();
  if(CUR_MES!=="TOTAL"&&!dtFrom&&!dtTo)meses=meses.filter(m=>m===CUR_MES);
  else if(dtFrom||dtTo)meses=meses.filter(m=>(!dtFrom||m>=dtFrom)&&(!dtTo||m<=dtTo));
  if(!meses.length)meses=(APP.mesesVisiveis||[]).slice();
  const cmp=fcMonthlyCompare(meses);
  const som=(k)=>cmp.reduce((a,c)=>a+(c[k]||0),0);
  const somR=(k)=>cmp.reduce((a,c)=>a+(c[k]!=null?c[k]:0),0);
  const cards=`<div class="cards" style="align-items:stretch">
    ${fcCardComp("Entradas",som("ePrev"),somR("eReal"),"entrada")}
    ${fcCardComp("Saídas",som("sPrev"),somR("sReal"),"saida")}
    ${fcCardComp("Resultado",som("resPrev"),somR("resReal"),"resultado")}
  </div>`;
  const chartE=fcBarrasComp(cmp.map(c=>({lb:c.m.replace("/26",""),prev:c.ePrev,real:c.eReal})));
  const chartS=fcBarrasComp(cmp.map(c=>({lb:c.m.replace("/26",""),prev:c.sPrev,real:c.sReal})));
  const chartR=fcBarrasComp(cmp.map(c=>({lb:c.m.replace("/26",""),prev:c.resPrev,real:c.resReal})));
  const graf=`<div class="panel"><div class="pt">Entradas — previsto × realizado</div>${chartE}</div>
    <div class="panel"><div class="pt">Saídas — previsto × realizado</div>${chartS}</div>
    <div class="panel"><div class="pt">Resultado — previsto × realizado</div>${chartR}</div>`;
  const cel=(real,prev,nat)=>{const d=fcDesvio(real,prev,nat);const c=d.good==null?"var(--muted)":d.good?"var(--green)":"var(--red)";
    return `<td class="r mn" style="color:var(--muted)">${prev!=null?fRk(prev):"—"}</td><td class="r mn">${real!=null?fRk(real):'<span style="color:var(--muted)">sem real.</span>'}</td><td class="r mn" style="color:${c}">${d.dif!=null?(d.dif>0?"+":"")+fRk(d.dif):"—"}</td>`;};
  const rows=cmp.map(c=>`<tr><td class="b">${c.m}</td>${cel(c.eReal,c.ePrev,"entrada")}${cel(c.sReal,c.sPrev,"saida")}${cel(c.resReal,c.resPrev,"resultado")}${cel(c.acReal,c.acPrev,"saldo")}</tr>`).join("");
  const tabela=`<div class="panel"><div class="pt">Comparativo mensal — previsto × realizado</div>
    <div class="tw"><table style="width:100%;min-width:900px"><thead>
    <tr><th rowspan="2">Mês</th><th colspan="3" class="r" style="background:rgba(34,197,94,.08)">Entradas</th><th colspan="3" class="r" style="background:rgba(220,38,38,.06)">Saídas</th><th colspan="3" class="r" style="background:rgba(37,99,235,.06)">Resultado</th><th colspan="3" class="r" style="background:rgba(196,98,45,.06)">Saldo acumulado</th></tr>
    <tr>${"<th class='r' style='font-size:9px'>Prev</th><th class='r' style='font-size:9px'>Real</th><th class='r' style='font-size:9px'>Desvio</th>".repeat(4)}</tr>
    </thead><tbody>${rows}</tbody></table></div>
    <div style="font-size:10px;color:var(--muted);padding-top:6px">Verde = favorável · vermelho = desfavorável (entradas: menos é ruim; saídas: menos é bom).</div></div>`;
  return cards+graf+tabela;
}

// ── CONTROLADORIA — DIÁRIO ──

  const dn=["dom","seg","ter","qua","qui","sex","sáb"];
  const trs=cmp.dias.filter(d=>d.ePrev||d.sPrev||d.temReal).map(d=>`<tr style="${!d.temReal?"opacity:.7":""}">
    <td>${d.dia}/${d.d.slice(5,7)} <span style="font-size:9px;color:var(--muted)">${dn[d.dow]}</span> ${d.temReal?'<span style="color:var(--green);font-size:9px">●</span>':'<span style="color:var(--brand);font-size:9px">○</span>'}</td>
    ${dcell(d.eReal,d.ePrev,"entrada")}${dcell(d.sReal,d.sPrev,"saida")}${dcell(d.acReal,d.acPrev,"saldo")}</tr>`).join("");
  const tabela=`<div class="panel"><div class="pt">Comparativo diário — previsto × realizado</div>
    <div class="tw"><table style="width:100%;min-width:820px"><thead>
    <tr><th rowspan="2">Data</th><th colspan="3" class="r" style="background:rgba(34,197,94,.08)">Entradas</th><th colspan="3" class="r" style="background:rgba(220,38,38,.06)">Saídas</th><th colspan="3" class="r" style="background:rgba(37,99,235,.06)">Saldo</th></tr>
    <tr>${"<th class='r' style='font-size:9px'>Prev</th><th class='r' style='font-size:9px'>Real</th><th class='r' style='font-size:9px'>Desvio</th>".repeat(3)}</tr>
    </thead><tbody>${trs}</tbody></table></div>
    <div style="font-size:10px;color:var(--muted);padding-top:6px">● dia com realizado · ○ só previsto (ainda não ocorreu) · "—" em realizado = sem realizado (não é R$ 0).</div></div>`;
  return cards+grafSaldo+grafMov+leitura+tabela;
}

// ── CAIXA (tesouraria) — cenários Realizado+Projetado / Só realizado / Só previsto ──
function fcRenderCaixa(mode,mesRef){
  if(mode==="realizado"){
    const real=fcDiarioFonteReal(), proj=fcDiarioFonteProj();
    const hoje=new Date().toISOString().slice(0,10);
    const corte=(proj.corte&&proj.corte<=hoje)?proj.corte:hoje;
    const dR=buildDiario(mesRef,real);
    const diasReais=dR.dias.filter(x=>x.d<=corte);
    const eR=diasReais.reduce((a,x)=>a+x.e,0), sR=diasReais.reduce((a,x)=>a+x.s,0);
    const saldoReal=diasReais.length?diasReais[diasReais.length-1].ac:dR.abertura;
    const cards=`<div class="cards" style="align-items:stretch">
      <div class="card" style="border-top-color:var(--blue);flex:1.5 1 190px;min-width:150px"><div class="cl">Saldo realizado</div><div class="cv" style="font-size:26px;color:var(--blue)">${fRk(saldoReal)}</div><div class="cs">Até ${_ddmm(corte)}</div></div>
      <div class="card" style="border-top-color:var(--green);flex:1 1 150px"><div class="cl">Entradas realizadas</div><div class="cv" style="color:var(--green)">${fRk(eR)}</div><div class="cs">${monthLabel(mesRef)}</div></div>
      <div class="card" style="border-top-color:var(--gold);flex:1 1 150px"><div class="cl">Saídas realizadas</div><div class="cv" style="color:var(--gold)">${fRk(sR)}</div><div class="cs">${monthLabel(mesRef)}</div></div>
      <div class="card" style="border-top-color:${eR-sR>=0?"var(--green)":"var(--red)"};flex:1 1 150px"><div class="cl">Resultado realizado</div><div class="cv" style="color:${eR-sR>=0?"var(--green)":"var(--red)"}">${fRk(eR-sR)}</div><div class="cs">Entradas − saídas</div></div>
    </div>`;
    const graf=`<div class="panel"><div class="pt">Evolução do caixa — realizado <span class="pt-badge">${monthLabel(mesRef)}</span></div>
      ${fcGraficoEvo(diasReais.map(x=>({lb:_ddmmaa(x.d),xl:String(x.dia),e:x.e,s:x.s,ac:x.ac})),diasReais.length-1)}</div>`;
    const rows=(APP.fcData||[]).filter(r=>!r.projecao&&(CUR_MES==="TOTAL"||r.mes===CUR_MES));
    return cards+graf+fcTabelaMensal(rows.length?rows:(APP.fcData||[]).filter(r=>!r.projecao));
  }
  if(mode==="previsto"){
    const r=fcResumo(mesRef);
    const cards=`<div class="cards" style="align-items:stretch">
      <div class="card" style="border-top-color:var(--muted);flex:1 1 150px"><div class="cl">Saldo de partida</div><div class="cv">${fRk(r.saldoDisp)}</div><div class="cs">Real em ${_ddmm(r.corte)}</div></div>
      <div class="card" style="border-top-color:var(--green);flex:1 1 150px"><div class="cl">Entradas previstas</div><div class="cv" style="color:var(--green)">${fRk(r.entPrev)}</div><div class="cs">até ${_ddmm(r.fim)}</div></div>
      <div class="card" style="border-top-color:var(--gold);flex:1 1 150px"><div class="cl">Saídas previstas</div><div class="cv" style="color:var(--gold)">${fRk(r.saiPrev)}</div><div class="cs">até ${_ddmm(r.fim)}</div></div>
      <div class="card" style="border-top-color:${r.saldoProj>=0?"var(--green)":"var(--red)"};flex:1.4 1 180px;min-width:150px"><div class="cl">Saldo projetado</div><div class="cv" style="font-size:24px;color:${r.saldoProj>=0?"var(--green)":"var(--red)"}">${fRk(r.saldoProj)}</div><div class="cs">até ${_ddmm(r.fim)}</div></div>
      <div class="card" style="border-top-color:${r.necessidade>0?"var(--red)":"var(--green)"};flex:1 1 150px"><div class="cl">Risco de caixa</div><div class="cv" style="font-size:16px;color:${r.necessidade>0?"var(--red)":"var(--green)"}">${r.necessidade>0?"⚠ "+fRk(r.necessidade):"✓ sem risco"}</div><div class="cs">menor saldo ${fR(r.minAc)} · ${_ddmm(r.minData)}</div></div>
    </div>`;
    const serie=buildRangeDias(mesRef+"-01",r.fim,r.proj);
    let cutIdx=-1; serie.dias.forEach((x,i)=>{if(x.d<=r.corte)cutIdx=i;});
    const graf=`<div class="panel"><div class="pt">Projeção do caixa <span class="pt-badge">${monthLabel(mesRef)}</span></div>
      ${fcGraficoEvo(serie.dias.map(x=>({lb:_ddmmaa(x.d),xl:String(x.dia),e:x.e,s:x.s,ac:x.ac})),cutIdx)}</div>`;
    return cards+graf+fcProximosDias();
  }
  // Realizado + Projetado (visão completa de tesouraria)
  const head=fcHeaderComando(mesRef);
  const rows=(APP.fcData||[]).filter(r=>CUR_MES==="TOTAL"||r.mes===CUR_MES);
  return head.html+fcTabelaMensal(rows.length?rows:(APP.fcData||[]))+fcProximosDias();
}
