<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Stylo de Minas — Seu consultor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>
  :root{
    --ink:#11151b; --surface:#1a2028; --surface-2:#212934;
    --border:rgba(234,229,218,.09); --border-strong:rgba(234,229,218,.16);
    --cream:#ece6d9; --muted:#93989f;
    --brass:#c99b4a; --brass-soft:rgba(201,155,74,.14);
    --burgundy:#b1543b; --burgundy-soft:rgba(177,84,59,.14);
    --sage:#6e9270; --sage-soft:rgba(110,146,112,.14);
    --amber:#d3a441; --amber-soft:rgba(211,164,65,.14);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.015em;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  ::selection{background:var(--brass-soft);color:var(--cream);}

  header.top{padding:34px 28px 0;}
  .top-row{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:11px;}
  .top-row .mark{width:28px;height:28px;border:1px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--brass);font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;flex-shrink:0;}
  .top-row h1{font-size:13px;margin:0;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.03em;color:var(--muted);}

  main{max-width:720px;margin:0 auto;padding:30px 28px 40px;}
  .carta p{font-family:'Fraunces',serif;font-size:16.5px;line-height:1.78;color:var(--cream);margin:0 0 15px;font-weight:400;}
  .carta p:last-child{margin-bottom:0;}
  .carta p b{font-weight:600;}
  .carta em{font-style:normal;color:var(--brass);}

  /* ---- abertura ---- */
  .abertura{margin-bottom:40px;}
  .data{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;}
  .abertura h2{font-size:27px;line-height:1.32;margin:0 0 18px;max-width:20ch;}
  .abertura h2 em{font-style:normal;color:var(--brass);}

  /* plano do dia */
  .plano{margin:0 0 42px;}
  .plano h3{font-size:19px;margin:0 0 5px;}
  .plano .intro{font-family:'Fraunces',serif;font-size:16px;line-height:1.7;color:var(--muted);margin:0 0 24px;}
  .passo{display:flex;gap:18px;padding:20px 0;border-top:1px solid var(--border);}
  .passo:last-child{border-bottom:1px solid var(--border);}
  .passo .n{font-family:'Fraunces',serif;font-size:26px;line-height:1;color:var(--brass);flex-shrink:0;width:26px;padding-top:2px;}
  .passo .txt{flex:1;min-width:0;}
  .passo .txt p{font-family:'Fraunces',serif;font-size:17px;line-height:1.55;margin:0 0 10px;color:var(--cream);}
  .passo .meta{display:flex;gap:22px;flex-wrap:wrap;}
  .passo .meta span{font-size:12.5px;color:var(--muted);}
  .passo .meta b{color:var(--brass);font-weight:600;font-variant-numeric:tabular-nums;}
  .passo .meta .t b{color:var(--cream);}

  /* fecho */
  .fecho{margin:46px 0 0;padding:34px 0 0;border-top:1px solid var(--border-strong);}
  .fecho h3{font-size:21px;margin:0 0 18px;}
  .assina{font-size:12.5px;color:var(--muted);margin:26px 0 0;line-height:1.7;}
  .assina a{color:var(--brass);text-decoration:none;border-bottom:1px solid rgba(201,155,74,.35);}
  .assina a:hover{color:var(--cream);}

  /* ---- destaque ---- */
  .faixa{display:flex;align-items:center;gap:11px;margin:0 0 12px;}
  .faixa .txt{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;}
  .faixa .rule{height:1px;background:var(--border);flex:1;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .card.hero{border-color:var(--border-strong);box-shadow:0 0 0 1px rgba(201,155,74,.10), 0 18px 40px -28px rgba(0,0,0,.9);}
  .card-topo{padding:24px 26px 0;}
  /* filho direto: sem isso a regra pega também o topo de dentro do corpo,
     e todos os cards fechados abriam juntos no clique */
  .card.compacta > .card-topo{padding:18px 22px;cursor:pointer;display:flex;align-items:center;gap:16px;}
  .card.compacta > .card-topo:hover{background:rgba(234,229,218,.02);}

  .selo{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:99px;margin-bottom:14px;}
  .selo .d{width:5px;height:5px;border-radius:50%;}
  .s-urgente{background:var(--burgundy-soft);color:var(--burgundy);} .s-urgente .d{background:var(--burgundy);}
  .s-semana{background:var(--amber-soft);color:var(--amber);} .s-semana .d{background:var(--amber);}
  .s-decisao{background:var(--sage-soft);color:var(--sage);} .s-decisao .d{background:var(--sage);}

  .dinheiro-rot{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px;}
  .dinheiro{font-family:'Fraunces',serif;font-size:44px;line-height:1;color:var(--brass);margin:0 0 18px;}
  .card.compacta .dinheiro{font-size:25px;margin:0;}
  .card.compacta .dinheiro-rot{font-size:9.5px;margin:0 0 3px;}
  .card h3{font-size:21px;line-height:1.35;margin:0 0 14px;max-width:26ch;}
  .card.compacta h3{font-size:16px;margin:0 0 3px;max-width:none;}
  .card.compacta .sub{font-size:12.5px;color:var(--muted);margin:0;}
  .compacta-main{flex:1;min-width:0;}
  .compacta-dir{text-align:right;flex-shrink:0;}
  .chev{color:var(--muted);font-size:19px;line-height:1;transition:transform .2s;flex-shrink:0;}
  .card.aberta .chev{transform:rotate(180deg);}

  .bloco{margin-bottom:16px;}
  .bloco .rot{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px;}
  .bloco p{margin:0;font-size:14.5px;line-height:1.7;color:var(--cream);}
  .bloco p.dim{color:var(--muted);}
  .bloco p b{font-weight:600;color:var(--cream);}
  .reco{background:var(--surface-2);border-left:2px solid var(--brass);border-radius:0 8px 8px 0;padding:15px 18px;margin:20px 0 0;}
  .reco .rot{color:var(--brass);}
  .reco p{font-size:14.5px;line-height:1.65;}

  .card-acoes{padding:20px 26px 22px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .btn{border:none;border-radius:9px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:filter .15s;}
  .btn:hover{filter:brightness(1.1);}
  .btn-primary{background:var(--brass);color:#1a1305;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border-strong);font-weight:600;font-size:13px;padding:11px 15px;}
  .btn-ghost:hover{color:var(--cream);}
  .btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .toast{font-size:12.5px;color:var(--sage);opacity:0;transition:opacity .2s;}
  .toast.on{opacity:1;}

  /* execução */
  .exec{border-top:1px solid var(--border);padding:20px 26px 22px;display:none;}
  .exec.on{display:block;}
  .exec h4{font-size:12.5px;margin:0 0 12px;font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .msg{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:16px 18px;font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--cream);}
  .msg + .msg{margin-top:10px;}
  .msg-rot{font-size:12px;color:var(--muted);margin:14px 0 6px;line-height:1.5;}
  .passos{counter-reset:p;margin:0;padding:0;list-style:none;}
  .passos li{counter-increment:p;position:relative;padding:0 0 12px 30px;font-size:14px;line-height:1.65;color:var(--cream);}
  .passos li::before{content:counter(p);position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--brass-soft);color:var(--brass);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;}
  .passos li:last-child{padding-bottom:0;}

  /* detalhes */
  details{border-top:1px solid var(--border);}
  details summary{cursor:pointer;list-style:none;padding:14px 26px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:"+";font-family:'JetBrains Mono',monospace;color:var(--brass);font-size:14px;}
  details[open] summary::before{content:"−";}
  details summary:hover{color:var(--cream);}
  .det-corpo{padding:0 26px 22px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:8px 10px 8px 0;border-bottom:1px solid var(--border);}
  tbody tr:last-child td{border-bottom:none;}
  .r{text-align:right;}
  .fone{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .flag{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap;}
  .f-bad{background:var(--burgundy-soft);color:var(--burgundy);}
  .f-ok{background:var(--sage-soft);color:var(--sage);}
  .f-mid{background:var(--amber-soft);color:var(--amber);}
  .scroll{overflow-x:auto;}
  .calc{display:grid;gap:10px;font-size:12.5px;line-height:1.6;margin-top:4px;}
  .calc div{display:grid;grid-template-columns:96px 1fr;gap:14px;}
  .calc dt{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px;}
  .calc dd{margin:0;color:var(--cream);}
  .calc .ress{color:var(--amber);}
  .cap{text-transform:capitalize;}

  /* cruzamento */
  .cruza{background:var(--brass-soft);border:1px solid rgba(201,155,74,.25);border-radius:var(--radius);padding:18px 22px;margin:26px 0 12px;}
  .cruza .rot{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:0 0 7px;}
  .cruza p{margin:0;font-size:14.5px;line-height:1.7;color:var(--cream);}
  .cruza p b{font-weight:600;}

  .estado{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px 26px;text-align:center;}
  .estado h3{margin:0 0 8px;font-size:17px;}
  .estado p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6;}
  .estado.erro{border-color:var(--burgundy);} .estado.erro h3{color:var(--burgundy);}
  .pulse{width:24px;height:24px;border:2px solid var(--border-strong);border-top-color:var(--brass);border-radius:50%;margin:0 auto 16px;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hidden{display:none;}
  .foot{max-width:820px;margin:0 auto;padding:0 28px 70px;color:var(--muted);font-size:12px;line-height:1.7;}
  .foot b{color:var(--muted);font-weight:600;}
  @media (max-width:700px){
    main{padding:24px 18px 30px;} header.top{padding:24px 18px 0;} .foot{padding:0 18px 60px;}
    .carta p{font-size:15.5px;} .passo .txt p{font-size:16px;} .plano .intro{font-size:15px;}
    .abertura h2{font-size:24px;} .dinheiro{font-size:36px;}
    .card-topo{padding:20px 20px 0;} .card-acoes,.exec,.det-corpo{padding-left:20px;padding-right:20px;}
    details summary{padding-left:20px;padding-right:20px;}
    .hide-sm{display:none;}
    .btn{width:100%;} .btn-ghost{width:100%;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;} .pulse{animation:none;}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="mark">B</div>
    <h1>Barbearia Stylo de Minas</h1>
  </div>
</header>

<main>
  <div id="estado" class="estado"><div class="pulse"></div><h3>Analisando seu negócio</h3><p>Lendo os atendimentos e cruzando com o histórico.</p></div>
  <div id="conteudo" class="hidden">
    <div class="abertura carta" id="abertura"></div>
    <div class="plano" id="plano"></div>
    <div id="cards"></div>
    <div class="fecho carta" id="fecho"></div>
  </div>
</main>

<div class="foot" id="rodape"></div>
<script>
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxmzzwhr-J4SkNQLhYJtyG5CychRBgJ6ercnmCAFL54J9EO0pATDBvLh-U324Kuq2CJ/exec",
  TOKEN: "Kauemancha35*",   // fica inerte quando o auth.js entrar; trocado no Apps Script
  DONO: "",
  COMISSAO: 50              // % do faturamento que vai para o profissional
};

let D = null, LISTAS = {};

const brl  = v => 'R$ ' + Math.round(v || 0).toLocaleString('pt-BR');
const brlc = v => (v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const int  = v => Math.round(v || 0).toLocaleString('pt-BR');
const pc   = v => String(v).replace('.', ',') + '%';
const n1   = v => Number(v).toFixed(1).replace('.', ',');
const dt   = s => { const [a,m,d] = s.split('-'); return `${d}/${m}`; };
const dtf  = s => { const [a,m,d] = s.split('-'); return `${d}/${m}/${a}`; };

/* Nome de cliente com aspas ou sinal de maior vinha da planilha direto para
   dentro do HTML e estragava o layout da linha. Tudo que vem da base passa
   por aqui uma vez, na chegada. */
function limpar(v){
  if (typeof v === 'string') return v.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if (Array.isArray(v)) return v.map(limpar);
  if (v && typeof v === 'object'){ const o = {}; for (const k in v) o[k] = limpar(v[k]); return o; }
  return v;
}

function saudacao(){
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}
function hojeExtenso(){
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  const mes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = new Date();
  return dias[d.getDay()] + ', ' + d.getDate() + ' de ' + mes[d.getMonth()];
}

function tabela(cols, linhas){
  return `<div class="scroll"><table><thead><tr>` +
    cols.map(c => `<th class="${c.r?'r':''} ${c.sm?'hide-sm':''}">${c.t}</th>`).join('') +
    `</tr></thead><tbody>` +
    linhas.map(l => '<tr>' + l.map((v,k) => `<td class="${cols[k].r?'r':''} ${cols[k].sm?'hide-sm':''}">${v}</td>`).join('') + '</tr>').join('') +
    `</tbody></table></div>`;
}

/* Os dois dias mais fracos da semana, que é onde a cadeira está vaga.
   Servem para o convite: preencher terça não tira ninguém do sábado. */
function diasFracos(){
  const ordem = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  return (D.dias.lista || []).filter(d => !d.pico)
    .sort((a,b) => a.rec_dia - b.rec_dia).slice(0,2)
    .sort((a,b) => ordem.indexOf(a.dia) - ordem.indexOf(b.dia));
}

/* ---------- montagem de um card ---------- */
function card(o, hero){
  const el = document.createElement('section');
  el.className = 'card' + (hero ? ' hero' : ' compacta');
  el.dataset.id = o.id;

  const corpo = `
    <div class="card-corpo" ${hero ? '' : 'style="display:none"'}>
      <div class="card-topo" ${hero ? '' : 'style="padding-top:0"'}>
        ${hero ? '' : `<div style="height:1px;background:var(--border);margin:0 0 18px"></div>`}
        <div class="bloco"><p class="rot">O que está acontecendo</p><p>${o.resumo}</p></div>
        <div class="bloco"><p class="rot">Por que isso importa</p><p class="dim">${o.porque}</p></div>
        <div class="reco"><p class="rot">O que eu faria</p><p>${o.recomendacao}</p></div>
      </div>
      <div class="card-acoes">
        <button class="btn btn-primary" data-exec="${o.id}">${o.botao}</button>
        <span class="toast"></span>
      </div>
      <div class="exec" id="exec-${o.id}">${o.execucao}
        <div style="margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
          ${o.copiar ? `<button class="btn btn-ghost" data-copy="${o.copiar}">Copiar a lista de contatos</button>` : ''}
          ${o.msgId ? `<button class="btn btn-ghost" data-copymsg="${o.msgId}">Copiar a mensagem</button>` : ''}
          <span class="toast"></span>
        </div>
      </div>
      ${o.detalhes ? `<details><summary>Ver os números por trás disso</summary><div class="det-corpo">${o.detalhes}
        <div class="calc" style="margin-top:18px">
          <div><dt>Regra</dt><dd>${o.regra}</dd></div>
          <div><dt>Impacto</dt><dd>${o.formula}</dd></div>
          <div><dt>Ressalva</dt><dd class="ress">${o.ressalva}</dd></div>
        </div></div></details>` : ''}
    </div>`;

  if (hero){
    el.innerHTML = `
      <div class="card-topo">
        <span class="selo s-${o.selo}"><span class="d"></span>${o.seloTxt}</span>
        <h3>${o.titulo}</h3>
        <p class="dinheiro-rot">${o.dinheiroRot}</p>
        <p class="dinheiro num">${o.dinheiro}</p>
      </div>` + corpo;
  } else {
    el.innerHTML = `
      <div class="card-topo" data-abrir="${o.id}">
        <div class="compacta-main">
          <span class="selo s-${o.selo}" style="margin-bottom:8px"><span class="d"></span>${o.seloTxt}</span>
          <h3>${o.titulo}</h3>
          <p class="sub">${o.linha}</p>
        </div>
        <div class="compacta-dir"><p class="dinheiro-rot">${o.dinheiroRot}</p><p class="dinheiro num">${o.dinheiro}</p></div>
        <span class="chev">⌄</span>
      </div>` + corpo;
  }
  return el;
}

/* ================= construção dos cards ================= */
function construir(){
  const cards = [];
  const saidas = D.parados.filter(p => p.leitura === 'saida');
  const ferias = D.parados.filter(p => p.leitura === 'ferias');
  const orfaos = saidas.reduce((s,p) => s + p.sem_contato, 0);
  const mensalOrfa = saidas.reduce((s,p) => s + p.mensal, 0);
  LISTAS.orfa = saidas.flatMap(p => p.lista.map(c => Object.assign({era:p.prof}, c)));

  /* o mesmo cliente estava sendo contado no card de carteira órfã e no de
     carteira em risco, e os dois valores somavam na abertura */
  const jaNaOrfa = {};
  LISTAS.orfa.forEach(c => jaNaOrfa[c.fone] = 1);
  const riscoLista = D.risco.lista.filter(c => !jaNaOrfa[c.fone]);
  const riscoHist = riscoLista.reduce((s,c) => s + c.receita, 0);
  const riscoMensal = Math.round(riscoHist / D.meta.meses);
  const sobrepostos = D.risco.lista.length - riscoLista.length;
  LISTAS.risco = riscoLista;

  const fracos = diasFracos();
  const nomeFraco = i => fracos[i] ? fracos[i].dia.toLowerCase() : '';
  const doisDias = fracos.length > 1 ? `${nomeFraco(0)} ou ${nomeFraco(1)}`
                 : fracos.length ? nomeFraco(0) : 'esta semana';

  /* ---- 1. carteira órfã ---- */
  if (saidas.length && orfaos > 0){
    const qualificados = D.cancel.por_prof.filter(p => saidas.map(s => s.prof).indexOf(p.prof) < 0)
                                          .sort((a,b) => a.taxa - b.taxa);
    const ativo = qualificados[0] || null;
    const saiu = saidas[0].prof;
    cards.push({
      id:'orfa', selo:'urgente', seloTxt:'Sua maior oportunidade hoje',
      valor: mensalOrfa,
      dinheiro: brl(mensalOrfa) + '/mês', dinheiroRot:'Receita em risco',
      titulo:'Recupere os clientes de quem saiu',
      linha:`${orfaos} clientes ficaram sem profissional`,
      resumo:`Encontrei <b>${orfaos} clientes fiéis</b> que ficaram sem profissional e até agora não foram remarcados com mais ninguém.`,
      porque:`Cliente de barbearia é fiel à pessoa antes de ser fiel ao salão, e cada um desses escolhia sempre o mesmo profissional. ` +
        `O cliente típico daqui volta a cada ${D.meta.ciclo} dias, então essa gente já está no ponto de precisar cortar. ` +
        `Quem não receber um contato seu vai procurar onde essa pessoa foi trabalhar, e a partir daí você não traz mais de volta.`,
      recomendacao:`Minha recomendação é falar com esses clientes ainda hoje, oferecendo um profissional pelo nome, nunca "a equipe". ` +
        `${ativo ? `Eu ofereceria a agenda de ${ativo.prof}, que tem a menor taxa de cancelamento entre os que continuam na casa. ` : ''}` +
        `E não anuncie a saída para quem não perguntou: quem ainda não percebeu a ausência não precisa receber de você o motivo para procurar o profissional em outro lugar. ` +
        `Comece pelos que mais gastaram: são os primeiros da lista e os que você menos pode perder.`,
      botao:'Resolver agora', copiar:'orfa', msgId:'msg-orfa',
      plano:{ acao:`Ligaria hoje mesmo para os ${orfaos} clientes que ficaram sem profissional, começando pelos que mais gastam.`,
              minutos: Math.max(30, Math.round(orfaos * 1.5 / 15) * 15) },
      execucao: `<h4>Como fazer</h4><ol class="passos">
          <li>Copie os contatos no botão ao lado e cole no WhatsApp Web.</li>
          <li>Use a primeira mensagem com todo mundo. Ela convida sem tocar no assunto da saída.</li>
          <li>Ofereça ${doisDias}, que são seus dias mais vazios. Convidar para ${(D.meta.dias_pico[0]||'sexta').toLowerCase()} preenche uma cadeira que já ia ser ocupada.</li>
          <li>Se o cliente perguntar pelo profissional, aí sim responda com a verdade, usando o segundo texto. Esconder quando perguntam gera desconfiança.</li>
        </ol>
        <p class="msg-rot">Mensagem para todos</p>
        <div class="msg" id="msg-orfa">Oi [nome], aqui é da Barbearia Stylo de Minas.

Estou organizando a agenda da semana e separei um horário para você${ativo ? ' com o ' + ativo.prof : ''}.

Tenho ${doisDias}. Qual dos dois fica melhor para você? Me diz o horário e eu já deixo reservado.</div>
        <p class="msg-rot">Só se ele perguntar por ${saiu}</p>

Quem está com a agenda aberta essa semana é o ${ativo ? ativo.prof : '[profissional]'}, e eu queria muito que você continuasse cortando com a gente.

Posso reservar ${doisDias} para você?</div>
`,
      detalhes: tabela(
        [{t:'Profissional'},{t:'Situação'},{t:'Parado há',r:1},{t:'Clientes fiéis',r:1},{t:'Sem contato',r:1},{t:'Receita/mês',r:1}],
        D.parados.map(p => [p.prof,
          `<span class="flag ${p.leitura === 'saida' ? 'f-bad' : 'f-mid'}">${p.leitura === 'saida' ? 'Saída' : 'Férias'}</span>`,
          `<span class="num">${p.ausente} dias</span>`, `<span class="num">${p.ativos}</span>`,
          `<span class="num">${p.sem_contato}</span>`, `<span class="num">${brl(p.mensal)}</span>`])) +
        `<p style="font-size:11.5px;color:var(--muted);margin:16px 0 8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700">Os dez que mais gastaram</p>` +
        tabela([{t:'Cliente'},{t:'Era de',sm:1},{t:'WhatsApp',sm:1},{t:'Visitas',r:1},{t:'Última',r:1},{t:'Já gastou',r:1}],
          LISTAS.orfa.slice(0,10).map(c => [c.nome, c.era, `<span class="fone">${c.fone}</span>`,
            `<span class="num">${c.visitas}</span>`, `<span class="num">${dt(c.ultima)}</span>`,
            `<span class="num" style="color:var(--brass)">${brl(c.receita)}</span>`])),
      regra:`Profissional com histórico relevante que passou dias sem atender. Bloqueio de agenda cobrindo o período indica férias; parada sem bloqueio indica saída. Cliente fiel é quem fez duas visitas ou mais e escolheu essa pessoa em pelo menos 60% delas.`,
      formula:`Receita histórica dos clientes ativos da carteira dividida pelos ${n1(D.meta.meses)} meses da base.`,
      ressalva:'A diferença entre férias e saída é lida pelo padrão da agenda, não vem preenchida no seu aplicativo. Confirme antes de tratar alguém como desligado. A lista some sozinha conforme a recepção remarca.'
    });
  }

  /* ---- 2. cancelamento ---- */
  const rank = (D.cancel.por_prof || []).slice();
  const pior = rank[0] || null, melhor = rank.length > 1 ? rank[rank.length-1] : null;
  const razao = (melhor && melhor.taxa > 0) ? pior.taxa / melhor.taxa : null;
  const picoTxt = (D.meta.dias_pico || []).join(' e ').toLowerCase() || 'seus dias cheios';
  const sinal = Math.max(10, Math.round(D.meta.ticket * 0.4 / 5) * 5);
  cards.push({
    id:'cancel', selo:'semana', seloTxt:'Esta semana',
    valor: D.mensal.cancel,
    dinheiro: brl(D.mensal.cancel) + '/mês', dinheiroRot:'Receita perdida',
    titulo:'Proteja seus horários de pico',
    linha:`cadeira parada em dia cheio`,
    resumo:`De cada dez horários marcados, ${Math.round(D.cancel.taxa/10)} são desmarcados, e boa parte cai justamente em ${picoTxt}, quando você tem fila.`,
    porque:`Horário cancelado em dia cheio não se recupera: a cadeira fica parada e o aluguel, a luz e a equipe continuam correndo. ` +
      (melhor && razao ? `E não é característica do mercado, é prática de cada um. ${melhor.prof} cancela <b>${pc(melhor.taxa)}</b> enquanto ${pior.prof} chega a <b>${pc(pior.taxa)}</b>, ` +
        `${razao >= 1.5 ? `quase ${n1(razao)} vezes mais, ` : ''}com a mesma clientela e o mesmo aplicativo. ` : '') +
      `Quando marcar não custa nada, desmarcar também não custa.`,
    recomendacao:`Minha recomendação é começar pela confirmação por WhatsApp 24 horas antes, só em ${picoTxt}, que é onde o horário vazio dói. ` +
      `Se em duas semanas o número não cair, aí eu passaria a cobrar um sinal de ${brl(sinal)} nesses dias, abatido no valor do serviço. ` +
      (melhor ? `E antes de qualquer coisa, eu sentaria com ${melhor.prof} para entender o que está sendo feito de diferente, porque a resposta já está dentro de casa.` : ''),
    botao:'Resolver agora', msgId:'msg-cancel',
    plano:{ acao:`Mandaria a recepção confirmar, uma por uma, todas as marcações de ${picoTxt} desta semana.`,
            minutos: 20 },
    execucao:`<h4>Como fazer</h4><ol class="passos">
        <li>Comece só por ${picoTxt}. Mudar a regra da semana inteira de uma vez gera atrito com cliente antigo sem necessidade.</li>
        <li>A recepção manda a confirmação na véspera, no fim da tarde, e libera o horário se não houver resposta até a manhã seguinte.</li>
        <li>Depois de duas semanas, compare a taxa de cancelamento antes e depois antes de estender para os outros dias.</li>
      </ol>
      <h4 style="margin-top:18px">Mensagem de confirmação</h4>
      <div class="msg" id="msg-cancel">Oi [nome], tudo bem?

Confirmando seu horário amanhã às [hora] com o [profissional] aqui na Stylo de Minas.

Responde com um "ok" para eu manter reservado. Se não der para vir, me avisa que eu libero para outra pessoa.</div>
`,
    detalhes: rank.length ? tabela(
      [{t:'Profissional'},{t:'Realizados',r:1},{t:'Cancelados',r:1},{t:'Taxa',r:1}],
      rank.map(p => [p.prof, `<span class="num">${int(p.realiz)}</span>`, `<span class="num">${int(p.canc)}</span>`,
        `<span class="flag ${p.taxa>30?'f-bad':p.taxa>15?'f-mid':'f-ok'}">${pc(p.taxa)}</span>`]))
      : '<p style="font-size:13px;color:var(--muted)">Nenhum profissional tem volume suficiente para entrar nesta comparação.</p>',
    regra:'Cancelamentos sobre o total de horários realizados ou cancelados, por profissional. Bloqueio de agenda fica de fora.',
    formula:`${D.cancel.pico_nao_preench} cancelamentos de ${picoTxt} que não viraram encaixe, vezes o ticket médio de ${brlc(D.meta.ticket)}, divididos pelos ${n1(D.meta.meses)} meses da base.`,
    ressalva:`Contamos só ${picoTxt}, os dias com fila. Pela semana inteira daria ${brl(D.cancel.perda)}, mas aí a conta assume que todo horário vago seria vendido. Desmarcação em bloco por saída de profissional também entra aqui como cancelamento, e não é a mesma coisa.`
  });

  /* ---- 3. carteira em risco ---- */
  if (riscoLista.length){
    const primeiros = Math.min(20, riscoLista.length);
    cards.push({
      id:'risco', selo:'semana', seloTxt:'Esta semana',
      valor: riscoMensal,
      dinheiro: brl(riscoMensal) + '/mês', dinheiroRot:'Receita recuperável',
      titulo:'Recupere estes clientes',
      linha:`${riscoLista.length} clientes passaram do tempo de voltar`,
      resumo:`Encontrei <b>${riscoLista.length} clientes bons</b> que já passaram do tempo normal <i>deles</i> de voltar e correm risco de não voltar mais.`,
      porque:`Cada um desses tem um ritmo próprio, e o sistema compara cada cliente com o hábito dele mesmo, não com a média da casa. ` +
        `Quem vinha a cada duas semanas e sumiu há um mês é um sinal tão forte quanto quem vinha a cada dois meses e sumiu há quatro. ` +
        `Quem passa do próprio ciclo raramente volta sozinho: ou já cortou em outro lugar, ou algo na última visita não agradou. ` +
        `Juntos, eles já deixaram ${brl(riscoHist)} na sua barbearia.`,
      recomendacao:`Minha recomendação é falar com os ${primeiros} primeiros da lista ainda esta semana, que são os de maior valor, em vez de disparar para todos de uma vez. ` +
        `Ofereça ${doisDias}, que são os dias em que você tem cadeira vaga. ` +
        `E eu não daria desconto na primeira mensagem: desconto ensina o cliente a sumir para ganhar preço.`,
      botao:'Enviar WhatsApp', copiar:'risco', msgId:'msg-risco',
      plano:{ acao:`Escreveria para os ${primeiros} clientes de maior valor que passaram do tempo de voltar.`,
              minutos: 30 },
      execucao:`<h4>Como fazer</h4><ol class="passos">
          <li>Copie os contatos e comece pelos ${primeiros} primeiros, que são os que mais gastaram.</li>
          <li>Não ofereça desconto na primeira mensagem. Desconto ensina o cliente a sumir para ganhar preço.</li>
          <li>Se em três dias ele não responder, aí sim vale um agrado, como barba ou sobrancelha por conta na volta.</li>
        </ol>
        <h4 style="margin-top:18px">Mensagem sugerida</h4>
        <div class="msg" id="msg-risco">Oi [nome], tudo certo?

Vi aqui que faz um tempo desde seu último corte com a gente e fiquei com a sensação de que a gente deixou passar.

Tenho ${doisDias} com horário livre. Quer que eu reserve um para você?</div>
`,
      detalhes: tabela(
        [{t:'Cliente'},{t:'WhatsApp',sm:1},{t:'Sem vir há',r:1},{t:'Costuma voltar em',r:1,sm:1},{t:'Visitas',r:1,sm:1},{t:'Já gastou',r:1}],
        riscoLista.slice(0,15).map(c => [c.nome, `<span class="fone">${c.fone}</span>`,
          `<span class="num">${c.dias} dias</span>`,
          `<span class="num">${c.ciclo_ref ? c.ciclo_ref + ' dias' : '—'}</span>`,
          `<span class="num">${c.visitas}</span>`,
          `<span class="num" style="color:var(--brass)">${brl(c.receita)}</span>`])),
      regra:`Duas visitas ou mais, e última visita entre o dobro e o quíntuplo do ciclo do próprio cliente. Quem tem menos de três visitas, e portanto pouco histórico, é medido pelo ciclo da casa, de ${D.meta.ciclo} dias.`,
      formula:`Receita histórica do grupo, ${brl(riscoHist)}, dividida pelos ${n1(D.meta.meses)} meses da base.`,
      ressalva:`Parte dessa gente volta sozinha, sem você fazer nada, então o valor é teto e não previsão. ` +
        (sobrepostos ? `Outros ${sobrepostos} clientes atrasados ficaram de fora daqui porque já aparecem na carteira órfã, e contar duas vezes inflaria o total. ` : '') +
        `Como a base é atualizada por exportação, confira antes de mandar, para não escrever para quem cortou semana passada.`
    });
  }

  /* ---- 4. preço ---- */
  const pr = D.preco, h = pr.historico || [];
  if (h.length >= 2 && pr.tabela && pr.tabela.length){
    const h0 = h[0], hC = h[h.length-2];
    const crescDia = (h0.atend_dia && hC.atend_dia) ? Math.round((hC.atend_dia / h0.atend_dia - 1) * 100) : null;
    const lucro = Math.round(pr.ganho_mes * (100 - CONFIG.COMISSAO) / 100);
    const perda = pr.reajuste_efetivo / (100 + pr.reajuste_efetivo) * 100;
    const picoDia = (D.dias.lista || []).filter(d => d.pico).sort((a,b) => b.media - a.media)[0];
    cards.push({
      id:'preco', selo:'decisao', seloTxt:'Decisão do mês',
      valor: lucro,
      dinheiro: brl(lucro) + '/mês', dinheiroRot:'Lucro potencial',
      titulo:'Aumente seu ticket médio',
      linha:`${pr.meses_congelado} meses com o mesmo preço`,
      resumo:`O preço do ${pr.servico_principal} não muda há ${pr.meses_congelado} meses` +
        (crescDia !== null ? `, enquanto o movimento por dia aberto ${crescDia >= 0 ? 'cresceu' : 'caiu'} ${Math.abs(crescDia)}% no mesmo período.` : '.'),
      porque:`Todo o seu crescimento veio de encher cadeira, nenhum veio de preço, e cadeira tem limite. ` +
        (picoDia ? `Em ${picoDia.dia.toLowerCase()} a casa já faz ${n1(picoDia.media)} atendimentos por dia aberto, o maior número da semana. ` : '') +
        (pr.cadeira_no_topo ? `A receita por cadeira ativa está no ponto mais alto de toda a série. ` : '') +
        `Daqui para frente, crescer sem mexer no preço só é possível contratando gente.`,
      recomendacao:`Minha recomendação é subir a tabela cerca de ${pc(pr.reajuste_efetivo)}, com preços redondos, e eu deixaria essa decisão para depois de resolver os clientes parados. ` +
        `Você pode perder até ${n1(perda)}% do movimento que o aumento ainda compensa. Avise duas semanas antes, combine com a equipe primeiro, e não peça desculpa pelo reajuste.`,
      botao:'Aprovar nova tabela',
      plano:{ acao:`Fecharia a nova tabela de preços e combinaria com a equipe antes de avisar o cliente.`,
              minutos: 45 },
      execucao:`<h4>Como fazer</h4><ol class="passos">
          <li>Combine com a equipe antes do cliente saber. Com comissão de ${CONFIG.COMISSAO}%, ${CONFIG.COMISSAO >= 50 ? 'boa parte' : 'parte'} do aumento vai para eles, então é fácil ter apoio.</li>
          <li>Avise duas semanas antes, com cartaz e aviso no agendamento. Cliente que descobre o preço novo na hora de pagar não volta.</li>
          <li>Acompanhe quatro semanas. Se perder menos de ${n1(perda)}% do movimento, o aumento se pagou.</li>
        </ol>`,
      detalhes:
        `<p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700">Tabela sugerida</p>` +
        tabela([{t:'Serviço'},{t:'Hoje',r:1},{t:'Novo',r:1},{t:'Por mês',r:1,sm:1},{t:'A mais',r:1}],
          pr.tabela.filter(t => t.ganho > 0).slice(0,10).map(t => [`<span class="cap">${t.servico}</span>`,
            `<span class="num">R$ ${t.atual}</span>`,
            `<span class="num" style="color:var(--brass);font-weight:600">R$ ${t.novo}</span>`,
            `<span class="num">${n1(t.qtd)}</span>`,
            `<span class="num">${brl(t.ganho)}</span>`])) +
        `<p style="font-size:11.5px;color:var(--muted);margin:18px 0 8px;letter-spacing:.08em;text-transform:uppercase;font-weight:700">Preço e procura, mês a mês</p>` +
        tabela(
        [{t:'Mês'},{t:`Preço do ${pr.servico_principal}`,r:1},{t:'Atendimentos',r:1},{t:'Por dia aberto',r:1,sm:1},{t:'Ticket médio',r:1,sm:1},{t:'Por cadeira ativa',r:1}],
        h.map(x => [`<span class="cap">${['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][Number(x.mes.slice(5))-1]}</span>`,
          `<span class="num" style="color:var(--burgundy);font-weight:600">${x.preco ? 'R$ ' + x.preco : '—'}</span>`,
          `<span class="num">${int(x.atend)}</span>`, `<span class="num">${n1(x.atend_dia)}</span>`,
          `<span class="num">${brlc(x.ticket)}</span>`,
          `<span class="num">${brl(x.cadeira_dia)}</span>`])),
      regra:'Preço vigente é o valor mais frequente de cada serviço nos últimos três meses cheios, não a média, que desce por causa de descontos pontuais. O novo é o primeiro múltiplo de cinco acima de mais 10%.',
      formula:`Diferença de preço vezes o volume de cada serviço, menos a comissão de ${CONFIG.COMISSAO}% sobre a receita adicional.`,
      ressalva:'Não dá para medir a reação do cliente nesta base, porque o preço nunca mudou. A leitura de que existe folga é indireta: procura subindo com preço parado e cadeira quase cheia. O primeiro reajuste é sempre o que gera mais reação.'
    });
  }

  return cards;
}

/* ================= render ================= */
function render(){
  const cards = construir();
  if (!cards.length) return falhar('Não encontrei oportunidades',
    'A base foi lida, mas nenhum dos cards tem dado suficiente para uma recomendação honesta.');

  const total = cards.reduce((s,c) => s + (c.valor || 0), 0);

  /* ---------- carta de abertura ---------- */
  document.getElementById('abertura').innerHTML = `
    <p class="data">${hojeExtenso()}</p>
    <h2>${saudacao()}${CONFIG.DONO ? ', ' + CONFIG.DONO : ''}. Passei a manhã olhando a sua barbearia.</h2>
    <p>Li um por um os ${int(D.meta.realizados)} atendimentos dos últimos ${n1(D.meta.meses)} meses, cliente por cliente, dia por dia.
       Somando o que dá para recuperar e o que dá para ganhar, tem algo perto de <em>${brl(total)} por mês</em> em jogo aí dentro.
       É o teto de cada oportunidade somado, não o que vai entrar no caixa.</p>
    <p>Separei ${cards.length} ${cards.length === 1 ? 'recomendação' : 'recomendações'} e coloquei na ordem em que eu mesmo resolveria se a barbearia fosse minha.
       Não precisa fazer tudo hoje. Precisa fazer a primeira.</p>`;

  /* ---------- o que eu faria hoje ---------- */
  const prioridades = cards.slice(0, 3);
  document.getElementById('plano').innerHTML = `
    <h3>O que eu faria hoje</h3>
    <p class="intro">Se eu tivesse só uma manhã na sua barbearia, faria exatamente ${prioridades.length === 3 ? 'estas três coisas' : 'isto'}, nesta ordem:</p>` +
    prioridades.map((c, i) => `
      <div class="passo">
        <div class="n num">${i + 1}</div>
        <div class="txt">
          <p>${c.plano.acao}</p>
          <div class="meta">
            <span>Impacto: <b>${c.dinheiro}</b></span>
            <span class="t">Tempo: <b>cerca de ${tempoRotulo(c.plano.minutos)}</b></span>
          </div>
        </div>
      </div>`).join('');

  /* ---------- cards ---------- */
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  wrap.appendChild(el('div', 'faixa', '<span class="txt">A primeira, em detalhe</span><span class="rule"></span>'));
  wrap.appendChild(card(cards[0], true));

  const fracos = diasFracos();
  const parados = LISTAS.orfa.length + LISTAS.risco.length;
  const melhorDia = Math.max(...(D.dias.lista || []).map(x => x.rec_dia), 0);
  if (fracos.length > 1 && parados > 0 && melhorDia){
    wrap.appendChild(el('div', 'cruza',
      `<p class="rot">Minha leitura, juntando as duas coisas</p>
       <p>Você tem <b>${parados} clientes parados</b> para chamar e <b>${fracos[0].dia.toLowerCase()} e ${fracos[1].dia.toLowerCase()}</b> rodando
          com ${Math.round((1 - fracos[0].rec_dia / melhorDia) * 100)}% menos movimento que o melhor dia.
          É por isso que as mensagens já oferecem esses dois dias: você preenche cadeira vazia sem tirar ninguém do fim de semana, que já está cheio.</p>`));
  }

  if (cards.length > 1){
    wrap.appendChild(el('div', 'faixa', '<span class="txt">As outras, quando puder</span><span class="rule"></span>'));
    cards.slice(1).forEach(c => wrap.appendChild(card(c, false)));
  }

  /* ---------- se esta fosse minha barbearia ---------- */
  document.getElementById('fecho').innerHTML = fecho(cards, total);

  document.getElementById('rodape').innerHTML =
    `Olhei ${int(D.meta.registros)} atendimentos seus, de ${dtf(D.meta.inicio)} a ${dtf(D.meta.ref)}. ` +
    `Os valores são o teto de cada oportunidade: servem para você saber por onde começar, não como meta de faturamento. ` +
    `Cliente que aparece em mais de uma lista é contado uma vez só.`;
}

/* tempo estimado de execução, para o plano do dia */
function tempoRotulo(min){
  if (min < 60) return min + ' minutos';
  const h = Math.round(min / 30) / 2;
  return (h === 1 ? '1 hora' : String(h).replace('.', ',') + ' horas');
}

/* texto de fecho, escolhido conforme o que a barbearia está vivendo */
function fecho(cards, total){
  const saidas = D.parados.filter(p => p.leitura === 'saida');
  const ferias = D.parados.filter(p => p.leitura === 'ferias');
  const cc = D.cancel;
  const primeiro = cards[0], ultimo = cards[cards.length - 1];

  let diagnostico;
  if (saidas.length){
    diagnostico = `<p>Se esta fosse minha barbearia, eu não perderia um minuto olhando preço nem promoção esta semana.
      O seu problema deste mês não está nos números, está nas pessoas. Você perdeu ${saidas.length === 1 ? 'um profissional' : saidas.length + ' profissionais'}${ferias.length ? `, está com ${ferias.map(f => f.prof).join(' e ')} de férias` : ''},
      e ficou com uma carteira de clientes que ninguém está cuidando.</p>
      <p>E olha o detalhe que eu acho mais importante de tudo: sua procura <b>não caiu</b>. Cada cadeira ocupada continua rendendo,
      ou seja, o cliente continua querendo vir. O que faltou foi gente para atender.</p>`;
  } else if (cc.taxa >= 25){
    diagnostico = `<p>Se esta fosse minha barbearia, eu começaria pela agenda, não pelo caixa.
      ${pc(cc.taxa)} dos horários marcados são desmarcados, e enquanto isso continuar, tudo que você fizer para trazer cliente
      vai vazar pelo mesmo buraco.</p>
      <p>Repare que não é característica do mercado: dentro da sua própria equipe tem gente cancelando muito menos que os outros.
      A solução já está dentro de casa, só não virou regra ainda.</p>`;
  } else {
    diagnostico = `<p>Se esta fosse minha barbearia, eu olharia primeiro para quem já foi meu cliente e parou de vir.
      Trazer de volta quem já conhece a casa custa uma fração do que custa conquistar alguém novo, e você tem uma lista pronta esperando.</p>`;
  }

  const ordem = cards.length < 2 ? '' :
    `<p>Sobre a ordem: coloquei "${primeiro.titulo}" em primeiro lugar mesmo não sendo o maior valor da lista.
      Fiz isso de propósito. Cliente parado tem prazo de validade, e o cliente típico daqui volta a cada ${D.meta.ciclo} dias.
      Se você deixar para a semana que vem, boa parte dessa gente já terá cortado o cabelo em outro lugar, e aí não adianta mais ligar.
      Já "${ultimo.titulo}" pode esperar quinze dias sem perder nada:
      ${brl(ultimo.valor)} por mês vão continuar ali quando você chegar.</p>
    <p>É essa a lógica: primeiro o que evapora, depois o que espera.</p>`;

  const soma3 = cards.slice(0,3).reduce((s,c) => s + (c.valor || 0), 0);
  const fechamento = `<p>Fazendo as ${Math.min(cards.length,3)} coisas da manhã, você mexe em algo perto de
      <em>${brl(soma3)} por mês</em>.
      Não vai capturar tudo, ninguém captura. Mas metade disso já paga bem mais do que o tempo que você vai gastar.</p>
    <p>Comece pela ligação. O resto eu te mostro depois que você fizer essa parte.</p>`;

  return `<h3>Se esta fosse minha barbearia&hellip;</h3>` + diagnostico + ordem + fechamento +
    `<p class="assina">Analisei seus números até ${dtf(D.meta.ref)}.
       Se quiser conferir tudo, mês a mês, <a href="financeiro.html">seus números completos estão aqui</a>.</p>`;
}

/* ================= interação ================= */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-abrir], [data-exec], [data-copy], [data-copymsg]');
  if (!btn) return;
  const cardEl = btn.closest('.card');

  if (btn.dataset.abrir !== undefined && btn.dataset.abrir !== ''){
    const corpo = cardEl.querySelector('.card-corpo');
    const aberto = cardEl.classList.toggle('aberta');
    corpo.style.display = aberto ? 'block' : 'none';
    return;
  }
  if (btn.dataset.exec){
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    const ex = document.getElementById('exec-' + btn.dataset.exec);
    const on = ex.classList.toggle('on');
    btn.textContent = on ? 'Fechar' : btn.dataset.label;
    return;
  }
  const toast = cardEl ? cardEl.querySelector('.toast') : null;
  const aviso = (t) => { if (!toast) return; toast.textContent = t; toast.classList.add('on');
                         setTimeout(() => toast.classList.remove('on'), 2600); };
  if (btn.dataset.copy){
    const lista = LISTAS[btn.dataset.copy] || [];
    navigator.clipboard.writeText(lista.map(c => `${c.nome}\t${c.fone}`).join('\n'))
      .then(() => aviso(lista.length + ' contatos copiados'))
      .catch(() => aviso('O navegador bloqueou a cópia'));
  }
  if (btn.dataset.copymsg){
    const alvo = document.getElementById(btn.dataset.copymsg);
    if (!alvo) return aviso('Mensagem não encontrada');
    navigator.clipboard.writeText(alvo.textContent).then(() => aviso('Mensagem copiada')).catch(() => aviso('O navegador bloqueou a cópia'));
  }
});

function el(tag, cls, html){ const e = document.createElement(tag); e.className = cls; e.innerHTML = html; return e; }

function falhar(t, d){
  const e = document.getElementById('estado');
  e.classList.remove('hidden');
  e.className = 'estado erro'; e.innerHTML = `<h3>${t}</h3><p>${d}</p>`;
  document.getElementById('conteudo').classList.add('hidden');
}

async function carregar(){
  try {
    const r = await fetch(CONFIG.APPS_SCRIPT_URL + '?token=' + encodeURIComponent(CONFIG.TOKEN) + '&modo=cards');
    if (!r.ok) throw new Error('resposta ' + r.status);
    const dados = await r.json();
    if (dados.erro) return falhar('A planilha respondeu com erro', dados.erro);
    D = limpar(dados);
    document.getElementById('estado').classList.add('hidden');
    document.getElementById('conteudo').classList.remove('hidden');
    render();
  } catch (err){
    falhar('Não consegui montar suas recomendações',
      'A planilha respondeu, mas algo travou no caminho. Detalhe técnico: ' + String(err.message || err));
  }
}
carregar();
</script>
